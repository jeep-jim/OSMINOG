name: Mouse 609 native menu readiness verification
on:
  push:
    branches: ['codex/mouse609-source-transport']
    paths: ['.github/workflows/mouse609-native-sync.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          git checkout --detach abc9bd23c235cf5b2d862aaa976d897bd9489d42
          python3 - <<'PY'
          from pathlib import Path
          p=Path('desktop/mouse-606-smoke.cjs');s=p.read_text()
          a="await until(()=>win.quadroChromeGuard.nativeState().menuVisible,'real Apple menu visible after OS pointer hover')";b="await until(()=>{const s=win.quadroChromeGuard.nativeState();return s.menuVisible&&s.held;},'real Apple menu visible and native hover handled after OS pointer hover')";assert s.count(a)==1;s=s.replace(a,b)
          a="win.quadroChromeGuard.sample();await sleep(200);";b="win.quadroChromeGuard.sample();await until(async()=>Math.abs(await js('document.querySelector(\".toolbar\").getBoundingClientRect().height')-(40+visible.inset))<=2,'renderer geometry acknowledges real menu');";assert s.count(a)==1;s=s.replace(a,b);p.write_text(s)
          p=Path('desktop/mouse-609-smoke.cjs');s=p.read_text();a="await until(()=>win.quadroChromeGuard.nativeState().menuVisible,'actual Apple menu reveal')";b="await until(()=>{const s=win.quadroChromeGuard.nativeState();return s.menuVisible&&s.held;},'actual Apple menu reveal and native hover state')";assert s.count(a)==1;p.write_text(s.replace(a,b))
          p=Path('docs/desktop/2026-11-15-mouse609.md');p.write_text(p.read_text()+'\nRun43667962033 остановлен старой606 проверкой: системное menuVisible ужеtrue, но held ещёfalse до обработки hover. Тест теперь требует оба действительных состояния и подтверждение той же геометрии renderer, вместо фиксированной паузы200мс. Допуск2px/реальный указатель/OS-клик сохранены; никакой принудительной подмены состояния меню. Runtime не меняется.\n')
          PY
          git diff --check
          node --check desktop/mouse-606-smoke.cjs
          node --check desktop/mouse-609-smoke.cjs
          git add desktop/mouse-606-smoke.cjs desktop/mouse-609-smoke.cjs docs/desktop/2026-11-15-mouse609.md
          git -c user.name='jeep-jim' -c user.email='yokkey@ya.ru' commit -m 'Await actual menu hover handling and unchanged geometry contract before native tab click assertions'
          git push origin HEAD:refs/heads/codex/mouse609-native-sync-candidate
