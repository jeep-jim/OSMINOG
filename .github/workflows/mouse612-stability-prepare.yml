          edit('desktop/quadro-main.cjs',"if(win.webContents.getURL()===entry)await win.webContents.executeJavaScript('globalThis.QuadroFlush?.()');","if(!win.webContents.isDestroyed()&&!win.webContents.isCrashed()&&win.webContents.getURL()===entry)await win.webContents.executeJavaScript('globalThis.QuadroFlush?.()');")
          edit('desktop/quadro-main.cjs',"{label:'Закрыть вкладку',accelerator:'Cmd+W',click:()=>send('close-tab')}","{label:'Закрыть вкладку',accelerator:'Cmd+W',click:()=>send('close-tab')},{type:'separator'},{label:'Показать локальный журнал сбоев',click:()=>shell.showItemInFolder(runtimeJournal.file)}")
          edit('desktop/quadro-main.cjs',"win.webContents.on('render-process-gone',(_e,detail)=>log('SHELL_STOPPED '+detail.reason));","const shellRecovery=require('./mouse-runtime-guard.cjs').install({win,entry,getRuntime:()=>({gate:privateMode?.current?.gate||overlayGate,busy:!!privateMode?.busy}),closing:()=>exitController.isClosing(),record:runtimeJournal.record,notify:message=>{if(!test)void dialog.showMessageBox(win,{type:'warning',message,buttons:['Закрыть']}).catch(()=>{})}});")
          edit('desktop/quadro-main.cjs',"log('QUADRO_READY '+app.getVersion());","log('QUADRO_READY '+app.getVersion());runtimeJournal.record('ready');")
          edit('desktop/quadro-main.cjs'," if(test&&(process.argv.includes('--mouse-private-smoke')", " if(test&&process.argv.includes('--mouse-runtime-smoke'))await require('./mouse-runtime-smoke.cjs')({app,win,browser,store,privateMode,shellRecovery});\n if(test&&(process.argv.includes('--mouse-private-smoke')")
          edit('desktop/quadro-build.cjs',"'mouse-612-smoke.cjs'","'mouse-612-smoke.cjs','mouse-runtime-guard.cjs','mouse-runtime-smoke.cjs'")
          Path('desktop/mouse-runtime.test.cjs').write_text('''
          'use strict';
          const test=require('node:test'),assert=require('node:assert/strict'),fs=require('node:fs'),os=require('node:os'),path=require('node:path'),vm=require('node:vm'),{EventEmitter}=require('node:events');
          const {install,journal}=require('./mouse-runtime-guard.cjs'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
          test('disposed pages ignore late native callbacks and destroyed state is safe',()=>{
           class WC extends EventEmitter{constructor(){super();this.dead=false;this.url='https://fixture.invalid/';this.navigationHistory={canGoBack:()=>{this.check();return false},canGoForward:()=>{this.check();return false}}}check(){if(this.dead)throw Error('Object has been destroyed')}getURL(){this.check();return this.url}isDestroyed(){return this.dead}setWindowOpenHandler(){}send(){this.check()}loadURL(url){this.url=url;return Promise.resolve()}close(){this.dead=true;this.emit('destroyed')}}
           class V{constructor(){this.webContents=new WC}setBorderRadius(){}setBounds(){}setVisible(){}}
           const ses={getUserAgent:()=>'',setPermissionCheckHandler(){},setPermissionRequestHandler(){},on(){}};
           const mod={exports:{}},context={module:mod,exports:mod.exports,URL,Buffer,console,setTimeout,clearTimeout,process,__dirname,require:n=>n==='electron'?{WebContentsView:V,View:V,session:{fromPartition:()=>ses}}:n==='./page-context.cjs'?{readPage:'',providerFor:()=>''}:n==='./network.cjs'?{proxyConfig:()=>({})}:n==='./connection-diagnostics.cjs'?{ConnectionDiagnostics:class{attach(){}}}:require(n)};
           vm.runInNewContext(fs.readFileSync('browser.cjs','utf8'),context);
           const win=new EventEmitter();win.webContents=new WC;win.isDestroyed=()=>false;win.getContentSize=()=>[1000,800];win.contentView={children:[],addChildView(v){this.children.push(v)},removeChildView(v){this.children=this.children.filter(x=>x!==v)}};
           const b=new mod.exports.BrowserWorkspace(win,null);b.project='test';const t=b.make('https://fixture.invalid/','test');t.view.webContents.dead=true;
           assert.doesNotThrow(()=>b.state());assert.equal(b.state().tabs[0].back,false);assert.ok(b.state().tabs[0].error);
           t.view.webContents.dead=false;b.dispose();for(const event of ['did-stop-loading','did-navigate','page-title-updated','render-process-gone'])assert.doesNotThrow(()=>t.view.webContents.emit(event));
           assert.equal(win.listenerCount('resize'),0);assert.equal(win.listenerCount('closed'),0);assert.equal(win.webContents.listenerCount('did-start-navigation'),0);assert.equal(win.contentView.children.length,0);
          });
          test('shell-only recovery is coalesced, bounded, and never quits the process',async()=>{
           const win=new EventEmitter();win.webContents=new EventEmitter();win.isDestroyed=()=>false;win.webContents.isDestroyed=()=>false;win.webContents.send=()=>{};win.webContents.executeJavaScript=async()=>{};
           let loads=0,hides=0;win.loadURL=async url=>{assert.equal(url,'file:///shell');loads++};
           const gate={hide:()=>hides++,sequence:50,blocked:true};const g=install({win,entry:'file:///shell',getRuntime:()=>({gate}),delay:5});
           win.webContents.emit('render-process-gone',{}, {reason:'crashed'});win.webContents.emit('render-process-gone',{}, {reason:'crashed'});await sleep(30);assert.equal(loads,1);assert.equal(hides,1);assert.equal(gate.blocked,false);assert.equal(gate.sequence,0);
           await g.recover();assert.equal(loads,2);await g.recover();assert.equal(loads,2);g.cleanup();win.webContents.emit('render-process-gone',{}, {reason:'crashed'});await sleep(20);assert.equal(loads,2);
          });
          test('runtime journal is bounded, content-free and does not record private mode',()=>{
           const dir=fs.mkdtempSync(path.join(os.tmpdir(),'mouse-runtime-'));let privateMode=false;
           try{const j=journal({directory:dir,version:'6.0.12',isPrivate:()=>privateMode});j.record('renderer',{reason:'crashed',exitCode:4,url:'https://secret.invalid/',message:'password'});const before=fs.readFileSync(j.file,'utf8');assert.ok(!before.includes('secret'));assert.ok(!before.includes('password'));privateMode=true;j.record('private',{reason:'crashed'});assert.equal(fs.readFileSync(j.file,'utf8'),before);privateMode=false;fs.writeFileSync(j.file,'x'.repeat(270000));j.record('ready');assert.ok(fs.statSync(j.file).size<1024);assert.ok(fs.existsSync(j.file+'.previous'));}finally{fs.rmSync(dir,{recursive:true,force:true})}
          });
          '''.lstrip())
          Path('desktop/mouse-runtime-smoke.cjs').write_text('''
          'use strict';
          const assert=require('node:assert/strict'),http=require('node:http'),fs=require('node:fs/promises');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function until(fn,label){for(let i=0;i<300;i++){try{if(await fn())return}catch{}await sleep(60)}throw Error('Runtime smoke timeout: '+label)}
          module.exports=async({app,win,browser,store,privateMode,shellRecovery})=>{
           const js=s=>win.webContents.executeJavaScript(s),server=http.createServer((req,res)=>{res.setHeader('Content-Type','text/html');res.end('<!doctype html><title>Runtime fixture</title><script>window.marker="retained-page"</script><p>Alive</p>')});
           await new Promise(r=>server.listen(0,'127.0.0.1',r));const root='http://127.0.0.1:'+server.address().port;let failed=false;
           try{
            await js(`QuadroTest.openPage(${JSON.stringify(root+'/keep')})`);await until(()=>[...browser.tabs.values()].some(t=>t.url===root+'/keep'&&!t.loading),'fixture');
            const kept=[...browser.tabs.values()].find(t=>t.url===root+'/keep'),id=kept.view.webContents.id;await js('QuadroTest.save()');
            const before=await js('QuadroTest.model.state.tabs.map(t=>t.id)');
            win.webContents.forcefullyCrashRenderer();await until(()=>!shellRecovery.isRecovering()&&!win.webContents.isCrashed()&&js('document.documentElement.dataset.quadroReady==="true"'),'shell recovery');
            assert.ok(!win.isDestroyed());assert.equal(browser.get(kept.id).view.webContents.id,id);assert.equal(await kept.view.webContents.executeJavaScript('window.marker'),'retained-page');assert.deepEqual(await js('QuadroTest.model.state.tabs.map(t=>t.id)'),before);
            const doomed=await browser.command('open',{url:root+'/doomed',lane:'side'});const wc=browser.get(doomed.id).view.webContents;await until(()=>!browser.get(doomed.id).loading,'doomed ready');wc.close({waitForBeforeUnload:false});await until(()=>wc.isDestroyed(),'destroyed');
            assert.doesNotThrow(()=>browser.state());assert.doesNotThrow(()=>browser.emit());assert.doesNotThrow(()=>browser.layout(browser.panels));await browser.command('close',{id:doomed.id});
            for(let n=0;n<20;n++){const t=await browser.command('open',{url:root+'/close-'+n,lane:'side'});await browser.command('close',{id:t.id});}
            for(let n=0;n<3;n++){win.setFullScreen(true);await until(()=>win.isFullScreen(),'fullscreen');await sleep(600);win.setFullScreen(false);await until(()=>!win.isFullScreen(),'normal');await sleep(600)}
            await privateMode.toggle();const c=privateMode.current;assert.ok(c);await c.store.set({runtimeSentinel:'PRIVATE_RUNTIME_SENTINEL_612'});await js('QuadroTest.save()');const privateIDs=await js('QuadroTest.model.state.tabs.map(t=>t.id)');
            win.webContents.forcefullyCrashRenderer();await until(()=>!shellRecovery.isRecovering()&&!win.webContents.isCrashed()&&js('document.documentElement.dataset.quadroReady==="true"'),'private shell recovery');
            assert.equal(privateMode.current,c);assert.equal(await js('document.documentElement.dataset.private'),'true');assert.deepEqual(await js('QuadroTest.model.state.tabs.map(t=>t.id)'),privateIDs);assert.equal((await c.store.get('runtimeSentinel')).runtimeSentinel,'PRIVATE_RUNTIME_SENTINEL_612');
            await privateMode.toggle();assert.equal(privateMode.current,null);assert.equal(browser.get(kept.id).view.webContents.id,id);assert.equal(await kept.view.webContents.executeJavaScript('window.marker'),'retained-page');
            await fs.writeFile('mouse-612-runtime-recovered.png',(await win.capturePage()).toPNG());
            assert.ok(!(await fs.readFile(require('node:path').join(app.getPath('userData'),'workspace.json'),'utf8')).includes('PRIVATE_RUNTIME_SENTINEL_612'));
            console.log('MOUSE_612_REAL_SHELL_CRASH_PRIVATE_RECOVERY_AND_PAGE_CLOSE_STRESS_PASS');
           }catch(e){failed=true;console.error(e)}finally{await new Promise(r=>server.close(r));app.exit(failed?1:0)}
          };
          '''.lstrip())
          p=Path('tools/quadro-verify.py');s=p.read_text();needle='# Actual older app replacement, verified new startup and a preserved runner profile.';assert needle in s
          addition="""# Independently crash only the renderer on a disposable runner profile.
          env={**os.environ,'CI':'true','QUADRO_TEST_PROFILE':str(root/'runtime-612')}
          r=subprocess.run([str(exe),'--mouse-runtime-smoke'],env=env,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=150)
          pathlib.Path('quadro-runtime-612.log').write_text(r.stdout);print(r.stdout,flush=True)
