name: Mouse Browser Windows x64
on:
  pull_request:
    paths: ['desktop/**','tools/mouse-windows*','tools/mouse-631-*.py','tools/mouse-632-*.py','tools/mouse-633-*.py','tools/mouse-634-*.py','tools/mouse-634-*.cjs','tools/mouse-635-*.py','tools/mouse-635-*.cjs','tools/mouse-636-*.py','tools/mouse-637-*.py','tools/mouse-637-*.cjs','tools/mouse-637-*.ps1','tools/test_mouse637*.py','tools/mouse-638-*','tools/test_mouse638*.py','tools/mouse-636-*.cjs','tools/test_mouse636*.py','tools/test_mouse635*.py','tools/test_mouse_634_*.py','tools/test_mouse634*.py','tools/mouse-633-*.cjs','tools/test_mouse_631_*.py','tools/test_mouse_632_*.py','tools/test_mouse_633_*.py','tools/mouse-unit-tests.cjs','.github/workflows/mouse-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mouse-windows-refs/heads/${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  mouse-windows-x64:
    # Node 22's bundled node-gyp supports the VS2022 toolchain on this image.
    # windows-latest has advanced to VS18, which that node-gyp cannot discover.
    runs-on: windows-2022
    # Added mandatory637 gates: updater720s + feature WRITE270s/READ120s.
    # Existing per-scenario deadlines remain unchanged.
    timeout-minutes: 65
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Preserve exact source bytes on Windows
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm audit --omit=dev --audit-level=high --json > mouse-windows-audit.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare native Windows runtime and owner artwork
        run: |
          $env:npm_config_python = Join-Path $env:pythonLocation 'python.exe'
          npm run prepare:runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node mouse-native-build.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node mouse-windows-icon.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run retained and Windows Mouse tests
        id: units
        # Still a mandatory release gate below. Continue only to collect native
        # installed UI diagnostics in the same run if an independent test fails.
        continue-on-error: true
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../tools/mouse-unit-tests.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test ../tools/mouse-637-update-button.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s ../tools -p test_mouse_windows_verify.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s ../tools -p test_mouse_631_acceptance.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s ../tools -p 'test_mouse638*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/test_mouse637_upgrade.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/test_mouse637_baseline_performance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/test_mouse637_update_button.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/test_mouse637_update_window.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/test_mouse636_upgrade.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/test_mouse636_baseline_performance.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Mouse Browser NSIS installer
        run: npx electron-builder --config mouse-windows-build.cjs --win nsis --x64 --publish never
      - name: Verify installed app, native UI, restart and profile preservation
        id: installed
        run: |
          python ../tools/mouse-windows-verify.py dist-mouse-windows/Mouse-Browser-6.0.38-Windows-x64.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bind verified installer bytes to source and test evidence
        if: steps.units.outcome == 'success' && steps.installed.outcome == 'success'
        run: node ../tools/mouse-windows-manifest.cjs
      - name: Require both unit and installed acceptance
        if: always()
        env:
          UNIT_OUTCOME: ${{ steps.units.outcome }}
          INSTALLED_OUTCOME: ${{ steps.installed.outcome }}
        run: |
          if ($env:UNIT_OUTCOME -ne 'success' -or $env:INSTALLED_OUTCOME -ne 'success') {
            throw "Mouse release blocked: units=$env:UNIT_OUTCOME installed=$env:INSTALLED_OUTCOME"
          }
      - uses: actions/upload-artifact@v4
        if: steps.units.outcome == 'success' && steps.installed.outcome == 'success'
        with:
          name: mouse-windows-x64-candidate
          path: |
            desktop/dist-mouse-windows/Mouse-Browser-6.0.38-Windows-x64.exe
            desktop/dist-mouse-windows/SHA256SUMS.txt
            desktop/dist-mouse-windows/mouse-windows-build.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse-windows-x64-verification
          path: |
            desktop/mouse-*.log
            desktop/mouse-*.png
            desktop/mouse-*.json
            desktop/mouse-638-*.crx
            desktop/mouse-637-library-source.txt
            desktop/mouse-637-agent-code-*.cjs
            desktop/mouse-631-upgrade/**
            desktop/mouse-637-baseline-performance/**
          if-no-files-found: warn
          retention-days: 14
  mouse-windows-x64-modern:
    # Match the fresh publisher host (currently Windows Server 2025). Reuse the
    # exact VS2022-built installer: this checks composition/runtime differences,
    # independently of the newer image's native compiler availability.
    needs: mouse-windows-x64
    runs-on: windows-latest
    # Added mandatory637 gates: updater720s + feature WRITE270s/READ120s.
    # Existing per-scenario deadlines remain unchanged.
    timeout-minutes: 65
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - name: Preserve exact source bytes on Windows
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: mouse-windows-x64-candidate
          path: desktop/dist-mouse-windows
      - uses: actions/download-artifact@v4
        with:
          name: mouse-windows-x64-verification
          path: desktop/source-windows-verification
      - name: Verify immutable installer and source evidence
        shell: python
        env:
          MOUSE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          import hashlib, json, os, platform
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          candidate = Path('dist-mouse-windows')
          name = 'Mouse-Browser-6.0.38-Windows-x64.exe'
          require({p.name for p in candidate.iterdir()} == {name, 'SHA256SUMS.txt', 'mouse-windows-build.json'},
                  'Expected the unchanged three-file source candidate')
          build = json.loads((candidate / 'mouse-windows-build.json').read_text(encoding='utf-8'))
          require((build['version'], build['platform'], build['arch']) == ('6.0.38', 'win32', 'x64'),
                  'Unexpected source candidate target')
          require(build['source'] == os.environ['MOUSE_SOURCE_SHA'] and str(build['runId']) == os.environ['GITHUB_RUN_ID'],
                  'Candidate does not belong to this exact source run')
          installer = candidate / name
          with installer.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          size = installer.stat().st_size
          require(build['package'] == {'name': name, 'size': size, 'sha256': digest},
                  'Installer bytes differ from the source manifest')
          require((candidate / 'SHA256SUMS.txt').read_text(encoding='utf-8') == digest + '  ' + name + '\n',
                  'Installer checksum file differs from the actual bytes')
          evidence_bytes = Path('source-windows-verification/mouse-windows-verification.json').read_bytes()
          evidence = json.loads(evidence_bytes)
          evidence_digest = hashlib.sha256(evidence_bytes).hexdigest()
          require(build['verification']['sha256'] == evidence_digest and build['verification']['result'] == evidence,
                  'Source verification does not match the manifest')
          require(evidence['ok'] is True and evidence['installerSha256'] == digest and evidence['installerBytes'] == size,
                  'Source installed acceptance does not bind these installer bytes')
          Path('mouse-windows-modern-input.json').write_text(json.dumps({
              'ok': True, 'source': build['source'], 'runId': build['runId'],
              'sourceRunAttempt': build['runAttempt'], 'package': build['package'],
              'sourceVerificationSha256': evidence_digest,
              'runner': {'system': platform.system(), 'release': platform.release(), 'version': platform.version(),
                         'imageOS': os.environ.get('ImageOS'), 'imageVersion': os.environ.get('ImageVersion')}
          }, indent=2) + '\n', encoding='utf-8')
          print('MOUSE_WINDOWS_MODERN_IMMUTABLE_INPUT_PASS')
      - name: Verify same installed app on modern Windows
        run: |
          python ../tools/mouse-windows-verify.py dist-mouse-windows/Mouse-Browser-6.0.38-Windows-x64.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload modern Windows verification evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse-windows-x64-modern-verification
          path: |
            desktop/mouse-*.log
            desktop/mouse-*.png
            desktop/mouse-*.json
            desktop/mouse-638-*.crx
            desktop/mouse-637-library-source.txt
            desktop/mouse-637-agent-code-*.cjs
            desktop/mouse-631-upgrade/**
            desktop/mouse-637-baseline-performance/**
          if-no-files-found: warn
          retention-days: 14
