name: OSMINOG 3.19.4 core hero and native drop recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-3194.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply 3.19.4 source changes
        run: python scripts/build_3194.py
      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/core/core-hero.webp
          test "$(stat -c%s assets/core/core-hero.webp)" -gt 20000
          node --check editor.js
          python -m json.tool manifest.json >/dev/null
          python -m json.tool OSMINOG_BUILD.json >/dev/null
          test "$(python -c 'import json;print(json.load(open("manifest.json"))["version"])')" = "3.19.4"
      - name: Commit 3.19.4 source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/build-3194.yml scripts/build_3194.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'OSMINOG 3.19.4 core hero and native file drop recovery [skip ci]'
          git push origin HEAD:main
