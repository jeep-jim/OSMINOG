name: Apply reviewed Quadro 605 source changes
on:
  push:
    branches: [codex/quadro-605-mac-library-wallet]
    paths: [tools/quadro605_prepare.py, .github/workflows/quadro-605-prepare.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply exact guarded edits
        run: |
          python3 tools/quadro605_prepare.py
          python3 - <<'PY'
          import subprocess
          allowed=('desktop/quadro','tools/quadro-verify.py','tools/quadro605_','docs/desktop/2026-11-14-quadro-mac-web3.md','OSMINOG_BROWSER_ROADMAP.md')
          changed=subprocess.check_output(['git','diff','--name-only']).decode().splitlines()+subprocess.check_output(['git','ls-files','--others','--exclude-standard']).decode().splitlines()
          assert all(p.startswith(allowed) for p in changed),changed
          PY
          git add desktop/quadro* tools/quadro-verify.py tools/quadro605_* docs/desktop/2026-11-14-quadro-mac-web3.md OSMINOG_BROWSER_ROADMAP.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement Quadro Mac library sidebar, glass controls, Sepolia wallet and global screenshot editor'
          git push origin HEAD:codex/quadro-605-mac-library-wallet
          git rev-parse HEAD
