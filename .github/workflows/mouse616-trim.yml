name: Apply Mouse 616 corner chrome
on:
  push:
    branches: [codex/mouse616-prepare]
    paths: [.github/workflows/mouse616-trim.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: bash
        run: |
          set -euo pipefail
          cp tools/mouse616-trim.py tools/mouse616-corner-trim.fragment "$RUNNER_TEMP/"
          git fetch origin codex/mouse616-controls-no-wallet
          test "$(git rev-parse FETCH_HEAD)" = ff239ce263c2e55ab696bf46a52cb5dfae341d2c
          git checkout -B codex/mouse616-controls-no-wallet FETCH_HEAD
          python3 "$RUNNER_TEMP/mouse616-trim.py" "$PWD" "$RUNNER_TEMP/mouse616-corner-trim.fragment"
          (cd desktop && node --test mouse-browser.test.cjs mouse-lifecycle.test.cjs mouse-capture.test.cjs mouse-library.test.cjs mouse-overlays.test.cjs mouse-start.test.cjs mouse-polish.test.cjs mouse-global-capture.test.cjs mouse-606.test.cjs mouse-private.test.cjs mouse-607.test.cjs mouse-608.test.cjs mouse-609.test.cjs mouse-611.test.cjs mouse-612.test.cjs mouse-613.test.cjs mouse-614.test.cjs mouse-615.test.cjs mouse-616.test.cjs)
          git diff --check
          test -z "$(git diff --name-only -- .github)"
          git add desktop
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Render pane corner cut-outs above compositor without modifying web surfaces'
          git push origin HEAD:codex/mouse616-controls-no-wallet
