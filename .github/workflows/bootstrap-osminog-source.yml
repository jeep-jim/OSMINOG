name: Bootstrap OSMINOG source

on:
  push:
    branches:
      - rebrand/osminog-devhub
    paths:
      - 'bootstrap/osminog-source.zip'
      - '.github/workflows/bootstrap-osminog-source.yml'

permissions:
  contents: write

jobs:
  materialize-source:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: rebrand/osminog-devhub
          fetch-depth: 0

      - name: Verify and extract source bundle
        shell: pwsh
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'bootstrap/osminog-source.zip'
          if (!(Test-Path $bundle)) { throw "Source bundle not found: $bundle" }
          $actual = (Get-FileHash $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'e24cc5bfbfd3632d47e58efdeb3ab291b8966cae6bd61ad50ba80c8f79ad5d98'
          if ($actual -ne $expected) { throw "Source bundle SHA-256 mismatch: $actual" }
          $extract = Join-Path $env:RUNNER_TEMP 'osminog-source'
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path $bundle -DestinationPath $extract -Force
          Copy-Item (Join-Path $extract '*') $env:GITHUB_WORKSPACE -Recurse -Force

      - name: Validate materialized source
        shell: pwsh
        run: |
          $required = @(
            'devhub/Shared/UpdaterCore.cs',
            'devhub/Osminog.DevHub/Osminog.DevHub.csproj',
            'devhub/Osminog.NativeHost/Osminog.NativeHost.csproj',
            '.github/workflows/build-osminog-devhub.yml',
            'brand/osminog-mark.svg',
            'roadmap.md'
          )
          foreach ($path in $required) {
            if (!(Test-Path (Join-Path $env:GITHUB_WORKSPACE $path))) { throw "Missing materialized file: $path" }
          }
          node --check api/mcp.js
          node --check server.mjs

      - name: Commit materialized source
        shell: pwsh
        run: |
          Remove-Item bootstrap -Recurse -Force
          Remove-Item .github/workflows/bootstrap-osminog-source.yml -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if (git diff --cached --quiet) {
            Write-Host 'Nothing to commit.'
            exit 0
          }
          git commit -m 'Materialize OSMINOG rebrand and Dev Hub source'
          git push origin HEAD:rebrand/osminog-devhub
