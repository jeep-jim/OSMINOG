name: Mouse621 source review snapshot
on:
  push:
    branches: [feat/mouse621-desktops-toasts-drag]
    paths: [.github/workflows/mouse621-source-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f9a53353e61d1427c7c5ad0b304ee67fadd23785
          persist-credentials: false
      - run: |
          git archive -o mouse621-staged-source.zip HEAD
          sha256sum mouse621-staged-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mouse621-staged-source
          path: mouse621-staged-source.zip
          retention-days: 2
