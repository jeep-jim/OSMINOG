name: Quadro source snapshot
on:
  push:
    branches: [codex/quadro-compact-20261113]
    paths: [.github/workflows/quadro-source-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz HEAD > quadro-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: quadro-source-snapshot
          path: quadro-source.tar.gz
          retention-days: 1
