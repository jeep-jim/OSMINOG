name: Quadro 605 source snapshot
on:
  push:
    branches: [codex/quadro-605-mac-library-wallet]
    paths: [.github/workflows/quadro-605-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar.gz HEAD desktop tools .github/workflows docs/desktop AGENTS.md OSMINOG_BROWSER_ROADMAP.md OSMINOG_ROADMAP.md OSMINOG_PROJECT_LOG.md > quadro605-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: quadro605-source
          path: quadro605-source.tar.gz
          retention-days: 1
