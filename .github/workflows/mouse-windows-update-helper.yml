name: Mouse Windows update helper
on:
  pull_request:
    paths:
      - 'desktop/mouse-install-update.cjs'
      - 'desktop/mouse-windows-helper*'
      - 'desktop/mouse-native-build.cjs'
      - 'desktop/mouse-native/*.cc'
      - 'desktop/mouse-native/*.h'
      - 'desktop/mouse-native/native-win/**'
      - '.github/workflows/mouse-windows-update-helper.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mouse-windows-update-helper-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  MOUSE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  helper-build:
    # Compile once with the supported VS2022 toolchain. The helper tests use
    # only Node built-ins and this addon; no Electron or Agent npm tree is needed.
    runs-on: windows-2022
    timeout-minutes: 10
    outputs:
      node_version: ${{ steps.bind.outputs.node_version }}
      addon_sha256: ${{ steps.bind.outputs.addon_sha256 }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native Windows helper launcher
        run: |
          $env:npm_config_python = Join-Path $env:pythonLocation 'python.exe'
          node desktop/mouse-native-build.cjs 2>&1 | Tee-Object -FilePath desktop/mouse-windows-helper-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bind addon bytes to this source and run
        id: bind
        run: |
          @'
          'use strict';
          const assert=require('node:assert/strict'),fs=require('node:fs'),crypto=require('node:crypto'),cp=require('node:child_process'),os=require('node:os');
          assert.equal(process.platform,'win32');assert.equal(process.arch,'x64');
          const source=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          assert.equal(source,process.env.MOUSE_SOURCE_SHA);
          const sha256=bytes=>crypto.createHash('sha256').update(bytes).digest('hex');
          const sourceFiles=cp.execFileSync('git',['ls-files','--',
            '.github/workflows/mouse-windows-update-helper.yml','desktop/mouse-install-update.cjs',
            'desktop/mouse-windows-helper*','desktop/mouse-native-build.cjs',
            'desktop/mouse-native/*.cc','desktop/mouse-native/*.h','desktop/mouse-native/native-win/*'
          ],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean).sort();
          const sources=Object.fromEntries(sourceFiles.map(file=>[file,sha256(fs.readFileSync(file))]));
          const name='mouse-platform.node',bytes=fs.readFileSync('desktop/'+name);
          assert.equal(bytes.toString('ascii',0,2),'MZ');
          const pe=bytes.readUInt32LE(0x3c);assert.equal(bytes.toString('ascii',pe,pe+4),'PE\0\0');assert.equal(bytes.readUInt16LE(pe+4),0x8664);
          const addon={name,size:bytes.length,sha256:sha256(bytes)};
          const manifest={schema:1,source,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,
            platform:process.platform,arch:process.arch,nodeVersion:process.versions.node,addon,sources,
            runner:{system:os.type(),release:os.release(),version:os.version(),imageOS:process.env.ImageOS,imageVersion:process.env.ImageVersion}};
          fs.writeFileSync('desktop/mouse-windows-helper-native.json',JSON.stringify(manifest,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'node_version='+process.versions.node+'\naddon_sha256='+addon.sha256+'\n');
          console.log('MOUSE_WINDOWS_HELPER_NATIVE_BOUND',JSON.stringify({source,runId:manifest.runId,runAttempt:manifest.runAttempt,addon}));
          '@ | node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload immutable native helper input
        uses: actions/upload-artifact@v4
        with:
          name: mouse-windows-update-helper-native-${{ github.run_attempt }}
          path: |
            desktop/mouse-platform.node
            desktop/mouse-windows-helper-native.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload helper build evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse-windows-update-helper-build-${{ github.run_attempt }}
          path: |
            desktop/mouse-windows-helper-build.log
            desktop/mouse-windows-helper-native.json
          if-no-files-found: warn
          retention-days: 14
  helper-verify:
    needs: helper-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: windows-2022
            label: windows-2022
          - host: windows-latest
            label: windows-modern
    runs-on: ${{ matrix.host }}
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh
    env:
      MOUSE_HELPER_ADDON_SHA256: ${{ needs.helper-build.outputs.addon_sha256 }}
    steps:
      - name: Preserve exact source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.helper-build.outputs.node_version }}
      - uses: actions/download-artifact@v4
        with:
          name: mouse-windows-update-helper-native-${{ github.run_attempt }}
          path: desktop/helper-native-input
      - name: Verify exact source and shared native addon
        run: |
          @'
          'use strict';
          const assert=require('node:assert/strict'),fs=require('node:fs'),crypto=require('node:crypto'),cp=require('node:child_process'),os=require('node:os');
          const dir='desktop/helper-native-input',manifestName='mouse-windows-helper-native.json';
          assert.deepEqual(fs.readdirSync(dir).sort(),['mouse-platform.node',manifestName].sort());
          const manifest=JSON.parse(fs.readFileSync(dir+'/'+manifestName,'utf8'));
          const source=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          assert.equal(source,process.env.MOUSE_SOURCE_SHA);assert.equal(manifest.source,source);
          assert.equal(manifest.schema,1);assert.equal(manifest.runId,process.env.GITHUB_RUN_ID);assert.equal(manifest.runAttempt,process.env.GITHUB_RUN_ATTEMPT);
          assert.equal(process.platform,'win32');assert.equal(process.arch,'x64');
          assert.equal(manifest.platform,process.platform);assert.equal(manifest.arch,process.arch);assert.equal(manifest.nodeVersion,process.versions.node);
          const sha256=bytes=>crypto.createHash('sha256').update(bytes).digest('hex');
          for(const [file,digest]of Object.entries(manifest.sources))assert.equal(sha256(fs.readFileSync(file)),digest,'Source bytes differ: '+file);
          assert.equal(manifest.addon.name,'mouse-platform.node');
          const bytes=fs.readFileSync(dir+'/'+manifest.addon.name),digest=sha256(bytes);
          assert.equal(bytes.length,manifest.addon.size);assert.equal(digest,manifest.addon.sha256);assert.equal(digest,process.env.MOUSE_HELPER_ADDON_SHA256);
          fs.copyFileSync(dir+'/'+manifest.addon.name,'desktop/'+manifest.addon.name);
          fs.writeFileSync('desktop/mouse-windows-helper-input.json',JSON.stringify({ok:true,source,runId:manifest.runId,runAttempt:manifest.runAttempt,
            addon:manifest.addon,nodeVersion:process.versions.node,
            runner:{system:os.type(),release:os.release(),version:os.version(),imageOS:process.env.ImageOS,imageVersion:process.env.ImageVersion}},null,2)+'\n');
          console.log('MOUSE_WINDOWS_HELPER_IMMUTABLE_INPUT_PASS');
          '@ | node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify real helper readiness, cancellation and parent lifetime
        timeout-minutes: 3
        run: |
          node --test --test-reporter=tap desktop/mouse-windows-helper.test.cjs 2>&1 | Tee-Object -FilePath desktop/mouse-windows-helper-tests.log
          $env:MOUSE_HELPER_TEST_EXIT = [string]$LASTEXITCODE
          @'
          'use strict';
          const assert=require('node:assert/strict'),fs=require('node:fs'),crypto=require('node:crypto');
          const input=JSON.parse(fs.readFileSync('desktop/mouse-windows-helper-input.json','utf8')),
            log=fs.readFileSync('desktop/mouse-windows-helper-tests.log','utf8'),exitCode=Number(process.env.MOUSE_HELPER_TEST_EXIT);
          const requiredMarkers=['MOUSE_WINDOWS_HELPER_READY_CANCEL_PASS','MOUSE_WINDOWS_HELPER_PARENT_LIFETIME_PASS'];
          const markers=Object.fromEntries(requiredMarkers.map(marker=>[marker,log.includes(marker)]));
          const counts=Object.fromEntries(['tests','pass','fail','cancelled','skipped'].map(name=>{
            const matches=[...log.matchAll(new RegExp('^# '+name+' (\\d+)\\s*$','gm'))];return[name,matches.length?Number(matches.at(-1)[1]):null];
          }));
          const afterSha256=crypto.createHash('sha256').update(fs.readFileSync('desktop/mouse-platform.node')).digest('hex');
          const ok=exitCode===0&&Object.values(markers).every(Boolean)&&counts.tests>=2&&counts.pass===counts.tests&&counts.fail===0&&counts.cancelled===0&&counts.skipped===0&&afterSha256===input.addon.sha256;
          fs.writeFileSync('desktop/mouse-windows-helper-verification.json',JSON.stringify({...input,ok,exitCode,markers,counts,afterSha256},null,2)+'\n');
          assert.equal(ok,true,'Actual Windows helper acceptance failed; see bounded TAP diagnostics');
          console.log('MOUSE_WINDOWS_HELPER_HOST_PASS');
          '@ | node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload helper host evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse-windows-update-helper-${{ matrix.label }}-${{ github.run_attempt }}
          path: |
            desktop/mouse-windows-helper-*.log
            desktop/mouse-windows-helper-*.json
          if-no-files-found: warn
          retention-days: 14
