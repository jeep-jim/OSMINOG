name: Recover queued Mouse621 native allocation
on:
  push:
    branches: [diagnostic/mouse621-cancel-superseded]
    paths: [.github/workflows/mouse621-cancel-superseded.yml]
permissions:
  contents: read
  actions: write
jobs:
  exact-queued-recovery:
    if: github.repository == 'jeep-jim/OSMINOG'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Retry only an unallocated exact native candidate, never an executing test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,time,datetime
          repo='jeep-jim/OSMINOG';run=44081845571;job=134034136368;head='ecf39b1f4d9de5f1e3eb85fb8f2d86c52bab6848'
          def get(path):return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/'+path],text=True))
          r=get(f'actions/runs/{run}');assert r['head_sha']==head and r['workflow_id']==419668574
          j=get(f'actions/jobs/{job}');assert j['run_id']==run and j['head_sha']==head
          if r['status']!='queued' or j['status']!='queued' or j.get('steps'):
            print('Native job has started or completed; no changes.');raise SystemExit(0)
          created=datetime.datetime.fromisoformat(r['created_at'].replace('Z','+00:00'))
          assert (datetime.datetime.now(datetime.timezone.utc)-created).total_seconds()>300
          subprocess.run(['gh','api','--method','POST',f'repos/{repo}/actions/runs/{run}/cancel'],check=True)
          for _ in range(30):
            if get(f'actions/runs/{run}')['status']=='completed':break
            time.sleep(1)
          r=get(f'actions/runs/{run}');assert r['conclusion']=='cancelled' and r['head_sha']==head
          subprocess.run(['gh','api','--method','POST',f'repos/{repo}/actions/jobs/{job}/rerun'],check=True)
          print('MOUSE621_EXACT_UNALLOCATED_JOB_RETRIED',run,job,head)
          print('No source, test, runner label, release gate or channel change.')
          PY
