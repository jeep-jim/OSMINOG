name: Stop superseded Mouse621 diagnostic runs
on:
  push:
    branches: [diagnostic/mouse621-cancel-superseded]
    paths: [.github/workflows/mouse621-cancel-superseded.yml]
permissions:
  contents: read
  actions: write
jobs:
  cancel-exact-old-heads:
    if: github.repository == 'jeep-jim/OSMINOG'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve final source gates and stop only superseded621 candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          repo='jeep-jim/OSMINOG';branch='feat/mouse621-desktops-toasts-drag';latest='ecf39b1f4d9de5f1e3eb85fb8f2d86c52bab6848'
          def get(path):return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/'+path],text=True))
          assert get('git/ref/heads/'+branch)['object']['sha']==latest,'Do not cancel after another source change'
          seen=set();cancelled=[]
          for status in ['queued','in_progress','waiting','pending','requested']:
            data=get(f'actions/runs?status={status}&per_page=100')
            for r in data['workflow_runs']:
              if r['head_branch']!=branch or r['id'] in seen:continue
              seen.add(r['id']);print('CANDIDATE_RUN',r['id'],r['name'],r['status'],r['head_sha'])
              if r['head_sha']==latest:continue
              comparison=get('compare/'+r['head_sha']+'...'+latest)
              if comparison['status']!='ahead' or comparison['behind_by']!=0:continue
              result=subprocess.run(['gh','api','--method','POST',f'repos/{repo}/actions/runs/{r["id"]}/cancel'],capture_output=True,text=True)
              if result.returncode:print('Already finished or cancellation unavailable:',r['id'])
              else:cancelled.append(r['id']);print('CANCELLED_SUPERSEDED',r['id'])
          print('Obsolete ancestor runs cancelled:',len(cancelled))
          print('Final source and all release checks preserved:',latest)
          PY
