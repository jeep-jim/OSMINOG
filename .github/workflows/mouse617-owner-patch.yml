name: Apply Mouse 617 owner patch
on:
  push:
    branches: ['fix/mouse-617-owner-head-and-chrome']
    paths: ['tools/mouse617-owner-patch.cjs', '.github/workflows/mouse617-owner-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.repository == 'jeep-jim/OSMINOG' && github.ref == 'refs/heads/fix/mouse-617-owner-head-and-chrome'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact-match patch and regression checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node tools/mouse617-owner-patch.cjs
          git diff --check
          for file in $(git diff --name-only -- '*.js' '*.cjs'); do node --check "$file"; done
          node --check desktop/mouse-617-smoke.cjs
          (cd desktop && node --test mouse-613.test.cjs mouse-615.test.cjs mouse-616.test.cjs mouse-617.test.cjs)
      - name: Commit source only with fast-forward guard
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=fix/mouse-617-owner-head-and-chrome
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- desktop MOUSE_BROWSER_ROADMAP.md
          git commit -m 'Fix Mouse chrome clicks, exact 10px corners and owner small head; preserve footer'
          git push origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD
      - name: Keep source diff for verification
        if: always()
        run: git diff HEAD~1 -- desktop MOUSE_BROWSER_ROADMAP.md > mouse617-review.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse617-patched-source
          path: |
            mouse617-review.patch
            desktop
          retention-days: 2
