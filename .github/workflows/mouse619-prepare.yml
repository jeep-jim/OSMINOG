name: Prepare Mouse619 native emoji feature
on:
  push:
    branches: ['feature/mouse619-native-emoji']
    paths: ['tools/mouse619-prepare.cjs','.github/workflows/mouse619-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'jeep-jim/OSMINOG' && github.ref == 'refs/heads/feature/mouse619-native-emoji'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact source edits and run local feature contracts
        run: |
          set -euo pipefail
          node tools/mouse619-prepare.cjs
          node - <<'NODE'
          const fs=require('fs'),assert=require('node:assert/strict'),p='desktop/mouse-emoji-smoke.cjs';let s=fs.readFileSync(p,'utf8');
          function once(a,b){assert.equal(s.split(a).length-1,1);s=s.replace(a,b);}
          once(" let server,expected,inserted,calls=0;"," const bounds=win.getBounds();let server,expected,inserted,calls=0;");
          once(" try{\n  await until(()=>js("," try{\n  if(win.isFullScreen()){win.setFullScreen(false);await until(()=>!win.isFullScreen(),'exit fullscreen');await sleep(350);}\n  const area=electron.screen.getPrimaryDisplay().workArea;win.setBounds({x:area.x+8,y:area.y+8,width:Math.min(1100,area.width-16),height:Math.min(800,area.height-16)});win.show();win.focus();\n  await js('MouseTest.browsing.close();MouseTest.model.libraryOpen=false;MouseTest.applySide()');\n  await until(()=>js(");
          once("  server?.close();","  server?.close();win.setBounds(bounds);");fs.writeFileSync(p,s);
          NODE
          cp .github/workflows/mouse-macos.yml mouse619-macos.yml
          git diff --check
          for file in $(git diff --name-only -- '*.js' '*.cjs'); do node --check "$file"; done
          node --check desktop/mouse-emoji-smoke.cjs
          (cd desktop && node --test mouse-emoji.test.cjs mouse-613.test.cjs mouse-615.test.cjs mouse-616.test.cjs mouse-617.test.cjs mouse-browser.test.cjs mouse-606.test.cjs)
      - name: Commit source only with current branch guard
        run: |
          set -euo pipefail
          BRANCH=feature/mouse619-native-emoji
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- desktop tools/mouse-verify.py tools/mouse-update-verify.py MOUSE_BROWSER_ROADMAP.md
          git commit -m 'Add system emoji button with restored editor focus and retained profile'
          git push origin "HEAD:refs/heads/$BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse619-prepared-source
          path: |
            desktop
            tools/mouse-verify.py
            tools/mouse-update-verify.py
            mouse619-macos.yml
            MOUSE_BROWSER_ROADMAP.md
          retention-days: 2
