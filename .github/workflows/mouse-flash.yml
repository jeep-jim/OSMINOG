name: Mouse Flash direct transfer prototype
on:
  push:
    branches: ['mouse/flash-direct-transfer']
    paths: ['desktop/mouse-flash*', 'desktop/mouse/flash/**', 'desktop/mouse-main.cjs', 'desktop/mouse-build.cjs', 'tools/mouse-flash*', 'tools/test-mouse-flash*', '.github/workflows/mouse-flash.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct-transfer:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install existing pinned desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: File, crypto, broker, identity, proxy and protocol contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mouse-flash-evidence
          node --test desktop/mouse-flash*.test.cjs tools/test-mouse-flash-broker.cjs | tee mouse-flash-evidence/unit.log
      - name: Real RTC transfer, consent, interruption and resume in two sandboxed Mouse windows
        env:
          MOUSE_FLASH_SMOKE_ROOT: ${{ runner.temp }}/mouse-flash-owned-fixtures
          MOUSE_FLASH_EVIDENCE: ${{ github.workspace }}/mouse-flash-evidence
        shell: bash
        run: |
          set -euo pipefail
          node desktop/node_modules/electron/cli.js tools/mouse-flash-rtc-smoke.cjs 2>&1 | tee mouse-flash-evidence/rtc.log
          grep -qx MOUSE_FLASH_REAL_RTC_PASS mouse-flash-evidence/rtc.log
          node -e "const r=require('./mouse-flash-evidence/mouse-flash-rtc.json');require('node:assert/strict').ok(r.status==='PASS' && r.realRTCDataChannel===true && r.platform==='darwin' && r.payloadBytes>48*1048576 && r.payloadBytesAfterResume===r.payloadBytes-r.durableBeforeResume)"
      - name: Preserve test receipts and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mouse-flash-direct-transfer-evidence
          path: mouse-flash-evidence/
          if-no-files-found: warn
