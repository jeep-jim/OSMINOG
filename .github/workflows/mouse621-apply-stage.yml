name: Restore interrupted Mouse621 source
on:
  push:
    branches: [feat/mouse621-desktops-toasts-drag]
    paths: [.github/workflows/mouse621-apply-stage.yml,tools/mouse621-apply-stage.py]
permissions:
  contents: write
jobs:
  restore:
    if: github.repository == 'jeep-jim/OSMINOG'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          set -euo pipefail
          python3 tools/mouse621-apply-stage.py
          git diff --check
          for file in $(git diff --name-only -- '*.js' '*.cjs'); do node --check "$file"; done
          cd desktop
          node --test mouse-621.test.cjs mouse-desktops.test.cjs mouse-620.test.cjs mouse-617.test.cjs mouse-browser.test.cjs mouse-606.test.cjs mouse-607.test.cjs mouse-608.test.cjs mouse-611.test.cjs mouse-612.test.cjs mouse-private.test.cjs
      - run: |
          set -euo pipefail
          BRANCH=feat/mouse621-desktops-toasts-drag
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- desktop MOUSE_BROWSER_ROADMAP.md tools/mouse-verify.py tools/mouse-update-verify.py
          git commit -m 'Restore owner621 desktops, expiring feedback, editor movement, zoom and private artwork'
          git push origin "HEAD:refs/heads/$BRANCH"
