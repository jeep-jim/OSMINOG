name: Build OSMINOG 3.18.0 product core recovery

on:
  push:
    branches:
      - repair/product-core-recovery-3.18.0
    paths:
      - '.github/workflows/build-3180-product-core-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and apply verified 3.18.0 recovery
        shell: bash
        run: |
          set -euxo pipefail
          test "$(find tools/3180 -maxdepth 1 -name 'part.*' | wc -l)" -eq 4
          cat tools/3180/part.* | tr -d '\r\n\t ' | base64 -d > /tmp/os3180.patch.xz
          test "$(sha256sum /tmp/os3180.patch.xz | awk '{print $1}')" = '756d5077067482958d23430a7e4637c562ed8f46a7da27118811455fb15786e3'
          xz -dc /tmp/os3180.patch.xz > /tmp/os3180.patch
          test "$(sha256sum /tmp/os3180.patch | awk '{print $1}')" = '4ef492ae0afab082155d2d131d9a372254c612aeb103eebacc9807cd6e1e028f'
          patch -p4 --dry-run < /tmp/os3180.patch
          patch -p4 < /tmp/os3180.patch

          cat > RELEASE_NOTES_3.18.0.md <<'MD'
          # OSMINOG Chrome 3.18.0 — PRODUCT CORE RECOVERY

          This release restores the simple product model that worked in the early 3.11 generation while keeping the 3.17 generative application runtime.

          - The updater now checks GitHub Contents API, raw GitHub and jsDelivr independently, chooses the highest valid feed and never reports “up to date” when every feed source failed.
          - The top bar exposes two explicit states: AI for the connected assistant session and Poseidon for owner-only source/product development.
          - Normal user capabilities do not require permission toggles. Canvas, files, apps, graphics, web tools and project work remain available by default.
          - Access is only human canvas sharing: invite/link plus view/comment/edit role.
          - User GitHub project repositories return as a separate integration and do not grant Poseidon.
          - Google Drive is surfaced again through the existing account/Drive API. OAuth still requires a publisher-configured Google OAuth client ID.
          - Any web service can be added by URL and uses the service favicon by default; authorization happens on the real service session.
          - Old test modules that were incorrectly marked system become deletable unless their id is a real `system.*` module.
          - Module Store deletion supports both user-created applications and user-added web services.
          - Header/action alignment and chat nested-container styling are simplified to recover the cleaner 3.11 interaction language.
          - 3.17 GENERATIVE APP RUNTIME is preserved: applications are generated per request, can be focused and updated, and retain rollback/file/capture/runtime capabilities.

          Owner product-source changes remain protected by Poseidon/Owner Guard. Normal users never need Poseidon for ordinary OSMINOG work.
          MD

          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('OSMINOG_BUILD.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          data.update({
            'version':'3.18.0',
            'codename':'PRODUCT CORE RECOVERY',
            'baseVersion':'3.17.0',
            'artifact':'OSMINOG-Chrome-3.18.0-PRODUCT-CORE-RECOVERY.zip',
            'manifestVersion':'3.18.0',
            'runtimeVerified':False,
            'ownerRuntime':'pending',
            'binaryInGitHub':False,
            'notes':'Restores reliable multi-source updates, simple AI/Poseidon semantics, sharing-only Access, GitHub/Drive/user-service integrations, deletable test modules and cleaner chat/UI while preserving the generative app runtime.',
            'status':'candidate',
            'versionName':'3.18.0',
            'build':'3.18.0'
          })
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          if ! grep -q '3.18.0 PRODUCT CORE RECOVERY' OSMINOG_PROJECT_LOG.md; then
            cat >> OSMINOG_PROJECT_LOG.md <<'MD'

          ## 2026-09-03 — 3.18.0 PRODUCT CORE RECOVERY
          После owner-тестов 3.14–3.17 возвращена простая продуктовая модель ранней 3.11: обычная работа ИИ доступна без матрицы permission-переключателей; «Доступ» отвечает только за шаринг холста; AI и Poseidon разведены в две понятные кнопки; пользовательские GitHub/Drive и web-сервисы возвращены как подключения. Updater переведён на три независимых источника и больше не имеет права показывать `up to date`, если канал не был успешно прочитан. Сохранён 3.17 Generative App Runtime.
          MD
          fi
          if ! grep -q '3.18.0 — PRODUCT CORE RECOVERY' OSMINOG_ROADMAP.md; then
            cat >> OSMINOG_ROADMAP.md <<'MD'

          ### 3.18.0 — PRODUCT CORE RECOVERY
          - [x] Надёжный multi-source updater и честная диагностика проверки обновления.
          - [x] Две явные кнопки AI / Poseidon без permission-костылей для обычной работы.
          - [x] Access = только sharing холста и человеческие роли.
          - [x] Вернуть пользовательский GitHub project storage отдельно от Poseidon.
          - [x] Вернуть Google Drive в основной Connections UI.
          - [x] Добавление любого web-сервиса по URL с реальным favicon.
          - [x] Исправить удаление старых тестовых модулей и пользовательских сервисов.
          - [x] Убрать систематическое прижатие controls/carets к правому краю.
          - [x] Упростить nested containers чата, сохранив Generative App Runtime 3.17.
          MD
          fi

      - name: Validate recovered product contracts
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, hashlib, pathlib
          root=pathlib.Path('.')
          m=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert m['version']=='3.18.0' and m.get('version_name')=='3.18.0'
          assert hashlib.sha256(m['key'].encode()).hexdigest()=='1ddb8d87f3a6f6cb38a229bd81ba8076d1d37d3ba6b8a15b2a91129d4904012e'
          assert 'https://cdn.jsdelivr.net/*' in m.get('host_permissions',[])
          updater=(root/'osminog-folder-updater.js').read_text(encoding='utf-8')
          for token in ['github-api','github-raw','jsdelivr','Не удалось проверить канал обновлений','releasePackageCandidates']:
              assert token in updater, token
          editor=(root/'editor.js').read_text(encoding='utf-8')
          assert 'refreshUpdateAvailability' in editor
          access=(root/'osminog-access-center.js').read_text(encoding='utf-8')
          assert 'Поделиться холстом' in access and 'ИИ и Poseidon здесь не настраиваются' in access
          core=(root/'osminog-product-core-recovery.js').read_text(encoding='utf-8')
          for token in ['osminogAiQuick','osminogPoseidonQuick','osminogUserGitHubV1','Сервис по ссылке','Google Drive','OSMINOGProjectCloudAPI']:
              assert token in core, token
          providers=(root/'osminog-provider-registry.js').read_text(encoding='utf-8')
          for token in ['CUSTOM_SERVICE_KEY','addService','removeService','favicon.ico']:
              assert token in providers, token
          studio=(root/'osminog-extension-studio.js').read_text(encoding='utf-8')
          assert 'ext.system&&!String(ext.id||"").startsWith("system.")' in studio
          workspace=(root/'osminog-workspace-v2.js').read_text(encoding='utf-8')
          assert 'item.userService===true' in workspace and 'Удалить модуль' in workspace
          html=(root/'editor.html').read_text(encoding='utf-8')
          assert 'osminog-product-core-recovery.css' in html and 'osminog-product-core-recovery.js' in html
          gpt=(root/'gpt-presence.js').read_text(encoding='utf-8')
          assert 'OSMINOG GENERATIVE APP RUNTIME v3' in gpt
          for bad in ['function directAppKind','function directAppSpec','executeDirectApp(']: assert bad not in gpt
          print('OSMINOG 3.18 product core contracts OK')
          PY
          for f in *.js; do node --check "$f"; done
          python3 - <<'PY'
          import json, pathlib
          for p in pathlib.Path('.').glob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          print('top-level JSON OK')
          PY
          git diff --check

      - name: Commit synchronized recovery source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf tools/3180
          rm -f .github/workflows/build-3180-product-core-recovery.yml
          git add -A
          git commit -m 'Restore OSMINOG product core in 3.18.0 [skip ci]'
          git push origin HEAD:repair/product-core-recovery-3.18.0

      - name: Build verified Chrome package
        shell: bash
        run: |
          set -euxo pipefail
          ARTIFACT='OSMINOG-Chrome-3.18.0-PRODUCT-CORE-RECOVERY.zip'
          rm -rf dist
          mkdir -p dist/package
          rsync -a ./ dist/package/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='dist/' \
            --exclude='tools/' \
            --exclude='docs/' \
            --exclude='project-log-archive/' \
            --exclude='OSMINOG_PROJECT_LOG.md' \
            --exclude='OSMINOG_ROADMAP.md' \
            --exclude='RELEASE_NOTES_*.md'
          (cd dist/package && zip -qr "../$ARTIFACT" .)
          unzip -t "dist/$ARTIFACT"
          python3 - <<'PY'
          import json, zipfile, hashlib
          p='dist/OSMINOG-Chrome-3.18.0-PRODUCT-CORE-RECOVERY.zip'
          with zipfile.ZipFile(p) as z:
              m=json.loads(z.read('manifest.json'))
              assert m['version']=='3.18.0' and m['version_name']=='3.18.0'
              assert hashlib.sha256(m['key'].encode()).hexdigest()=='1ddb8d87f3a6f6cb38a229bd81ba8076d1d37d3ba6b8a15b2a91129d4904012e'
              for f in ['osminog-folder-updater.js','osminog-access-center.js','osminog-product-core-recovery.js','osminog-product-core-recovery.css','osminog-provider-registry.js','gpt-presence.js']:
                  assert f in z.namelist(), f
          PY
          cp RELEASE_NOTES_3.18.0.md dist/
          sha256sum "dist/$ARTIFACT"
          stat -c '%s' "dist/$ARTIFACT"

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: OSMINOG-3.18.0-PRODUCT-CORE-RECOVERY
          path: |
            dist/OSMINOG-Chrome-3.18.0-PRODUCT-CORE-RECOVERY.zip
            dist/RELEASE_NOTES_3.18.0.md
          retention-days: 14
