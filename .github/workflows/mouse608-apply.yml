name: Apply exact reviewed Mouse608 source
on:
  push:
    branches: [codex/mouse-608-owner-fixes]
    paths: ['tools/mouse608-apply*.py','tools/mouse608-expected.json','.github/workflows/mouse608-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply reviewed changes and verify exact resulting bytes
        run: |
          python3 tools/mouse608-apply1.py
          python3 tools/mouse608-apply2.py
          python3 - <<'PY'
          import hashlib,json,pathlib
          for name,expected in json.loads(pathlib.Path('tools/mouse608-expected.json').read_text()).items():
            actual=hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
            assert actual==expected,(name,actual,expected)
          p=pathlib.Path('OSMINOG_BROWSER_ROADMAP.md')
          p.write_text(p.read_text()+'\n\n## 2026-11-14 — Mouse6.0.8, выполнить пять исправлений\n\nБелый маскот/квадратные пиксели, постоянный Dock, системный скриншот, полный экран любой панели с возвратом, обновление по кнопке. Реализация и границы: docs/desktop/2026-11-14-mouse608-owner-fixes.md. Публикация только после реальных native/DMG проверок.\n')
          PY
      - name: Run unchanged desktop and targeted regressions
        working-directory: desktop
        run: |
          npm test
          node --test mouse-608.test.cjs mouse-607.test.cjs mouse-606.test.cjs mouse-private.test.cjs quadro.test.cjs quadro-global-capture.test.cjs quadro-lifecycle.test.cjs quadro-capture.test.cjs quadro-library.test.cjs quadro-overlays.test.cjs quadro-start.test.cjs quadro-polish.test.cjs
      - name: Commit only reviewed runtime changes without altering workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop tools/quadro-verify.py OSMINOG_BROWSER_ROADMAP.md
          git diff --cached --name-only | grep -E '^\.github/' && exit 1 || true
          git commit -m 'Implement Mouse608 owner fixes with exact reviewed source and passing unit tests'
          git push origin HEAD:codex/mouse-608-owner-fixes
