name: OSMINOG 3.19.3 graphics stability hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-3193.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply 3.19.3 fixes
        run: |
          set -euo pipefail
          python scripts/hotfix_3193.py
          node --check osminog-graphics-studio.js
          node --check editor.js
          python -m json.tool manifest.json >/dev/null
          python -m json.tool OSMINOG_BUILD.json >/dev/null
      - name: Commit hotfix
        run: |
          set -euo pipefail
          rm -f .github/workflows/hotfix-3193.yml scripts/hotfix_3193.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'OSMINOG 3.19.3 graphics stability and native file drop [skip ci]'
          git push origin HEAD:main
