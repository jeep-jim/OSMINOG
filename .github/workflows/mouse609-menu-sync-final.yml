name: Mouse 609 verified menu readiness correction
on:
  push:
    branches: ['codex/mouse609-source-transport']
    paths: ['.github/workflows/mouse609-menu-sync-final.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          git checkout --detach abc9bd23c235cf5b2d862aaa976d897bd9489d42
          python3 - <<'PY'
          from pathlib import Path
          p=Path('desktop/mouse-606-smoke.cjs');s=p.read_text()
          a="await until(()=>win.quadroChromeGuard.nativeState().menuVisible,'real Apple menu visible after OS pointer hover')"
          b="await until(()=>{const state=win.quadroChromeGuard.nativeState();return state.menuVisible&&state.held;},'real Apple menu visible and native hover handled after OS pointer hover')"
          assert s.count(a)==1;s=s.replace(a,b)
          a="win.quadroChromeGuard.sample();await sleep(200);\n  assert.ok(Math.abs(await js('document.querySelector(\".toolbar\").getBoundingClientRect().height')-(40+visible.inset))<=2);"
          b="win.quadroChromeGuard.sample();await until(async()=>Math.abs(await js('document.querySelector(\".toolbar\").getBoundingClientRect().height')-(40+visible.inset))<=2,'renderer geometry acknowledges real menu');\n  assert.ok(Math.abs(await js('document.querySelector(\".toolbar\").getBoundingClientRect().height')-(40+visible.inset))<=2);"
          assert s.count(a)==1;s=s.replace(a,b);p.write_text(s)
          p=Path('desktop/mouse-609-smoke.cjs');s=p.read_text()
          a="await until(()=>win.quadroChromeGuard.nativeState().menuVisible,'real system menu visible')"
          b="await until(()=>{const state=win.quadroChromeGuard.nativeState();return state.menuVisible&&state.held;},'real system menu visible and native hover handled')"
          assert s.count(a)==1;p.write_text(s.replace(a,b))
          p=Path('docs/desktop/2026-11-15-mouse609.md');p.write_text(p.read_text()+'\nNative run43667962033 stopped at old606 menu geometry assertion: OS menuVisible=true while application hover held=false. Tests now await both actual states and unchanged renderer height contract instead of fixed200ms. Real OS-pointer/click,2px tolerance and visual evidence remain required. Runtime and security boundaries unchanged.\n')
          PY
          git diff --check
          node --check desktop/mouse-606-smoke.cjs
          node --check desktop/mouse-609-smoke.cjs
          git add desktop/mouse-606-smoke.cjs desktop/mouse-609-smoke.cjs docs/desktop/2026-11-15-mouse609.md
          git -c user.name='jeep-jim' -c user.email='yokkey@ya.ru' commit -m 'Await actual native menu handling and renderer geometry without weakening click or pixel checks'
          git push origin HEAD:refs/heads/codex/mouse609-native-sync-final
