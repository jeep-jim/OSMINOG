name: OSMINOG Chrome 4.0.37 verified package
# Preserve all existing regression gates; package only their successful output.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check background.js
      - run: node --check osminog-figma-ux.js && node --check editor.js
      - run: node tests/figma-ux-435.cjs
      - run: node tests/no-embedded-browser-436.cjs
      - run: node --check osminog-provider-connections.js
      - run: node --check osminog-workdesk.js
      - run: node --check osminog-canvas-ux.js
      - run: node --check collector.js
      - run: node --check osminog-collector-background.js
      - run: node --check osminog-library.js
      - run: node --check osminog-windows-folders.js
      - run: node --check osminog-workspace-polish.js
      - run: node --check osminog-update-recovery.js
      - run: node --check osminog-project-trash.js && node --check osminog-today.js && node --check osminog-item-edits.js
      - run: node --check osminog-folder-updater.js && node --check osminog-update-handoff.js
      - run: node --test tests/io-budget-425.cjs tests/update-recovery-425.cjs tests/folder-updater-437.cjs tests/update-handoff-437.cjs
      - run: node tests/collector-runtime-421.cjs
      - run: node tests/storage-load-421.cjs
      - run: node tests/github-gateway-411.cjs
      - run: node tests/owner-access-411.cjs
      - run: node tests/agent-session-409.cjs
      - run: node tests/chat-sync-3216.cjs
      - run: node tests/chat-sync-plaintext-3217.cjs
      - run: node tests/provider-dock-3217.cjs
      - run: node tests/provider-session-isolation-3218.cjs
      - run: node tests/provider-one-click-3219.cjs
      - run: node tests/module-app-contract-3220.cjs
      - run: node tests/live-presence-3215.cjs
      - run: node tests/chat-content-3214.cjs
      - run: node tests/chat-state-3213.cjs
      - run: node tests/generated-media-3212.cjs
      - run: node tests/media-reference.cjs
      - run: node tests/visual-import-402.cjs
      - run: node tests/image-generation-403.cjs
      - run: node tests/foundation-memory.cjs
      - run: node tests/privacy-no-mirroring.cjs
      - run: node tests/agent-media-3207.cjs
      - name: Install Playwright for extension UI regression tests
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - run: python3 tools/prepare_ocr.py
      - run: node tools/build-updater-recovery.cjs
      - run: xvfb-run -a node tests/update-extension-437.cjs
      - run: node tests/workspace-423.cjs
      - run: node tests/workspace-performance-424.cjs
      - run: node tests/folder-count-performance-436.cjs
      - run: node tests/workspace-ux-435.cjs
      - run: node tests/library-420.cjs
      - run: node tests/clipboard-library-421.cjs
      - run: xvfb-run -a node tests/collector-extension-420.cjs
      - run: xvfb-run -a node tests/clipboard-extension-421.cjs
      - run: xvfb-run -a node tests/io-extension-425.cjs
      - run: node tests/photo-pixels-416.cjs
      - run: node tests/photo-417.cjs
      - run: node tests/inspector-419.cjs
      - run: node tests/extension-ui-410.cjs
      - run: node tests/source-chat-412.cjs
      - run: node tests/agent-runtime-browser-409.cjs
      - run: node tests/canvas-ux-408.cjs
      - run: node tests/clipboard-407.cjs
      - run: node tests/shared-board-400.cjs
      - run: node tests/chat-sync-browser-3216.cjs
      - run: node tests/live-presence-browser-3215.cjs
      - run: node tests/chat-browser-3213.cjs
      - run: node tests/chat-links-browser-3214.cjs
      - run: node tests/folder-move-3212.cjs
      - run: node tests/foundation-browser.cjs
      - run: node tests/legacy-store-retired.cjs
      - name: Verify unchanged owner authentication
        run: |
          echo '90dc411113966db05adc323c56d5311aa830af8c11c4d6dcf959aa32008dab41  osminog-owner-guard.js' | sha256sum -c -
          node --test tests/owner-totp-enrollment.cjs
      - name: Build verified Chrome ZIP
        shell: bash
        run: |
          set -euo pipefail
          artifact='OSMINOG-Chrome-4.0.37.zip'
          mkdir -p artifacts/package
          rsync -a ./ artifacts/package/ --exclude='.git/' --exclude='.github/' --exclude='artifacts/' --exclude='desktop/' --exclude='android/' --exclude='versions/' --exclude='tools/' --exclude='tests/' --exclude='docs/' --exclude='node_modules/' --exclude='project-log-archive/' --exclude='logs/' --exclude='*.log' --exclude='test-results/' --exclude='__pycache__/' --exclude='*.pyc' --exclude='OSMINOG_PROJECT_LOG.md' --exclude='OSMINOG_ROADMAP.md' --exclude='RELEASE_NOTES_*.md'
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path('artifacts/package')
          manifest=json.loads((root/'manifest.json').read_text())
          path=root/'OSMINOG_BUILD.json'
          metadata=json.loads(path.read_text())
          assert metadata['version']==metadata['manifestVersion']==manifest['version']=='4.0.37'
          assert metadata['versionName']==manifest['version_name']
          assert metadata['artifact']=='OSMINOG-Chrome-4.0.37.zip'
          metadata.update(runtimeVerified=False,ciVerified=True,sourceCommit=os.environ['GITHUB_SHA'],verificationRun=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}")
          path.write_text(json.dumps(metadata,ensure_ascii=False,indent=2)+'\n')
          PY
          (cd artifacts/package && zip -qr "../$artifact" .)
          unzip -t "artifacts/$artifact"
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          path=pathlib.Path('artifacts/OSMINOG-Chrome-4.0.37.zip')
          with zipfile.ZipFile(path) as z:
              m=json.loads(z.read('manifest.json'))
              b=json.loads(z.read('OSMINOG_BUILD.json'))
              assert m['manifest_version']==3
              assert m['version']==m['version_name']=='4.0.37'
              assert b['version']==b['manifestVersion']==m['version'] and b['runtimeVerified'] is False and b['ciVerified'] is True
              assert hashlib.sha256(m.get('key','').encode()).hexdigest()=='1ddb8d87f3a6f6cb38a229bd81ba8076d1d37d3ba6b8a15b2a91129d4904012e'
              assert not any(n.startswith(('logs/','test-results/')) or n.endswith('.log') for n in z.namelist())
              assert 'osminog-team.js' not in z.namelist()
              assert 'osminog-browser-app.js' not in z.namelist()
              assert 'osminog-browser-hub.js' not in z.namelist()
              assert 'osminog-web-stage.js' not in z.namelist()
              assert 'osminog-browser-workspace.css' not in z.namelist()
              assert 'osminog-provider-connections.js' in z.namelist()
              assert 'osminog-figma-ux.js' in z.namelist() and 'osminog-figma-ux.css' in z.namelist()
              assert m['background']['service_worker']=='background-service.js'
              assert 'background-service.js' in z.namelist()
              assert 'osminog-workspace-polish.js' in z.namelist() and 'osminog-workspace-polish.css' in z.namelist()
              assert 'osminog-inspector.js' in z.namelist() and 'osminog-inspector.css' in z.namelist()
              assert 'osminog-canvas-ux.js' in z.namelist() and 'osminog-canvas-ux.css' in z.namelist()
              assert 'osminog-io-budget.js' in z.namelist() and 'osminog-update-recovery.js' in z.namelist() and 'osminog-update-handoff.js' in z.namelist()
              assert all(n in z.namelist() for n in ('osminog-project-trash.js','osminog-today.js','osminog-item-edits.js'))
          digest=hashlib.sha256(path.read_bytes()).hexdigest()
          path.with_suffix('.zip.sha256').write_text(digest+'  '+path.name+'\n')
          print(json.dumps({'artifact':path.name,'size':path.stat().st_size,'sha256':digest}))
          PY
      - name: Preserve exact tracked source for diagnosing a failed gate
        if: failure()
        run: mkdir -p artifacts && git archive --format=zip HEAD -o artifacts/diagnostics-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OSMINOG-4.0.37-VERIFIED
          path: |
            artifacts/OSMINOG-Chrome-4.0.37.zip
            artifacts/OSMINOG-Chrome-4.0.37.zip.sha256
            RELEASE_NOTES_CHROME_4.0.37.md
            artifacts/OSMINOG-Update-Recovery.html
            artifacts/OSMINOG-Update-Recovery.html.sha256
            artifacts/update-extension-437-results.json
            artifacts/update-extension-437-failure.png
            artifacts/diagnostics-source.zip
            artifacts/*.png
            artifacts/workspace-423-results.json
            artifacts/workspace-424-results.json
            artifacts/folder-count-436-results.json
            artifacts/folder-count-436-failure.png
            artifacts/workspace-ux-435-results.json
            artifacts/workspace-ux-435-failure.png
            artifacts/io-extension-425-results.json
            artifacts/canvas-ux-408-results.json
            artifacts/agent-runtime-409-results.json
            artifacts/agent-session-409-results.json
          retention-days: 14
