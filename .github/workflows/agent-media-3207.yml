name: OSMINOG 4.0.7 shared board
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check background.js
      - run: node tests/chat-sync-3216.cjs
      - run: node tests/chat-sync-plaintext-3217.cjs
      - run: node tests/provider-dock-3217.cjs
      - run: node tests/provider-session-isolation-3218.cjs
      - run: node tests/provider-one-click-3219.cjs
      - run: node tests/module-app-contract-3220.cjs
      - run: node tests/live-presence-3215.cjs
      - run: node tests/chat-content-3214.cjs
      - run: node tests/chat-state-3213.cjs
      - run: node tests/generated-media-3212.cjs
      - run: node tests/media-reference.cjs
      - run: node tests/visual-import-402.cjs
      - run: node tests/image-generation-403.cjs
      - run: node tests/foundation-memory.cjs
      - run: node tests/privacy-no-mirroring.cjs
      - run: node --check osminog-animation-studio.js
      - run: node tests/agent-media-3207.cjs
      - run: node tests/animation-3206.cjs
      - name: Install browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - run: node tests/clipboard-407.cjs
      - run: node tests/shared-board-400.cjs
      - run: node tests/chat-sync-browser-3216.cjs
      - run: node tests/live-presence-browser-3215.cjs
      - run: node tests/chat-browser-3213.cjs
      - run: node tests/chat-links-browser-3214.cjs
      - run: node tests/folder-move-3212.cjs
      - run: node tests/foundation-browser.cjs
      - name: Build verified Chrome ZIP
        shell: bash
        run: |
          set -euo pipefail
          artifact='OSMINOG-Chrome-4.0.7-SCREENSHOT-CLIPBOARD.zip'
          mkdir -p artifacts/package
          rsync -a ./ artifacts/package/ --exclude='.git/' --exclude='.github/' --exclude='artifacts/' --exclude='tools/' --exclude='tests/' --exclude='docs/' --exclude='node_modules/' --exclude='project-log-archive/' --exclude='OSMINOG_PROJECT_LOG.md' --exclude='OSMINOG_ROADMAP.md' --exclude='RELEASE_NOTES_*.md'
          (cd artifacts/package && zip -qr "../$artifact" .)
          unzip -t "artifacts/$artifact"
          python3 - <<'PY'
          import hashlib,json,zipfile
          path='artifacts/OSMINOG-Chrome-4.0.7-SCREENSHOT-CLIPBOARD.zip'
          with zipfile.ZipFile(path) as z:
              m=json.loads(z.read('manifest.json'))
              assert m['manifest_version']==3
              assert m['version']=='4.0.7' and m['version_name']=='4.0.7 · Screenshot Clipboard'
          print(hashlib.sha256(open(path,'rb').read()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OSMINOG-4.0.7-SCREENSHOT-CLIPBOARD
          path: |
            artifacts/OSMINOG-Chrome-4.0.7-SCREENSHOT-CLIPBOARD.zip
            RELEASE_NOTES_4.0.7.md
            artifacts/*.png
          retention-days: 14


