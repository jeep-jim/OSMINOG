name: OSMINOG Chrome 4.0.38 verified lightweight package
# Owner explicitly retired other tools. Gates cover the retained core and native updater.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate retained runtime and package boundary
        run: |
          node --check background.js
          node --check editor.js
          node --check collector.js
          node --check osminog-core-store.js
          node --check osminog-core-chat.js
          node --check osminog-core-media-worker.js
          node --check osminog-core-search-worker.js
          node --check osminog-collector-background.js
          node tests/lite-package-438.cjs
      - name: Verify retained updater, recovery and owner authentication
        run: |
          node --test tests/folder-updater-437.cjs tests/update-handoff-437.cjs tests/update-recovery-425.cjs tests/owner-totp-enrollment.cjs
          node tests/owner-access-411.cjs
          node tests/github-gateway-411.cjs
          node tests/core-chat-438.cjs
          node --test tests/core-collector-438.cjs
      - name: Install pinned Chromium test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - run: node tools/build-updater-recovery.cjs
      - name: Verify native extension migration, bounded canvas, header and background clipboard
        run: xvfb-run -a node tests/lite-core-438.cjs
      - name: Verify native folder updates and browser-preserving reload
        run: xvfb-run -a node tests/update-extension-437.cjs
      - name: Build only the verified lightweight runtime
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/build-core-438.py
      - name: Preserve exact tracked source after a failed gate
        if: failure()
        run: mkdir -p artifacts && git archive --format=zip HEAD -o artifacts/diagnostics-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OSMINOG-4.0.38-VERIFIED
          path: |
            artifacts/OSMINOG-Chrome-4.0.38.zip
            artifacts/OSMINOG-Chrome-4.0.38.zip.sha256
            artifacts/OSMINOG-Update-Recovery.html
            artifacts/OSMINOG-Update-Recovery.html.sha256
            artifacts/core-package-438.json
            artifacts/*438*.json
            artifacts/*438*.png
            artifacts/update-extension-437-results.json
            artifacts/update-extension-437-failure.png
            artifacts/diagnostics-source.zip
            RELEASE_NOTES_CHROME_4.0.38.md
          retention-days: 14
