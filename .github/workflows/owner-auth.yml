name: Owner Authenticator regression
on:
  pull_request:
    paths:
      - 'osminog-owner-guard.js'
      - 'tests/owner-access-411.cjs'
      - 'tests/owner-totp-enrollment.cjs'
      - '.github/workflows/owner-auth.yml'
  push:
    branches: [main]
    paths:
      - 'osminog-owner-guard.js'
      - 'tests/owner-access-411.cjs'
      - 'tests/owner-totp-enrollment.cjs'
      - '.github/workflows/owner-auth.yml'
permissions:
  contents: read
jobs:
  owner-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check osminog-owner-guard.js
      - run: node --test tests/owner-totp-enrollment.cjs
      - run: node tests/owner-access-411.cjs
