name: Build OSMINOG 3.15.2 GitHub owner status sync

on:
  push:
    branches:
      - repair/github-owner-sync-3.15.2
    paths:
      - '.github/workflows/build-3152.yml'
      - 'tools/repair_github_owner_sync_3152.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply GitHub owner status sync
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/repair_github_owner_sync_3152.py

      - name: Validate source contracts
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json,hashlib
          m=json.load(open('manifest.json',encoding='utf-8'))
          assert m['version']=='3.15.2'
          assert m.get('version_name')=='3.15.2'
          assert hashlib.sha256(m['key'].encode()).hexdigest()=='1ddb8d87f3a6f6cb38a229bd81ba8076d1d37d3ba6b8a15b2a91129d4904012e'
          PY
          for f in background.js bridge.js modules.js osminog-access-center.js gpt-presence.js; do node --check "$f"; done
          git diff --check
          grep -F 'ownerVerified' background.js
          grep -F 'jeep-jim/OSMINOG-Releases' background.js
          grep -F 'repo_access' osminog-access-center.js
          grep -F 'Owner Max ✓' modules.js
          grep -F 'Токен GitHub работает, но не видит' background.js

      - name: Commit synchronized source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json OSMINOG_BUILD.json background.js modules.js osminog-access-center.js RELEASE_NOTES_3.15.2.md OSMINOG_PROJECT_LOG.md OSMINOG_ROADMAP.md
          git commit -m 'Synchronize GitHub Owner Max status in 3.15.2 [skip ci]'
          git push origin HEAD:repair/github-owner-sync-3.15.2

      - name: Build verified Chrome package
        shell: bash
        run: |
          set -euxo pipefail
          ARTIFACT='OSMINOG-Chrome-3.15.2-GITHUB-OWNER-STATUS-SYNC.zip'
          rm -rf dist
          mkdir -p dist/package
          rsync -a ./ dist/package/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='dist/' \
            --exclude='tools/' \
            --exclude='docs/' \
            --exclude='project-log-archive/' \
            --exclude='OSMINOG_PROJECT_LOG.md' \
            --exclude='OSMINOG_ROADMAP.md' \
            --exclude='RELEASE_NOTES_*.md'
          (cd dist/package && zip -qr "../$ARTIFACT" .)
          unzip -t "dist/$ARTIFACT"
          python3 - <<'PY'
          import json,zipfile,hashlib
          p='dist/OSMINOG-Chrome-3.15.2-GITHUB-OWNER-STATUS-SYNC.zip'
          with zipfile.ZipFile(p) as z:
              m=json.loads(z.read('manifest.json'))
              assert m['version']=='3.15.2' and m['version_name']=='3.15.2'
              assert hashlib.sha256(m['key'].encode()).hexdigest()=='1ddb8d87f3a6f6cb38a229bd81ba8076d1d37d3ba6b8a15b2a91129d4904012e'
              for f in ['background.js','modules.js','osminog-access-center.js','bridge.js']:
                  assert f in z.namelist()
          PY
          cp RELEASE_NOTES_3.15.2.md dist/
          sha256sum "dist/$ARTIFACT"
          stat -c '%s' "dist/$ARTIFACT"

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: OSMINOG-3.15.2-GITHUB-OWNER-STATUS-SYNC
          path: |
            dist/OSMINOG-Chrome-3.15.2-GITHUB-OWNER-STATUS-SYNC.zip
            dist/RELEASE_NOTES_3.15.2.md
          retention-days: 14
