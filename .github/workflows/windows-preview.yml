name: Windows desktop compatibility candidate
on:
  pull_request:
    paths: ['desktop/**', '.github/workflows/windows-preview.yml']
  push:
    branches: ['desktop/windows-foundation', 'codex/local-browser-20261013', 'codex/browser-workspace-030']
    paths: ['desktop/**', '.github/workflows/windows-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run prepare:board
      - name: Start real Windows host and verify persistence
        shell: pwsh
        run: |
          $process = Start-Process -FilePath '.\node_modules\electron\dist\electron.exe' -ArgumentList '.', '--smoke' -PassThru -RedirectStandardOutput smoke.log -RedirectStandardError smoke-errors.log
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Desktop smoke timed out' }
          Get-Content smoke.log
          Get-Content smoke-errors.log
          if ($process.ExitCode -ne 0 -or -not (Select-String -Path smoke.log -Pattern DESKTOP_SMOKE_PASS -Quiet)) { throw 'Desktop smoke failed' }
      - name: Verify native browser panes
        shell: pwsh
        run: |
          $process = Start-Process -FilePath '.\node_modules\electron\dist\electron.exe' -ArgumentList '.', '--browser-smoke' -PassThru -RedirectStandardOutput browser-smoke.log -RedirectStandardError browser-smoke-errors.log
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Browser smoke timed out' }
          Get-Content browser-smoke.log
          Get-Content browser-smoke-errors.log
          if ($process.ExitCode -ne 0 -or -not (Select-String -Path browser-smoke.log -Pattern BROWSER_SMOKE_PASS -Quiet)) { throw 'Native browser smoke failed' }
      - name: Verify provider DOM transport in native panes
        shell: pwsh
        run: |
          $process = Start-Process -FilePath '.\node_modules\electron\dist\electron.exe' -ArgumentList '.', '--provider-smoke' -PassThru -RedirectStandardOutput provider-smoke.log -RedirectStandardError provider-smoke-errors.log
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Provider smoke timed out' }
          Get-Content provider-smoke.log
          Get-Content provider-smoke-errors.log
          if ($process.ExitCode -ne 0 -or -not (Select-String -Path provider-smoke.log -Pattern PROVIDER_SMOKE_PASS -Quiet)) { throw 'Provider smoke failed' }
      - name: Verify extension session transport and native actions
        shell: pwsh
        run: |
          $process = Start-Process -FilePath '.\node_modules\electron\dist\electron.exe' -ArgumentList '.', '--session-smoke' -PassThru -RedirectStandardOutput session-smoke.log -RedirectStandardError session-smoke-errors.log
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Session smoke timed out' }
          Get-Content session-smoke.log
          Get-Content session-smoke-errors.log
          if ($process.ExitCode -ne 0 -or -not (Select-String -Path session-smoke.log -Pattern EXTENSION_SESSION_CANVAS_AND_TAB_ACTIONS_PASS -Quiet)) { throw 'Session smoke failed' }
      - name: Verify redesigned shell on real Windows host
        shell: pwsh
        run: |
          $process = Start-Process -FilePath '.\node_modules\electron\dist\electron.exe' -ArgumentList '.', '--shell-smoke' -PassThru -RedirectStandardOutput shell-smoke.log -RedirectStandardError shell-smoke-errors.log
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Shell smoke timed out' }
          Get-Content shell-smoke.log
          Get-Content shell-smoke-errors.log
          if ($process.ExitCode -ne 0 -or -not (Select-String -Path shell-smoke.log -Pattern SHELL_SMOKE_PASS -Quiet)) { throw 'Shell smoke failed' }
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: windows-desktop-smoke
          path: |
            desktop/smoke*
            desktop/browser-smoke*
            desktop/provider-smoke*
            desktop/shell-smoke*
            desktop/session-smoke*
          retention-days: 14
      - run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath '.\dist\win-unpacked\OSMINOG Preview.exe' -ArgumentList '--smoke' -PassThru -RedirectStandardOutput packaged-smoke.log -RedirectStandardError packaged-smoke-errors.log
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Packaged smoke timed out' }
          Get-Content packaged-smoke.log
          Get-Content packaged-smoke-errors.log
          if ($process.ExitCode -ne 0 -or -not (Select-String -Path packaged-smoke.log -Pattern DESKTOP_SMOKE_PASS -Quiet)) { throw 'Packaged smoke failed' }
      - name: Verify installed application with spaces and Unicode in path
        shell: pwsh
        run: |
          $destination = Join-Path $env:LOCALAPPDATA 'Проверка Осьминога\OSMINOG Preview'
          $installer = Get-ChildItem '.\dist\*.exe' | Select-Object -First 1
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList '/S', '/currentuser', ('/D=' + $destination) -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw 'Installation failed' }
          $exe = Join-Path $destination 'OSMINOG Preview.exe'
          if (-not (Test-Path $exe)) { throw 'Installed executable missing' }
          foreach ($mode in @('smoke','browser-smoke','provider-smoke','shell-smoke','session-smoke')) {
            $out = "installed-$mode.log"; $err = "installed-$mode-errors.log"
            $process = Start-Process -FilePath $exe -ArgumentList "--$mode" -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            if (-not $process.WaitForExit(90000)) { $process.Kill(); throw "Installed $mode timed out" }
            Get-Content $out; Get-Content $err
            if ($process.ExitCode -ne 0 -or -not (Select-String -Path $out -Pattern 'SMOKE_PASS' -Quiet)) { throw "Installed $mode failed" }
          }
      - name: Verify ordinary installed startup without test flags
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Проверка Осьминога\OSMINOG Preview\OSMINOG Preview.exe'
          ./verify-normal-launch.ps1 -Executable $exe
      - name: Export verified runtime for release assembly
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path runtime -Force | Out-Null
          Copy-Item 'dist/win-unpacked/resources' runtime/resources -Recurse
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          @{ version=$package.version; electron=$package.devDependencies.electron; builder=$package.devDependencies.'electron-builder'; source=$env:GITHUB_SHA; productName=$package.build.productName; appId=$package.build.appId } | ConvertTo-Json | Set-Content runtime/runtime.json
          Compress-Archive -Path runtime/* -DestinationPath dist/OSMINOG-Windows-Runtime.zip
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: windows-desktop-candidate
          path: |
            desktop/dist/*.exe
            desktop/dist/*.yml
            desktop/dist/*.blockmap
            desktop/dist/OSMINOG-Windows-Runtime.zip
            desktop/installed-*.log
            desktop/smoke*.log
            desktop/smoke*.png
            desktop/packaged-smoke*.log
          retention-days: 14



