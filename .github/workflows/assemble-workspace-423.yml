name: Assemble reviewed workspace 4.0.23 source
on:
  push:
    branches: [fix/workspace-polish-4.0.23]
    paths: [.github/workflows/assemble-workspace-423.yml]
permissions:
  contents: write
concurrency:
  group: assemble-workspace-423
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact checked edits and check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply-workspace-423.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('osminog-library.js')
          s=p.read_text()
          old="count+')''}"
          assert s.count(old)==1, 'Bulk-delete label splice changed'
          p.write_text(s.replace(old,"count+')'}"))
          PY
          for file in editor.js osminog-workspace-polish.js osminog-library.js osminog-essential-ui.js osminog-windows-folders.js osminog-workdesk.js osminog-native-module-runtime.js osminog-extension-studio.js gpt-presence.js osminog-release-notes.js tests/workspace-423.cjs; do node --check "$file"; done
          git diff --check
      - name: Commit canonical source and remove one-time assembly machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add editor.html editor.js osminog-library.js osminog-essential-ui.js osminog-windows-folders.js osminog-workdesk.js osminog-native-module-runtime.js osminog-extension-studio.js gpt-presence.js manifest.json OSMINOG_BUILD.json osminog-release-notes.js RELEASE_NOTES_CHROME_4.0.23.md .github/workflows/agent-media-3207.yml
          git rm tools/apply-workspace-423.py .github/workflows/assemble-workspace-423.yml
          git commit -m 'Finalize Chrome 4.0.23 folders, search, retained materials and living lens'
          git push origin HEAD:refs/heads/fix/workspace-polish-4.0.23
          echo "Source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Package source for inspection without build dependencies
        shell: bash
        run: git archive --format=zip --output=OSMINOG-4.0.23-source-review.zip HEAD editor.html editor.js manifest.json osminog-workspace-polish.js osminog-workspace-polish.css osminog-library.js osminog-windows-folders.js osminog-essential-ui.js osminog-workdesk.js osminog-release-notes.js tests desktop .github
      - uses: actions/upload-artifact@v4
        with:
          name: OSMINOG-4.0.23-source-review
          path: OSMINOG-4.0.23-source-review.zip
          retention-days: 7
