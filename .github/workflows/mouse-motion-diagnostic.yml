name: Mouse Nora observer diagnostics (not a release)
on:
  pull_request:
    paths: ['tools/mouse-motion-diagnostic.cjs','.github/workflows/mouse-motion-diagnostic.yml']
permissions:
  contents: read
jobs:
  motion-observer-diagnostic:
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Bind diagnostic to unchanged product source
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          git fetch --depth=1 origin c8848cfa525b2c48ebbafcf7751be1d26d272590
          git diff --exit-code c8848cfa525b2c48ebbafcf7751be1d26d272590 -- . ../tools/mouse-verify.py ../tools/mouse-update-verify.py
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path('mouse-motion-diagnostic-provenance.json')
          data={'diagnosticOnly':True,'releaseEvidence':False,'productSource':'c8848cfa525b2c48ebbafcf7751be1d26d272590','diagnosticHead':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'harnessBeforeSHA256':hashlib.sha256(pathlib.Path('mouse-smoke.cjs').read_bytes()).hexdigest(),'diagnosticSHA256':hashlib.sha256(pathlib.Path('../tools/mouse-motion-diagnostic.cjs').read_bytes()).hexdigest()}
          p.write_text(json.dumps(data,indent=2)+'\n')
          with open('mouse-motion-diagnostic-display.json','w') as out:
           try:subprocess.run(['system_profiler','SPDisplaysDataType','-json'],stdout=out,stderr=subprocess.STDOUT,timeout=30,check=False)
           except subprocess.TimeoutExpired:out.write('\nSYSTEM_PROFILER_TIMEOUT\n')
          PY
      - run: npm ci
      - name: Prepare the same native runtime
        run: |
          npm ci --prefix mouse-agent
          node mouse-agent/prepare.cjs
          npm run prepare:runtime
          node mouse-native-build.cjs
          node mouse-icon.cjs
      - name: Install temporary diagnostic harness only
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,shutil,subprocess
          shutil.copyfile('../tools/mouse-motion-diagnostic.cjs','mouse-motion-diagnostic.cjs')
          p=pathlib.Path('mouse-smoke.cjs');text=p.read_text()
          old="await require('./mouse-628-ui-smoke.cjs')({app,win,browser,store,privateMode,globalCapture});"
          assert text.count(old)==1
          new="await require('./mouse-motion-diagnostic.cjs')({app,win,browser,store,privateMode,globalCapture,overlayGate});app.exit(0);return;"
          text=text.replace(old,new)
          prefix="await require('./mouse-629-feedback-smoke.cjs')({app,win,browser,store,libraryService,privateMode,globalCapture});"
          assert text.count(prefix)==1
          diagnostic_prefix="""await (async()=>{
            const observed={diagnosticOnly:true,releaseAcceptance:false,suite:'mouse-629-feedback-smoke.cjs',status:'running',startedAt:Date.now()};
            try{await require('./mouse-629-feedback-smoke.cjs')({app,win,browser,store,libraryService,privateMode,globalCapture});observed.status='passed';}
            catch(error){
              observed.status='failed';observed.error={message:error.message,stack:error.stack};
              const evidence=JSON.parse(await fs.readFile('mouse-629-feedback-evidence.json','utf8'));
              observed.cleanup={restored:evidence.restored,cleanupError:evidence.cleanupError??null,motionCleanupError:evidence.motionCleanupError??null};
              if(error.message!=='Actual rendered confirmation changes pixels outside the exported bitmap'||evidence.restored!==true||evidence.cleanupError||evidence.motionCleanupError)throw error;
              observed.continuedForDiagnosticOnly=true;
              console.error('MOUSE_MOTION_DIAGNOSTIC_PREFIX_FAILURE_RECORDED',JSON.stringify(observed));
            }finally{observed.completedAt=Date.now();await fs.writeFile('mouse-motion-diagnostic-prefix.json',JSON.stringify(observed,null,2)+'\\n');}
          })();"""
          p.write_text(text.replace(prefix,diagnostic_prefix))
          feedback_file=pathlib.Path('mouse-629-feedback-smoke.cjs');feedback_text=feedback_file.read_text();feedback_before=hashlib.sha256(feedback_file.read_bytes()).hexdigest()
          observation="assert.ok(changedPixels>20,'Actual rendered confirmation changes pixels outside the exported bitmap');"
          assert feedback_text.count(observation)==1
          feedback_text=feedback_text.replace(observation,"facts.capture.copyAttemptDiagnostic={copiedFeedback,copiedFrame,changedPixels,region,observedAt:performance.now(),afterReadback:await feedback()};"+observation)
          sampling="animationName:getComputedStyle(badge).animationName,"
          assert feedback_text.count(sampling)==1
          feedback_text=feedback_text.replace(sampling,"sampledAt:performance.now(),timeOrigin:performance.timeOrigin,badgeOpacity:getComputedStyle(badge).opacity,badgeAnimations:badge.getAnimations().map(a=>({currentTime:a.currentTime,startTime:a.startTime,playState:a.playState,timing:a.effect.getComputedTiming()})),"+sampling)
          capture_start="const image=await target.capturePage(),png=image.toPNG();"
          assert feedback_text.count(capture_start)==1
          feedback_text=feedback_text.replace(capture_start,"const requestedAt=performance.now(),image=await target.capturePage(),receivedAt=performance.now(),png=image.toPNG(),encodedAt=performance.now();")
          capture_result="return{file,source:'BrowserWindow.capturePage',"
          assert feedback_text.count(capture_result)==1
          feedback_text=feedback_text.replace(capture_result,"return{file,requestedAt,receivedAt,encodedAt,mainTimeOrigin:performance.timeOrigin,source:'BrowserWindow.capturePage',")
          feedback_file.write_text(feedback_text)
          pathlib.Path('mouse-motion-diagnostic-build.cjs').write_text("const base=require('./mouse-build.cjs');base.files.push('mouse-motion-diagnostic.cjs');base.directories.output='dist-mouse-motion-diagnostic';module.exports=base;\n")
          pathlib.Path('mouse-motion-diagnostic-harness.patch').write_bytes(subprocess.check_output(['git','diff','--','mouse-smoke.cjs','mouse-629-feedback-smoke.cjs']))
          provenance=pathlib.Path('mouse-motion-diagnostic-provenance.json');data=json.loads(provenance.read_text());data['harnessAfterSHA256']=hashlib.sha256(p.read_bytes()).hexdigest();data['feedbackBeforeSHA256']=feedback_before;data['feedbackAfterSHA256']=hashlib.sha256(feedback_file.read_bytes()).hexdigest();provenance.write_text(json.dumps(data,indent=2)+'\n')
          PY
          node --check mouse-motion-diagnostic.cjs
          node --check mouse-smoke.cjs
          node --check mouse-629-feedback-smoke.cjs
      - uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/mouse-electron-cache
            ${{ runner.temp }}/mouse-builder-cache
          key: mouse-macos-arm64-downloads-v1-${{ hashFiles('desktop/package-lock.json') }}
      - name: Build diagnostic app directory without release packages
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/mouse-electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/mouse-builder-cache
        run: npx electron-builder --config mouse-motion-diagnostic-build.cjs --mac --arm64 --dir --publish never
      - name: Run balanced observation experiment after the same smoke prefix
        run: |
          python3 - <<'PY'
          import os,pathlib,subprocess
          exe=pathlib.Path('dist-mouse-motion-diagnostic/mac-arm64/Mouse Browser.app/Contents/MacOS/Mouse Browser').resolve();assert exe.is_file()
          profile=pathlib.Path(os.environ['RUNNER_TEMP'])/'mouse-motion-diagnostic-profile';profile.mkdir()
          env={**os.environ,'CI':'true','MOUSE_TEST_PROFILE':str(profile),'MOUSE_MOTION_DIAGNOSTIC':'1','MOUSE_DIAGNOSTIC_SOURCE_HEAD':'c8848cfa525b2c48ebbafcf7751be1d26d272590'}
          log=pathlib.Path('mouse-motion-diagnostic-process.log')
          with log.open('w') as out:
           try:result=subprocess.run([str(exe),'--mouse-smoke-write','--mouse-init-race'],env=env,stdout=out,stderr=subprocess.STDOUT,timeout=660,check=False)
           except subprocess.TimeoutExpired:
            out.write('\nMOUSE_MOTION_DIAGNOSTIC_PROCESS_TIMEOUT\n');raise
          text=log.read_text(errors='replace');print(text)
          assert result.returncode==0, 'Diagnostic process did not complete'
          assert pathlib.Path('mouse-motion-diagnostic.json').is_file(), 'Diagnostic observations missing'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse-motion-observer-diagnostic-attempt-${{ github.run_attempt }}
          path: |
            desktop/mouse-*.json
            desktop/mouse-*.png
            desktop/mouse-*.log
            desktop/mouse-motion-diagnostic*.patch
          if-no-files-found: error
          retention-days: 14
