name: Test 3.19.6 Drive asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-drive-asset-3196.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch owner asset
        shell: bash
        run: |
          set -euxo pipefail
          url='https://drive.usercontent.google.com/download?id=1ljD21xD8c78LFCYKLqB4NJJkeeYyCWhh&export=download&confirm=t'
          curl -fL --retry 2 --connect-timeout 15 -o /tmp/hero.webp "$url"
          stat -c%s /tmp/hero.webp
          sha256sum /tmp/hero.webp
          test "$(stat -c%s /tmp/hero.webp)" = '1459142'
          test "$(sha256sum /tmp/hero.webp | cut -d' ' -f1)" = '2dcc954ecb598b067f017c0fca556e38f45cbecaad29595019fc6b0943aaff68'
