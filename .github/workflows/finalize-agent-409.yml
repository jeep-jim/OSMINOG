name: Verify final agent outcome corrections
on:
  push:
    branches: ['codex/agent-runtime-device-409']
    paths: ['tools/finalize-agent-409.py']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/finalize-agent-409.py
      - run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'codex/agent-runtime-device-409'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gpt-presence.js tests/agent-session-409.cjs
          git commit -m 'Require verified canvas outcomes and preserve explicit user cancellation'
          git push origin HEAD:refs/heads/codex/agent-runtime-device-409
