name: Prepare owner619 library changes
on:
  push:
    branches: ['fix/mouse619-tab-flow']
    paths: ['tools/library619-apply.py','tools/library619-ui-prefix.txt','.github/workflows/library619-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'jeep-jim/OSMINOG' && github.ref == 'refs/heads/fix/mouse619-tab-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply exact-match library changes and regression checks
        run: |
          set -euo pipefail
          python3 tools/library619-apply.py
          git diff --check
          node --check desktop/mouse/browsing.js
          node --check desktop/mouse-library-view-smoke.cjs
          cd desktop
          node --test mouse-library.test.cjs mouse-library-view.test.cjs mouse-start.test.cjs mouse-613.test.cjs mouse-615.test.cjs mouse-616.test.cjs mouse-617.test.cjs mouse-emoji.test.cjs mouse-tab-flow.test.cjs
      - name: Commit only source, tests and roadmap with branch head guard
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/mouse619-tab-flow | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop MOUSE_BROWSER_ROADMAP.md
          git commit -m 'Add library favicons, native file icons, list and tiles, top controls and safe selected clear'
          git push origin HEAD:refs/heads/fix/mouse619-tab-flow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse619-library-prepared
          path: |
            desktop
            MOUSE_BROWSER_ROADMAP.md
            .github/workflows/mouse-macos.yml
          retention-days: 2
