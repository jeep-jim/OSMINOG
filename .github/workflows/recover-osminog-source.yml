name: Recover OSMINOG source from Git history

on:
  push:
    branches:
      - rebrand/osminog-devhub
    paths:
      - '.github/workflows/recover-osminog-source.yml'

permissions:
  contents: write

jobs:
  inventory-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private project history
        uses: actions/checkout@v4
        with:
          ref: rebrand/osminog-devhub
          fetch-depth: 0

      - name: Fetch every private ref
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' --prune

      - name: Clone public release history
        shell: bash
        run: |
          set -euo pipefail
          git clone --mirror https://github.com/jeep-jim/chernogram_new.git "$RUNNER_TEMP/chernogram_new.git"

      - name: Scan objects and recover candidate packages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          import pathlib
          import re
          import subprocess
          import zipfile

          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          recovery = workspace / 'recovery'
          candidates_root = recovery / 'candidates'
          recovery.mkdir(parents=True, exist_ok=True)
          candidates_root.mkdir(parents=True, exist_ok=True)

          repos = [
              ('private-BriefCraft', workspace),
              ('public-chernogram_new', pathlib.Path(os.environ['RUNNER_TEMP']) / 'chernogram_new.git'),
          ]

          interesting = re.compile(
              r'(?i)(?:\.zip$|(?:^|/)(?:manifest\.json|update-manifest\.json|fileset\.json|editor\.(?:js|html|css)|gpt-presence\.js|background\.js|popup\.(?:html|js|css)|bridge[^/]*\.js|native[^/]*\.(?:cs|cpp|js|json)|install[^/]*\.(?:cmd|ps1|exe|msi)|.*briefcraft.*|.*osminog.*|.*richcraft.*)$)'
          )
          package_hint = re.compile(r'(?i)(briefcraft|osminog|richcraft|bootstrap|recovery|release|extension)')
          commit_hint = re.compile(r'(?i)(briefcraft|osminog|richcraft|3\.8\.|updat|bootstrap|recovery|extension|chrome)')

          def run(repo: pathlib.Path, *args: str, binary: bool = False, check: bool = True):
              result = subprocess.run(
                  ['git', '-C', str(repo), *args],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
              )
              if check and result.returncode != 0:
                  raise RuntimeError(
                      f"git {' '.join(args)} failed in {repo}: "
                      + result.stderr.decode('utf-8', errors='replace')
                  )
              return result.stdout if binary else result.stdout.decode('utf-8', errors='replace')

          rows: list[tuple[str, str, int, str, str]] = []
          recovered: list[tuple[str, str, int, str, str, str]] = []
          commits: list[tuple[str, str, str, str]] = []

          for label, repo in repos:
              object_lines = run(repo, 'rev-list', '--objects', '--all').splitlines()
              seen: set[tuple[str, str]] = set()
              for line in object_lines:
                  if not line.strip():
                      continue
                  sha, sep, path = line.partition(' ')
                  path = path.strip()
                  if not path or not interesting.search(path):
                      continue
                  key = (sha, path)
                  if key in seen:
                      continue
                  seen.add(key)
                  obj_type = run(repo, 'cat-file', '-t', sha).strip()
                  if obj_type != 'blob':
                      continue
                  try:
                      size = int(run(repo, 'cat-file', '-s', sha).strip())
                  except ValueError:
                      size = -1
                  rows.append((label, sha, size, obj_type, path))

                  lower = path.lower()
                  if lower.endswith('.zip') and package_hint.search(path) and 0 <= size <= 25 * 1024 * 1024:
                      data = run(repo, 'cat-file', '-p', sha, binary=True)
                      safe_name = re.sub(r'[^A-Za-z0-9._-]+', '_', pathlib.Path(path).name)
                      out_dir = candidates_root / label
                      out_dir.mkdir(parents=True, exist_ok=True)
                      out_path = out_dir / f'{sha[:12]}-{safe_name}'
                      out_path.write_bytes(data)
                      digest = hashlib.sha256(data).hexdigest()
                      status = 'valid'
                      detail = ''
                      try:
                          with zipfile.ZipFile(out_path) as zf:
                              bad = zf.testzip()
                              if bad:
                                  status = 'invalid'
                                  detail = f'CRC failure: {bad}'
                              else:
                                  names = zf.namelist()
                                  detail = f'{len(names)} entries; root manifest={"manifest.json" in names}'
                      except Exception as exc:
                          status = 'invalid'
                          detail = f'{type(exc).__name__}: {exc}'
                      recovered.append((label, path, size, digest, status, detail))

              log = run(repo, 'log', '--all', '--date=iso-strict', '--format=%H%x09%ad%x09%s')
              for line in log.splitlines():
                  parts = line.split('\t', 2)
                  if len(parts) == 3 and commit_hint.search(parts[2]):
                      commits.append((label, parts[0], parts[1], parts[2]))

          rows.sort(key=lambda item: (item[0], item[4].lower(), item[1]))
          commits.sort(key=lambda item: (item[0], item[2], item[1]), reverse=True)

          report: list[str] = []
          report.append('# OSMINOG Git source inventory')
          report.append('')
          report.append('Generated by GitHub Actions from all reachable branches and tags in the private project repository and the public release repository.')
          report.append('')
          report.append('## Recovered ZIP candidates')
          report.append('')
          if recovered:
              report.append('| Repository | Historical path | Bytes | SHA-256 | Integrity | Detail |')
              report.append('|---|---|---:|---|---|---|')
              for label, path, size, digest, status, detail in recovered:
                  report.append(f'| `{label}` | `{path}` | {size} | `{digest}` | **{status}** | {detail.replace("|", "\\|")} |')
          else:
              report.append('No reachable candidate ZIP was found under the configured size limit.')

          report.append('')
          report.append('## Interesting reachable blobs')
          report.append('')
          report.append('| Repository | Blob | Bytes | Historical path |')
          report.append('|---|---|---:|---|')
          for label, sha, size, _obj_type, path in rows:
              report.append(f'| `{label}` | `{sha}` | {size} | `{path}` |')

          report.append('')
          report.append('## Relevant commit messages')
          report.append('')
          report.append('| Repository | Commit | Date | Subject |')
          report.append('|---|---|---|---|')
          for label, sha, date, subject in commits[:500]:
              report.append(f'| `{label}` | `{sha}` | {date} | {subject.replace("|", "\\|")} |')

          report.append('')
          report.append('## Interpretation rule')
          report.append('')
          report.append('A filename or registry entry is not proof of a usable build. Only ZIP candidates marked `valid`, followed by manifest/key/version checks and an end-to-end runtime test, may become reconstruction inputs.')
          report.append('')
          (recovery / 'source-inventory.md').write_text('\n'.join(report) + '\n', encoding='utf-8')
          PY

      - name: Commit inventory and recovered candidates
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/recover-osminog-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A recovery .github/workflows/recover-osminog-source.yml
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Inventory and recover OSMINOG source from Git history'
          git push origin HEAD:rebrand/osminog-devhub
