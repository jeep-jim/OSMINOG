name: Assemble reviewed I/O recovery 4.0.25 sources
on:
  push:
    branches: [fix/io-recovery-4.0.25]
    paths: ['tools/io-recovery-425-seed.b64', '.github/workflows/assemble-io-recovery-425.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify reviewed payload and exact source preimages
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,pathlib
          root=pathlib.Path('.')
          encoded=(root/'tools/io-recovery-425-seed.b64').read_text().strip()
          # Repair only transport-copy typos; the reviewed payload digest is mandatory.
          for old,new in [('NnhjNXhgMHjguDPbs','NnhjNXhgMHgUDPbs'),('GVapu6hN156oS2s','GVapu6hN56oS2s'),('WUt86+zrPSwlyplo2plo2HJ','WUt86+zrPSwlyplo2HJ')]:
              encoded=encoded.replace(old,new)
          raw=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='f9b62b94fc00b4d4fbee684f7746b7339754360216b903f7ff9a8af81f2fe3c4','Reviewed payload checksum mismatch'
          payload=json.loads(raw)
          for name,digest in payload['expected'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest, 'Source changed: '+name
          for patch in payload['patches']:
              path=root/patch['path']; text=path.read_text()
              assert text.count(patch['old'])==1,'Patch anchor changed: '+str(path)
              path.write_text(text.replace(patch['old'],patch['new']))
          for name,text in payload['files'].items():
              path=root/name; assert not path.exists(), 'New path already exists: '+name
              path.parent.mkdir(parents=True,exist_ok=True);path.write_text(text)
          version='4.0.25'; artifact='OSMINOG-Chrome-4.0.25-IO-RECOVERY.zip'
          path=root/'manifest.json'; manifest=json.loads(path.read_text());assert manifest['version']=='4.0.24'
          manifest.update(version=version,version_name='4.0.25 · I/O Recovery');path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          path=root/'OSMINOG_BUILD.json'; build=json.loads(path.read_text())
          build.update(version=version,manifestVersion=version,versionName=manifest['version_name'],artifact=artifact,baseVersion='4.0.24',runtimeVerified=False,notes='Coalesced directory reads and saves; clipboard status does not reload disk folders; acknowledged editor reopening after update. No owner-device crash reproduction claimed.')
          build.pop('sourceCommit',None);build.pop('verificationRun',None);path.write_text(json.dumps(build,ensure_ascii=False,indent=2)+'\n')
          path=root/'.github/workflows/agent-media-3207.yml'; workflow=path.read_text().replace('4.0.24','4.0.25').replace('PERFORMANCE-FIX','IO-RECOVERY').replace('Performance Hotfix','I/O Recovery').replace('performance hotfix','I/O recovery')
          old='      - run: node tests/collector-runtime-421.cjs'
          assert workflow.count(old)==1
          workflow=workflow.replace(old,'      - run: node --check osminog-update-recovery.js\n      - run: node --test tests/io-budget-425.cjs tests/update-recovery-425.cjs\n'+old)
          old='      - run: xvfb-run -a node tests/clipboard-extension-421.cjs';assert workflow.count(old)==1
          workflow=workflow.replace(old,old+'\n      - run: xvfb-run -a node tests/io-extension-425.cjs')
          workflow=workflow.replace('            artifacts/workspace-424-results.json','            artifacts/workspace-424-results.json\n            artifacts/io-extension-425-results.json')
          path.write_text(workflow)
          for name in ['tests/provider-dock-3217.cjs','tests/provider-session-isolation-3218.cjs']:
              path=root/name;text=path.read_text();assert text.count("manifest.version,'4.0.24'")==1;path.write_text(text.replace("manifest.version,'4.0.24'","manifest.version,'4.0.25'"))
          path=root/'tests/agent-media-3207.cjs';text=path.read_text();assert text.count('"4.0.24"')==1;path.write_text(text.replace('"4.0.24"','"4.0.24","4.0.25"'))
          path=root/'desktop/workspace-tools.test.cjs'
          path.write_text(path.read_text()+"\n// Shared I/O scheduler remains available to the native adapter.\ntest('shared I/O scheduler coalesces same-turn calls and returns the saved value',async()=>{const {coalesce}=require('../osminog-io-budget.js');let calls=0;const save=coalesce(async value=>{calls++;return value});const result=await Promise.all([save(1),save(2),save(3)]);assert.deepEqual(result,[3,3,3]);assert.equal(calls,1)});\n")
          notes={
            'ru':{'title':'Папки и восстановление после обновления','items':['Статус буфера больше не перечитывает открытую папку с диска.','Чтения папок и сохранения выполняются последовательно, без растущей очереди снимков.','Очередь буфера не загружает все сохранённые проекты на пустом опросе.','После обновления запрос открытия сохраняется до подтверждения нового редактора.']},
            'en':{'title':'Directory I/O and update recovery','items':['Clipboard status no longer rereads the open disk folder.','Directory reads and saves coalesce without queued project snapshots.','Empty clipboard polls do not load all stored projects.','Update reopening remains pending until the new editor acknowledges readiness.']}
          }
          for locale in ['de','es','ja','zh']:notes[locale]=notes['en']
          path=root/'osminog-release-notes.js';text=path.read_text();assert text.count('const catalog={')==1
          text=text.replace('const catalog={','const catalog={\n'+repr(version)+':'+json.dumps(notes,ensure_ascii=False)+',')
          text=text.replace("let lastVersion='4.0.24'","let lastVersion='4.0.25'").replace("||catalog['4.0.24']","||catalog['4.0.25']")
          path.write_text(text)
          (root/'RELEASE_NOTES_CHROME_4.0.25.md').write_text('# OSMINOG Chrome 4.0.25 — I/O Recovery\n\nClipboard status updates no longer re-enumerate disk folders. Folder reads serialize and coalesce; stale location results are ignored and failures are visible. Thumbnail reads are bounded and use a small cache. Saves retain the latest requested project state without a queue of cloned snapshots. Empty capture polls fetch matching keys rather than all project/backup values. Unchanged image signatures are reused and cold index scans yield between items.\n\nUpdate/reload requests are retained until the new editor acknowledges readiness; disappeared tabs and transient tab errors are retried. Update preparation waits for a save.\n\nNo project schema, fixed extension identity or permissions are changed. Owner-device crashes are not reproduced or claimed resolved by a synthetic measurement. All existing runtime gates and new real extension directory/storage/reload checks must pass before publication.\n')
          print('Reviewed canonical sources assembled; no data migration.')
          PY
      - name: Verify source syntax and scheduler/recovery tests
        run: |
          node --check editor.js
          node --check background.js
          node --check osminog-windows-folders.js
          node --check osminog-library.js
          node --check osminog-folder-updater.js
          node --check osminog-release-notes.js
          node --test tests/io-budget-425.cjs tests/update-recovery-425.cjs
      - name: Commit canonical sources and remove one-time assembly files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/io-recovery-425-seed.b64 .github/workflows/assemble-io-recovery-425.yml
          git add editor.html editor.js background.js osminog-library.js osminog-windows-folders.js osminog-folder-updater.js osminog-io-budget.js osminog-update-recovery.js manifest.json OSMINOG_BUILD.json osminog-release-notes.js RELEASE_NOTES_CHROME_4.0.25.md tests/ desktop/workspace-tools.test.cjs .github/workflows/agent-media-3207.yml
          git commit -m 'Fix folder I/O storms, coalesce durable saves and acknowledge editor restart in 4.0.25'
          git push origin HEAD:fix/io-recovery-4.0.25
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: io-recovery-425-assembly-diagnostic
          path: tools/io-recovery-425-seed.b64
          retention-days: 2
