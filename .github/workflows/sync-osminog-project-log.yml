name: Sync OSMINOG append-only project log

on:
  push:
    branches: [main]
    paths:
      - 'project-log-queue/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osminog-project-log
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append queued entries without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project-log-archive
          shopt -s nullglob
          changed=0
          for entry in project-log-queue/*.md; do
            marker=$(grep -m1 '^## ' "$entry" || true)
            if [ -z "$marker" ]; then
              echo "Missing level-2 heading marker in $entry" >&2
              exit 1
            fi
            if ! grep -Fqx "$marker" OSMINOG_PROJECT_LOG.md; then
              printf '\n\n---\n\n' >> OSMINOG_PROJECT_LOG.md
              cat "$entry" >> OSMINOG_PROJECT_LOG.md
              printf '\n' >> OSMINOG_PROJECT_LOG.md
            fi
            git mv "$entry" "project-log-archive/$(basename "$entry")"
            changed=1
          done

          if [ "$changed" = 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add OSMINOG_PROJECT_LOG.md project-log-queue project-log-archive
            git commit -m "Append queued OSMINOG project log entries"
            git push
          fi
