name: Append OSMINOG 3.10.4 project log

on:
  push:
    branches: [main]
    paths: ['.github/workflows/append-osminog-3.10.4-log.yml']

permissions:
  contents: write

jobs:
  append:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append canonical continuation record
        env:
          APPEND_B64: 
        run: |
          python -c "import os,base64,pathlib; p=pathlib.Path('OSMINOG_PROJECT_LOG.md'); d=p.read_bytes(); a=base64.b64decode(os.environ['APPEND_B64']); p.write_bytes(d if b'OSMINOG 3.10.4 RECOVERY PERFORMANCE' in d else d+a)"
      - name: Commit append and remove one-shot workflow
        run: |
          git rm -f .github/workflows/append-osminog-3.10.4-log.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OSMINOG_PROJECT_LOG.md
          git diff --cached --quiet || git commit -m 'Append OSMINOG 3.10.4 RECOVERY PERFORMANCE project log'
          git push origin HEAD:main
