name: Apply reviewed Quadro 602 source changes
on:
  push:
    branches: [codex/quadro-602-controls-capture]
    paths: [tools/quadro602_prepare.py,.github/workflows/quadro-602-prepare.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply exact guarded edits only in Quadro scope
        run: |
          python3 tools/quadro602_prepare.py
          rm tools/quadro602_prepare.py .github/workflows/quadro-602-prepare.yml
          python3 - <<'PY'
          import subprocess
          allowed=('desktop/quadro','tools/quadro-verify.py','tools/quadro602_prepare.py','.github/workflows/quadro-','.github/workflows/quadro602','docs/desktop/2026-11-14-quadro-controls-capture.md','OSMINOG_BROWSER_ROADMAP.md')
          changed=subprocess.check_output(['git','diff','--name-only']).decode().splitlines()+subprocess.check_output(['git','ls-files','--others','--exclude-standard']).decode().splitlines()
          assert all(p.startswith(allowed) for p in changed),changed
          PY
          git add desktop/quadro* tools/quadro-verify.py tools/quadro602_prepare.py .github/workflows/quadro-* docs/desktop/2026-11-14-quadro-controls-capture.md OSMINOG_BROWSER_ROADMAP.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply owner-requested Quadro 6.0.2 controls, original icon and local screenshot integration'
          git push origin HEAD:codex/quadro-602-controls-capture
          git rev-parse HEAD
