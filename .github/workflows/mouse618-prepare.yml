name: Prepare Mouse 618 geometry hotfix
on:
  push:
    branches: ['fix/mouse618-burrow-geometry']
    paths: ['.github/workflows/mouse618-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'jeep-jim/OSMINOG' && github.ref == 'refs/heads/fix/mouse618-burrow-geometry'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply guarded version and test updates without changing other UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,hashlib,subprocess
          subprocess.run(['git','merge-base','--is-ancestor','e3697d45a9126a3ece8a77f972630fec184aea3e','HEAD'],check=True)
          edits={}
          def read(p): return edits.get(p,pathlib.Path(p).read_text())
          def change(p,old,new,n=1):
              s=read(p);assert s.count(old)==n,(p,old,s.count(old));edits[p]=s.replace(old,new)
          def blob(p,want):
              data=pathlib.Path(p).read_bytes();actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest();assert actual==want,(p,actual)
          blob('desktop/mouse/mouse-615.css','0bc9cb8e9f807a441400a169dfb47d61070cabc4')
          blob('desktop/mouse/burrow.svg','0d9059f21f232ac7800f9a6ef6d7cb5c76bd38bc')
          blob('tools/mouse-update-verify.py','13082a18a862453d874907fcee2bfb608c0581f6')
          # Shrink only vertically; default SVG aspect-ratio would also shrink width.
          change('desktop/mouse/burrow.svg','viewBox="0 0 36 32"','viewBox="0 0 36 32" preserveAspectRatio="none"')
          for p in ['desktop/mouse-build.cjs','desktop/mouse-smoke.cjs','desktop/mouse-browser.test.cjs','desktop/mouse-606.test.cjs']:
              change(p,'6.0.17','6.0.18')
          change('tools/mouse-verify.py','6.0.17','6.0.18',3)
          p='tools/mouse-update-verify.py'
          s=read(p).replace('6.0.17','6.0.18').replace('6.0.16','6.0.17')
          s=s.replace('MOUSE_617_REAL_616_TO_617_REPLACE_RELAUNCH_PROFILE_PASS','MOUSE_618_REAL_617_TO_618_REPLACE_RELAUNCH_PROFILE_PASS')
          for a,b in [('mouse616-update-roundtrip','mouse617-update-roundtrip'),('old616.dmg','old617.dmg'),('keep-profile-616','keep-profile-617'),('retain-616','retain-617')]:s=s.replace(a,b)
          assert s.count('5c9cc094e4c907b2551b69cd4d1061047c5f986fe3a6b8f70bcef5cb565df7ce')==1
          s=s.replace('5c9cc094e4c907b2551b69cd4d1061047c5f986fe3a6b8f70bcef5cb565df7ce','a565253cb6443659b85b06558de4cba8f212917b04b6b8d5acc9f5af35e4a0d0');edits[p]=s
          for p in ['desktop/mouse-615.test.cjs','desktop/mouse-617.test.cjs']:change(p,'margin-bottom:-4px','margin-bottom:-5px')
          change('desktop/mouse-615-smoke.cjs','assert.deepEqual(look.r,[36,32])','assert.deepEqual(look.r,[36,29])')
          change('desktop/mouse-617-smoke.cjs','Math.abs(geometry.burrowBottom-geometry.lineTop)','Math.abs(geometry.burrowBottom-(geometry.lineTop+1))')
          geometry=r'''
             // Compare to the exact released 617 geometry without changing production CSS.
             const delta=await js(`(()=>{const b=document.querySelector('#new-tab'),bar=document.querySelector('.toolbar'),saved=b.getAttribute('style'),now=b.getBoundingClientRect();b.style.setProperty('height','32px','important');b.style.setProperty('min-height','32px','important');b.style.setProperty('margin-bottom','-4px','important');const old=b.getBoundingClientRect();if(saved===null)b.removeAttribute('style');else b.setAttribute('style',saved);const r=b.getBoundingClientRect();return{height:r.height-old.height,bottom:r.bottom-old.bottom,top:r.top-old.top,width:r.width-old.width,divider:r.bottom-bar.getBoundingClientRect().bottom,stable:r.height===now.height&&r.top===now.top,crop:{x:Math.max(0,Math.floor(r.x)-8),y:Math.max(0,Math.floor(bar.getBoundingClientRect().top)),width:Math.min(Math.ceil(r.width)+16,innerWidth-Math.max(0,Math.floor(r.x)-8)),height:Math.ceil(bar.getBoundingClientRect().height)+8}}})()`);
             assert.equal(delta.height,-3);assert.equal(delta.bottom,1);assert.equal(delta.top,4);assert.equal(delta.width,0);assert.equal(delta.divider,0);assert.equal(delta.stable,true);
             console.log('MOUSE_618_BURROW_GEOMETRY',theme,JSON.stringify(delta));
             await fs.writeFile('mouse-618-burrow-'+theme+'.png',(await win.capturePage(delta.crop)).toPNG());
          '''
          change('desktop/mouse-615-smoke.cjs',"   await fs.writeFile('mouse-615-burrow-'+theme+'.png'",geometry+"   await fs.writeFile('mouse-615-burrow-'+theme+'.png'")
          change('desktop/mouse-615-smoke.cjs',"  console.log('MOUSE_616_ARCH_PLUS_AND_SEPARATE_FOOTER_BOTH_THEMES_PASS');","  console.log('MOUSE_616_ARCH_PLUS_AND_SEPARATE_FOOTER_BOTH_THEMES_PASS');\n  console.log('MOUSE_618_BURROW_DOWN1_SHORTER3_BOTH_THEMES_PASS');")
          p='desktop/mouse-617.test.cjs'
          edits[p]=read(p)+r'''
          test('618 changes only burrow height and baseline; original curve, width, gradient and plus stay exact',()=>{
           const crypto=require('node:crypto');
           const blob=s=>crypto.createHash('sha1').update(Buffer.concat([Buffer.from('blob '+Buffer.byteLength(s)+'\0'.replace('\\0','\0')),Buffer.from(s)])).digest('hex');
           const css=read('mouse/mouse-615.css');assert.match(css,/width:36px;height:29px;min-height:29px/);assert.match(css,/margin-bottom:-5px/);
           const previous=css.replace('height:29px;min-height:29px','height:32px;min-height:32px').replace('margin-bottom:-5px','margin-bottom:-4px');
           assert.equal(blob(previous),'49cbbdffd25b56d9b53c6c7df18d8867571b3a17','all other stylesheet bytes must match released617');
           const svg=read('mouse/burrow.svg');assert.match(svg,/preserveAspectRatio="none"/);
           assert.equal(blob(svg.replace(' preserveAspectRatio="none"','')),'0d9059f21f232ac7800f9a6ef6d7cb5c76bd38bc','original curve and gradient unchanged');
          });
          '''
          # Make the Git object header use a literal null separator in JS source.
          edits[p]=edits[p].replace("+'\\0'.replace('\\\\0','\\0')","+'\\0'")
          p='MOUSE_BROWSER_ROADMAP.md'
          heading='## 16 ноября 2026 — кандидат 6.0.18: только геометрия норки'
          assert heading not in read(p)
          edits[p]=read(p)+'\n'+heading+'\n\nПрямое поручение после установки6.0.17: опустить основание норки на1px и УМЕНЬШИТЬ высоту на3px, а не увеличить. CSS height/min-height32→29px, margin-bottom−4→−5px. SVG сохраняет прежнюю ширину36px, контур и градиент; preserveAspectRatio=none сжимает только вертикальную ось. Плюс12px, hover/focus, голова владельца, footer и весь остальной интерфейс не переделываются. Сгенерированная картинка не является реализацией.\n\nДобавлена проверка точного отличия от геометрии6.0.17: низ+1px, высота−3px, верх+4px, ширина без изменений, основание совпадает с нижней границей разделительной полосы. Нативная проверка выполняется в обеих темах и сохраняет снимки; прежние тесты кликов/приватности/профиля сохранены. Проверка установки переключена на6.0.17→6.0.18 с SHA опубликованного617. На момент подготовки этой записи нативный результат и публикация618 НЕ подтверждены. Остальные проекты и данные пользователя не затронуты.\n'
          for p,s in edits.items():pathlib.Path(p).write_text(s)
          print('Scoped updates:',sorted(edits))
          PY
          git diff --check
          for file in $(git diff --name-only -- '*.js' '*.cjs'); do node --check "$file"; done
          python3 -m py_compile tools/mouse-verify.py tools/mouse-update-verify.py
          (cd desktop && node --test mouse-615.test.cjs mouse-617.test.cjs)
      - name: Commit source and test changes only with branch head guard
        run: |
          set -euo pipefail
          BRANCH=fix/mouse618-burrow-geometry
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- desktop tools/mouse-verify.py tools/mouse-update-verify.py MOUSE_BROWSER_ROADMAP.md
          git commit -m 'Prepare Mouse6.0.18 exact burrow geometry and profile-preserving upgrade checks'
          git push origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse618-prepared-source
          path: |
            desktop
            tools/mouse-verify.py
            tools/mouse-update-verify.py
            MOUSE_BROWSER_ROADMAP.md
          retention-days: 2
