name: Apply owner619 tab flow correction
on:
  push:
    branches: ['fix/mouse619-tab-flow']
    paths: ['tools/mouse619-tabs-apply.py','.github/workflows/mouse619-tabs-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'jeep-jim/OSMINOG' && github.ref == 'refs/heads/fix/mouse619-tab-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply narrow changes and keep all existing regressions
        run: |
          set -euo pipefail
          python3 tools/mouse619-tabs-apply.py
          git diff --check
          node --check desktop/mouse-tab-flow-smoke.cjs
          cd desktop
          node --test mouse-613.test.cjs mouse-615.test.cjs mouse-616.test.cjs mouse-617.test.cjs mouse-emoji.test.cjs mouse-tab-flow.test.cjs
      - name: Commit only code, tests and appended roadmap with head guard
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/mouse619-tab-flow | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop MOUSE_BROWSER_ROADMAP.md
          git commit -m 'Join active tab and burrow rim to theme divider in unpublished619'
          git push origin HEAD:refs/heads/fix/mouse619-tab-flow
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse619-tabs-prepared
          path: |
            desktop
            tools/mouse-verify.py
            tools/mouse-update-verify.py
          retention-days: 2
