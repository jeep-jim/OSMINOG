name: Mouse620 source snapshot
on:
  push:
    branches: ['fix/mouse620-local-library']
    paths: ['.github/workflows/mouse620-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          git archive --format=tar HEAD desktop tools .github AGENTS.md MOUSE_BROWSER_ROADMAP.md OSMINOG_ROADMAP.md OSMINOG_PROJECT_LOG.md OSMINOG_BROWSER_ROADMAP.md > mouse620-source.tar
          git rev-parse HEAD > mouse620-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mouse620-source
          path: |
            mouse620-source.tar
            mouse620-source-sha.txt
          retention-days: 2
