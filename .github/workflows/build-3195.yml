name: OSMINOG 3.19.5 split core hero

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-3195.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 3.19.5 source changes
        run: python scripts/build_3195.py

      - name: Verify 3.19.5 source
        shell: bash
        run: |
          set -euxo pipefail
          test -f assets/core/hero-human-3195.webp
          test -f assets/core/hero-octopus-ai-3195.webp
          test "$(stat -c%s assets/core/hero-human-3195.webp)" -gt 40000
          test "$(stat -c%s assets/core/hero-octopus-ai-3195.webp)" -eq 44520
          test "$(sha256sum assets/core/hero-octopus-ai-3195.webp | cut -d' ' -f1)" = "c212e02dfd2cc8fb29080da447dedb77cabe5ead63410e8968207cf63cb46260"
          test ! -e assets/core/core-hero.webp
          grep -q 'hero-human-3195.webp' editor.html
          grep -q 'hero-octopus-ai-3195.webp' editor.html
          ! grep -q 'core-hero.webp' editor.html
          grep -q 'OSMINOG 3.19.5 · SPLIT CORE HERO' editor.css
          ! grep -q 'core-hero-banana' editor.css
          ! grep -q 'core-hero-star' editor.css
          grep -q 'nativeDropBusy' editor.js
          ! grep -q 'osminog-native-file-drag' editor.css
          node --check editor.js
          python -m json.tool manifest.json >/dev/null
          python -m json.tool OSMINOG_BUILD.json >/dev/null
          test "$(python -c 'import json;print(json.load(open("manifest.json"))["version"])')" = "3.19.5"
          test "$(python -c 'import json;print(json.load(open("manifest.json"))["version_name"])')" = "3.19.5"
          test "$(python -c 'import json;print(json.load(open("OSMINOG_BUILD.json"))["version"])')" = "3.19.5"
          python - <<'PY'
          import json
          m=json.load(open('manifest.json',encoding='utf-8'))
          assert m.get('key'), 'fixed extension key missing'
          print('FIXED_KEY_OK', len(m['key']))
          PY
          echo SOURCE_3195_OK

      - name: Commit 3.19.5 source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/build-3195.yml scripts/build_3195.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'OSMINOG 3.19.5 split core hero [skip ci]'
          git push origin HEAD:main
