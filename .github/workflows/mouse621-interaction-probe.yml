name: Mouse621 isolated native interaction diagnostic
on:
  push:
    branches: [feat/mouse621-desktops-toasts-drag]
    paths: ['tools/mouse621-interaction-probe.cjs','.github/workflows/mouse621-interaction-probe.yml','desktop/mouse/desktops.js','desktop/browser.cjs']
permissions:
  contents: read
jobs:
  native-probe:
    runs-on: macos-15
    timeout-minutes: 5
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npm run prepare:runtime && node mouse-native-build.cjs && node mouse-icon.cjs
      - name: Test bounded native layout scheduling in disposable source only
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const file='mouse/browser.js',s=fs.readFileSync(file,'utf8');
          const before='let frame=0;function requestLayout(){cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>safe(layoutNow))}';
          const after='let frame=0,layoutTimeout=0;function requestLayout(){if(frame||layoutTimeout)return;const flush=()=>{if(!frame&&!layoutTimeout)return;cancelAnimationFrame(frame);clearTimeout(layoutTimeout);frame=layoutTimeout=0;safe(layoutNow);};frame=requestAnimationFrame(flush);layoutTimeout=setTimeout(flush,16);}';
          assert.equal(s.split(before).length,2,'Exact source scheduler required');
          fs.writeFileSync(file,s.replace(before,after));
          NODE
          node --check mouse/browser.js
          git diff -- mouse/browser.js > mouse621-layout-probe.patch
      - name: Isolated actual native pointer hit testing
        shell: bash
        run: |
          set -euo pipefail
          export CI=true
          export MOUSE_TEST_PROFILE="$RUNNER_TEMP/mouse621-native-probe"
          mkdir -p "$MOUSE_TEST_PROFILE"
          ./node_modules/.bin/electron ../tools/mouse621-interaction-probe.cjs --mouse-smoke-write 2>&1 | tee mouse621-probe.log
          grep -q MOUSE621_ISOLATED_NATIVE_TRAY_CLICK_PASS mouse621-probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse621-isolated-native-interaction
          path: |
            desktop/mouse621-probe.log
            desktop/mouse621-probe-*.png
            desktop/mouse621-layout-probe.patch
            desktop/mouse/browser.js
            desktop/mouse/desktops.js
            desktop/browser.cjs
            desktop/mouse-621-smoke.cjs
          retention-days: 2
