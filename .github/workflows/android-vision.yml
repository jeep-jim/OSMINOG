name: Android Vision focused build
on:
  push:
    branches: ['main', 'feat/android-ocean-*', 'fix/android-vision-*']
    paths: ['android-vision/**', '.github/workflows/android-vision.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-vision-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip android]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate mobile scripts and original design assets
        run: |
          node --check android-vision/app/src/main/assets/app.js
          node --check android-vision/app/src/main/assets/provider.js
          python3 android-vision/tools/check-assets.py
      - name: Build and lint
        working-directory: android-vision
        run: gradle :app:assembleDebug :app:assembleRelease :app:lintDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          working-directory: android-vision
          script: bash tools/verify-emulator.sh
      - name: Package unsigned tested build
        if: success()
        working-directory: android-vision
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/OSMINOG-Vision-0.2.0-unsigned.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          git rev-parse HEAD > dist/source-commit.txt
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/apksigner.jar
          git -C .. archive --format=zip HEAD android-vision > dist/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OSMINOG-Vision-Android-0.2.0-verification
          path: |
            android-vision/dist/
            android-vision/app/build/reports/
            android-vision/app/build/outputs/androidTest-results/
          retention-days: 14
