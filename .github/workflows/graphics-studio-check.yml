name: Graphics Studio regression
on:
  pull_request:
    paths:
      - 'osminog-graphics-studio*'
      - 'osminog-desktop-v3*'
      - 'osminog-documents*'
      - 'editor.html'
      - 'editor.css'
      - 'bridge.js'
      - 'manifest.json'
      - 'OSMINOG_BUILD.json'
      - 'tools/build_3205.py'
      - 'tools/release-files-3205.json'
      - 'tests/graphics-3205.cjs'
      - 'tests/documents-3204.cjs'
      - '.github/workflows/graphics-studio-check.yml'
permissions:
  contents: read
jobs:
  graphics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Check syntax and retained routing behavior
        run: |
          node --check osminog-graphics-studio.js
          node --check osminog-desktop-v3.js
          node --check osminog-documents.js
          node --check bridge.js
          node tests/team-null-response-3203.cjs
          node tests/routing-3204.cjs
      - name: Check text, graphics, transparency and editable roundtrip
        run: node tests/graphics-3205.cjs
      - name: Check retained document editing
        run: node tests/documents-3204.cjs
      - name: Build and verify complete Chrome package
        run: python3 tools/build_3205.py --output-dir artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphics-verification
          path: artifacts/
