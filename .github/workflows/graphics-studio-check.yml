name: Workdesk and retained document regression
on:
  pull_request:
    paths:
      - 'osminog-graphics-studio*'
      - 'osminog-desktop-v3*'
      - 'osminog-documents*'
      - 'editor.html'
      - 'editor.css'
      - 'bridge.js'
      - 'manifest.json'
      - 'OSMINOG_BUILD.json'
      - 'tools/build_3206.py'
      - 'tools/release-files-3206.json'
      - 'tests/graphics-3205.cjs'
      - 'tests/documents-3204.cjs'
      - '.github/workflows/graphics-studio-check.yml'
permissions:
  contents: read
jobs:
  graphics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Check syntax and retained routing behavior
        run: |
          node --check osminog-graphics-studio.js
          node --check osminog-animation-studio.js
          node tests/animation-3206.cjs
          node --check osminog-desktop-v3.js
          node --check osminog-documents.js
          node --check bridge.js
          node tests/team-null-response-3203.cjs
          node tests/routing-3204.cjs
      - name: Check local memory, assets and manual HTML export
        run: |
          node tests/foundation-memory.cjs
          node tests/foundation-assets.cjs
          node tests/foundation-context.cjs
          node tests/foundation-browser.cjs
      - name: Check workdesk, retained assets and internet image import
        run: node tests/workdesk-3230.cjs
      - name: Check retained document editing
        run: node tests/documents-3204.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphics-verification
          path: artifacts/


