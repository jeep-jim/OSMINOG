name: Retained material migration regression
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  graphics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install native IndexedDB browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Check byte-preserving migration, interrupted writes, trash and item persistence
        run: node tests/core-store-438.cjs
      - name: Check paged chat storage and permission boundaries
        run: node tests/core-chat-438.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retained-data-verification
          path: artifacts/*438*
          if-no-files-found: ignore
