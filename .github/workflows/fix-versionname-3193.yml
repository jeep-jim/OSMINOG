name: Fix OSMINOG 3.19.3 visible version
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-versionname-3193.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import json
          p='manifest.json'
          d=json.load(open(p,encoding='utf-8'))
          d['version']='3.19.3'
          d['version_name']='3.19.3'
          open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python -m json.tool manifest.json >/dev/null
      - run: |
          rm -f .github/workflows/fix-versionname-3193.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix OSMINOG 3.19.3 visible version [skip ci]'
          git push origin HEAD:main
