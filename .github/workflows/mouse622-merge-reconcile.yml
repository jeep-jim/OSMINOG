name: Reconcile authorized Mouse622 merge
on:
  push:
    branches: [maintenance/mouse622-merge-reconcile-20261118]
    paths: [.github/workflows/mouse622-merge-reconcile.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Complete the exact authorized merge through GitHub async API
        run: |
          python3 - <<'PY'
          import json,os,pathlib,re,time,urllib.request,urllib.error
          repo='jeep-jim/OSMINOG';head='a94317ce121de73a9a469b55af8eea900a35921d'
          previous='3a24f87904e21fed6b47585ac7c80fa380b2c0c6';integrated='71f943b469ac2678a407ca89f2fe69b6e30990c8'
          tree='d3f19f7601e622b0fb79197678981ca561afd4b0';report={'source':head,'priorIntegration':integrated}
          def api(path,method='GET',body=None):
            assert path.startswith('/repos/'+repo+'/')
            headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN'],'X-GitHub-Api-Version':'2026-03-10','User-Agent':'Mouse622-merge-reconcile'}
            data=None if body is None else json.dumps(body).encode()
            if data is not None:headers['Content-Type']='application/json'
            request=urllib.request.Request('https://api.github.com'+path,data=data,headers=headers,method=method)
            try:
              with urllib.request.urlopen(request,timeout=30) as response:code=response.status;raw=response.read(2*1024*1024)
            except urllib.error.HTTPError as error:code=error.code;raw=error.read(2*1024*1024)
            payload=json.loads(raw) if raw else None
            if code>=400:raise RuntimeError(json.dumps({'method':method,'path':path,'status':code,'response':payload}))
            return code,payload
          def get(path):return api('/repos/'+repo+'/'+path)[1]
          try:
            pr=get('pulls/157');report['before']={key:pr.get(key) for key in ['state','merged','merge_commit_sha','updated_at']}
            assert pr['head']['sha']==head and pr['base']['ref']=='main','PR identity changed'
            run=get('actions/runs/44204108935')
            assert (run['workflow_id'],run['head_sha'],run['status'],run['conclusion'])==(419668574,head,'completed','success'),'Exact native proof changed'
            if not pr.get('merged'):
              assert pr['state']=='open','PR is no longer open'
              main=get('git/ref/heads/main')['object']['sha'];assert main==integrated,'Main advanced; stop for review'
              commit=get('git/commits/'+main)
              assert commit['tree']['sha']==tree and [p['sha'] for p in commit['parents']]==[previous,head],'Observed integration changed'
              code,result=api('/repos/'+repo+'/pulls/157/merge-async','PUT',{'sha':head,'merge_method':'merge','merge_action':'default','bypass_rules':False})
              report['asyncInitial']={'http':code,'result':result};print(json.dumps(report['asyncInitial']))
              assert code in (200,202),'Async request not accepted'
              request_id=(result.get('details') or {}).get('uuid') or result.get('uuid')
              if result.get('status')=='pending':
                assert isinstance(request_id,str) and re.fullmatch('[0-9a-fA-F-]{36}',request_id),'Missing merge request UUID'
                for _ in range(24):
                  time.sleep(5);_,result=api('/repos/'+repo+'/pulls/157/merge-async/'+request_id)
                  if result.get('status')!='pending':break
              report['asyncFinal']=result;print(json.dumps({'asyncFinal':result}))
              assert result.get('status')=='merged','Async operation did not merge; no gate override'
            for _ in range(12):
              pr=get('pulls/157')
              if pr.get('merged'):break
              time.sleep(5)
            assert pr.get('merged') and pr['state']=='closed' and pr['head']['sha']==head,'PR merge record is still incomplete'
            assert api('/repos/'+repo+'/pulls/157/merge')[0]==204,'Merge check did not confirm'
            merged=pr['merge_commit_sha'];assert re.fullmatch('[0-9a-f]{40}',merged),'No merge SHA'
            commit=get('git/commits/'+merged);assert commit['tree']['sha']==tree,'Merged application tree changed'
            compare=get('compare/'+head+'...main');assert compare['behind_by']==0 and compare['merge_base_commit']['sha']==head,'Source is not included in main'
            report['after']={'state':pr['state'],'merged':pr['merged'],'mergeCommit':merged,'head':head,'tree':tree}
            print('MOUSE622_OFFICIAL_MERGE_RECORD_CONFIRMED',json.dumps(report['after']))
          finally:pathlib.Path('mouse622-merge-reconcile.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse622-merge-reconciliation
          path: mouse622-merge-reconcile.json
          if-no-files-found: error
          retention-days: 14
