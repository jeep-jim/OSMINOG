name: Build OSMINOG Dev Hub

on:
  workflow_dispatch:
  push:
    branches:
      - rebrand/osminog-devhub
    paths:
      - 'devhub/UpdaterHost/**'
      - 'devhub/installer/OsminogUpdater.iss'
      - '.github/workflows/build-osminog-updater.yml'

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: rebrand/osminog-devhub

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish native host
        shell: pwsh
        run: dotnet publish devhub/UpdaterHost/OsminogUpdaterHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false

      - name: Native host static tests
        shell: pwsh
        run: |
          $exe = 'devhub/UpdaterHost/bin/Release/net8.0/win-x64/publish/OsminogUpdaterHost.exe'
          if (!(Test-Path $exe)) { throw "Host executable was not built" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "Host version probe failed" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc 'devhub/installer/OsminogUpdater.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Hash installer
        shell: pwsh
        run: |
          $setup = 'devhub/installer/output/OSMINOG-Dev-Hub-Setup.exe'
          if (!(Test-Path $setup)) { throw "Installer was not produced" }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "SHA256=$hash"
          $hash | Set-Content 'devhub/installer/output/SHA256.txt' -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OSMINOG-Dev-Hub-Setup
          path: |
            devhub/installer/output/OSMINOG-Dev-Hub-Setup.exe
            devhub/installer/output/SHA256.txt
          if-no-files-found: error
          retention-days: 30
