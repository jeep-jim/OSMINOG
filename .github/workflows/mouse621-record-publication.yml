name: Record completed Mouse621 publication
on:
  push:
    branches: [docs/mouse621-publication-record]
    paths: [.github/workflows/mouse621-record-publication.yml]
permissions:
  contents: write
jobs:
  record:
    if: github.repository == 'jeep-jim/OSMINOG'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify completed public release and append documentation only
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(git rev-parse HEAD)
          python3 - <<'PY'
          import base64,json,pathlib,subprocess,hashlib
          repo='jeep-jim/OSMINOG-Releases'
          def api(p):return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/{p}'],text=True))
          run=api('actions/runs/44085604166')
          assert run['head_sha']=='2efecc83c5ca64d7493db9dabe4d7d68abd06d58'
          assert (run['status'],run['conclusion'])==('completed','success')
          release=api('releases/tags/quadro-macos-v6.0.21-arm64');assert release['id']==448622932 and not release['draft']
          raw=api('contents/channels/mouse/macos-arm64.json');channel=json.loads(base64.b64decode(raw['content']))
          assert channel['version']=='6.0.21' and channel['size']==128580065
          assert channel['digest']=='sha256:6d9f24603a4212c372638883375ea0ba6bef23c49b9e7de76eb8c08422eae506'
          asset=next(a for a in release['assets'] if a['name']=='Mouse-Browser-6.0.21-mac-arm64.dmg')
          assert (asset['size'],asset['digest'],asset['browser_download_url'])==(channel['size'],channel['digest'],channel['url'])
          artifacts=api('actions/runs/44085604166/artifacts')['artifacts']
          ev=next(a for a in artifacts if a['id']==14330310592)
          assert ev['digest']=='sha256:e7cb24275a21f16743dc4bcfa6055445e97b86194dbc665ad91a546af2bd76bc'
          p=pathlib.Path('MOUSE_BROWSER_ROADMAP.md');b=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='eadbcfb250e4428d845ed2c5bf3d3e3ed128667d','Concurrent roadmap change; reconcile instead of overwrite'
          old=b.decode();prefix='Текущий опубликованный Mac-выпуск: **6.0.20**. Канал обновлений проверен; установка поверх6.0.19 с сохранением профиля прошла.'
          assert old.count(prefix)==1
          heading='## 17 ноября 2026 — 6.0.21 опубликован: столы и компактная норка'
          assert heading not in old
          summary=f'''\n\n{heading}\n\nВыпуск448622932 опубликован{release['published_at']}; канал обратно прочитан и указывает6.0.21, blob `{raw['sha']}`. Весь release run44085604166/job134047251991 SUCCESS, включая повторную установленную проверку и полное скачивание настоящим обновлятором620. Предыдущие кандидатные записи сохранены как история.\n\nВошли все последовательные поручения: пять живых столов с начальным текущим desk-3, плавное переключение без перезагрузки, обычный плюс28×28сверху, компактная норка36×23CSSpx снизу по центру с5px свободного места в28px footer. Счётчики по числовым заголовкам сайтов, истекающие центральные сообщения, drag-превью и рамка, настоящий нативный перенос PNG в поддерживающую страницу, Т+ для всех страниц, подписи разделов, выбор/движение разметки/клавиши/undo/зелёная палитра, восстановленное инкогнито619 с новым заголовком. Основные круги,12px углы, мордочка Dock и данные620 сохранены.\n\nExact source `ecf39b1f4d9de5f1e3eb85fb8f2d86c52bab6848`, sourcePR156 merged `b5b41e6caf5ac38e7747eb7b78b284e30b81b016`.151 Node-проверка PASS. Native44081845571 attempt2/job134039209108 и все сопутствующие проверки SUCCESS. Начальные queued-задания без runner перезапущены без изменения проверок. Исправлены пропуск кадров после долгого layout и перехват кликов страницей за пределами видимого clip. Панели используют modal-механизм и временные ограниченные RAM-превью без архива/сети. Диагностика удалена из конечного дерева.\n\nReleasePR40 merged `2efecc83c5ca64d7493db9dabe4d7d68abd06d58`. DMG128580065байт SHA256 `6d9f24603a4212c372638883375ea0ba6bef23c49b9e7de76eb8c08422eae506`; ZIP128581349байт SHA256 `3ca9a1497c494497e11eee394905b142159e5840bffd1af00fdf4cfb17acd493`. Candidate14327709342, native14328218262 и release14330310592 независимо скачаны и хэшированы. Реальный модуль620 анонимно обнаружил621, полностью скачал пакет и проверил SHA; у621 корректное current-состояние. Установка620→621 с сохранением профиля прошла.\n\nПовторные публикационные снимки панели столов в обеих темах просмотрены: диалог виден, пять карточек и бейдж расположены корректно. Ранний светлый capture без диалога не использован как финальная визуальная приёмка. Полные доказательства и ограничения: `docs/desktop/2026-11-17-mouse621-publication.md`. Это столы одного приложения, не отдельные процессы/аккаунты; не обещать уведомления любого сайта или приём файла любым чатом. Профиль не удалять. macOS Apple Silicon preview/ad-hoc без нотариализации. АвтоЦена, DNS, доступы и другие продукты не менялись.\n'''
          p.write_text(old.replace(prefix,'Текущий опубликованный Mac-выпуск: **6.0.21**. Канал обновлений проверен; установка поверх6.0.20 с сохранением профиля прошла.')+summary)
          doc=pathlib.Path('docs/desktop/2026-11-17-mouse621-publication.md');text=doc.read_text()
          assert text.startswith('# Mouse Browser 6.0.21 — выпуск выполняется\n')
          text=text.replace('# Mouse Browser 6.0.21 — выпуск выполняется','# Mouse Browser 6.0.21 — опубликовано',1)
          parts=text.split('\n\n',2)
          parts[1]=f"17 ноября 2026. Выпуск448622932 опубликован{release['published_at']}; канал обратно прочитан и указывает6.0.21, blob `{raw['sha']}`. Весь run44085604166/job134047251991 завершился SUCCESS, включая повторную установку и полное скачивание настоящим обновлятором620. Прежняя промежуточная запись о выполняющейся публикации больше не описывает итог."
          text='\n\n'.join(parts)
          text+='\n\n## Завершение и обратная проверка\n\n'+summary.split('\n\n',2)[2]
          text+='\nRelease evidence14330310592 независимо скачан и проверен: SHA256 `e7cb24275a21f16743dc4bcfa6055445e97b86194dbc665ad91a546af2bd76bc`. Прочитаны RELEASE_RESULT.json, CHANNEL_RESULT.json, channel-verification.json и журналы. anonymousDiscovery=true, verifiedDownload=true, oldValidatedBadgeState=true, currentVersionCheck=true; новые621-маркеры и настоящее обновление620→621 подтверждены повторно.\n\nУстановщик: '+channel['url']+'\nВыпуск: '+release['html_url']+'\n'
          doc.write_text(text)
          print('MOUSE621_PUBLICATION_DOCUMENTATION_VERIFIED',release['id'],release['published_at'],raw['sha'])
          PY
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = 'MOUSE_BROWSER_ROADMAP.md docs/desktop/2026-11-17-mouse621-publication.md '
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- MOUSE_BROWSER_ROADMAP.md docs/desktop/2026-11-17-mouse621-publication.md
          git commit -m 'Record published Mouse621 and verified620 upgrade while preserving complete roadmap history'
          git push origin HEAD:refs/heads/main
          git show --stat --oneline HEAD
