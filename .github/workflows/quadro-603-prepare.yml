name: Apply reviewed Quadro 603 source edits
on:
  push:
    branches: [codex/quadro-603-browser-basics]
    paths: ['tools/quadro603_prepare.py','.github/workflows/quadro-603-prepare.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply exact guarded source edits (no workflow writes)
        run: |
          python3 tools/quadro603_prepare.py
          rm tools/quadro603_prepare.py
          python3 - <<'PY'
          import subprocess
          allowed=('desktop/quadro','tools/quadro-verify.py','tools/quadro603_prepare.py','OSMINOG_BROWSER_ROADMAP.md')
          changed=subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          assert all(p.startswith(allowed) for p in changed),changed
          PY
          (cd desktop && node --test quadro.test.cjs quadro-lifecycle.test.cjs quadro-capture.test.cjs quadro-library.test.cjs)
          git add desktop/quadro* tools/quadro-verify.py tools/quadro603_prepare.py OSMINOG_BROWSER_ROADMAP.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply Quadro 6.0.3 browser library and owner-requested controls fixes'
          git push origin HEAD:codex/quadro-603-browser-basics
