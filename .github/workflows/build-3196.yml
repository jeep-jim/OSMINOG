name: OSMINOG 3.19.6 cinematic core hero

on:
  push:
    branches: [main]
    paths:
      - 'staging/3.19.6/ACTIVATE'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 3.19.6 source changes
        run: python scripts/build_3196.py

      - name: Verify exact hero and source
        shell: bash
        run: |
          set -euxo pipefail
          test -f assets/core/core-hero-3196.webp
          test "$(stat -c%s assets/core/core-hero-3196.webp)" = "1459142"
          test "$(sha256sum assets/core/core-hero-3196.webp | cut -d' ' -f1)" = "2dcc954ecb598b067f017c0fca556e38f45cbecaad29595019fc6b0943aaff68"
          grep -q 'core-hero-composite-back' editor.html
          grep -q 'core-hero-composite-front' editor.html
          grep -q 'OSMINOG 3.19.6 · CINEMATIC CORE HERO' editor.css
          grep -q 'right:14px!important;left:auto!important' editor.css
          grep -q 'clip-path:inset(0 64% 0 0)' editor.css
          node --check editor.js
          python -m json.tool manifest.json >/dev/null
          python -m json.tool OSMINOG_BUILD.json >/dev/null
          test "$(python -c 'import json;print(json.load(open("manifest.json"))["version"])')" = "3.19.6"
          test "$(python -c 'import json;print(json.load(open("manifest.json"))["version_name"])')" = "3.19.6"
          python - <<'PY'
          import json
          m=json.load(open('manifest.json',encoding='utf-8'))
          assert m.get('key'), 'fixed extension key missing'
          print('FIXED_KEY_OK', len(m['key']))
          PY
          echo SOURCE_3196_OK

      - name: Commit 3.19.6 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf staging/3.19.6
          rm -f .github/workflows/build-3196.yml scripts/build_3196.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'OSMINOG 3.19.6 cinematic core hero [skip ci]'
          git push origin HEAD:main
