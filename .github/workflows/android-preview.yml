name: Android mobile preview
on:
  push:
    branches: ['feat/android-mobile-preview']
    paths: ['android/**', '.github/workflows/android-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and lint
        working-directory: android
        run: gradle :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          working-directory: android
          script: |
            gradle :app:connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.osminog.mobile.preview/com.osminog.mobile.MainActivity
            sleep 3
            adb shell screencap -p /sdcard/osminog-phone.png
            mkdir -p dist
            adb pull /sdcard/osminog-phone.png dist/osminog-phone.png
            adb logcat -d > dist/android-logcat.txt
      - name: Package preview
        run: |
          mkdir -p android/dist
          cp android/app/build/outputs/apk/debug/app-debug.apk android/dist/OSMINOG-Android-0.1.0-preview.apk
          sha256sum android/dist/*.apk > android/dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-mobile-preview
          path: |
            android/dist/*
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
