name: Build OSMINOG 3.15.0 interactive capability runtime

on:
  push:
    branches:
      - repair/capability-runtime-3.15.0
    paths:
      - '.github/workflows/build-3150.yml'
      - 'tools/fix_upgrade_3150.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply capability runtime upgrade
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/fix_upgrade_3150.py
          python3 tools/upgrade_interactive_runtime_3150.py

      - name: Validate source contracts
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, hashlib
          m=json.load(open('manifest.json',encoding='utf-8'))
          assert m['version']=='3.15.0'
          assert m.get('version_name')=='3.15.0'
          assert hashlib.sha256(m['key'].encode()).hexdigest()=='1ddb8d87f3a6f6cb38a229bd81ba8076d1d37d3ba6b8a15b2a91129d4904012e'
          PY
          for f in background.js bridge.js gpt-presence.js editor.js osminog-access-center.js osminog-module-runtime.js osminog-graphics-studio.js osminog-extension-studio.js osminog-desktop-v3.js; do node --check "$f"; done
          git diff --check
          grep -F 'directAppKind' gpt-presence.js
          grep -F 'календар|студи' gpt-presence.js
          grep -F 'toolLease:{protocol:"osminog.tool_lease/v1",fresh:true,tools:leasedTools' gpt-presence.js
          grep -F 'ownerOnlyTools=new Set' gpt-presence.js
          grep -F 'graphics_create' bridge.js
          grep -F 'assets.read' osminog-module-runtime.js
          grep -F 'createFromSpec' osminog-graphics-studio.js
          grep -F 'bc-workbench-media' editor.js
          grep -F 'Poseidon · только владелец' osminog-access-center.js
          grep -F 'OSMINOG Interactive Workspace Access' background.js
          ! grep -F 'undoLastChange' bridge.js

      - name: Commit upgraded source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json OSMINOG_BUILD.json bridge.js osminog-module-runtime.js osminog-graphics-studio.js editor.js editor.css osminog-access-center.js gpt-presence.js background.js RELEASE_NOTES_3.15.0.md OSMINOG_PROJECT_LOG.md OSMINOG_ROADMAP.md
          git commit -m 'Release interactive capability runtime 3.15.0 [skip ci]'
          git push origin HEAD:repair/capability-runtime-3.15.0

      - name: Build verified Chrome package
        shell: bash
        run: |
          set -euxo pipefail
          ARTIFACT='OSMINOG-Chrome-3.15.0-INTERACTIVE-CAPABILITY-RUNTIME.zip'
          rm -rf dist
          mkdir -p dist/package
          rsync -a ./ dist/package/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='dist/' \
            --exclude='tools/' \
            --exclude='docs/' \
            --exclude='project-log-archive/' \
            --exclude='OSMINOG_PROJECT_LOG.md' \
            --exclude='OSMINOG_ROADMAP.md' \
            --exclude='RELEASE_NOTES_*.md'
          python3 - <<'PY'
          import json, pathlib, hashlib
          m=json.load(open('dist/package/manifest.json',encoding='utf-8'))
          assert m['version']=='3.15.0'
          assert hashlib.sha256(m['key'].encode()).hexdigest()=='1ddb8d87f3a6f6cb38a229bd81ba8076d1d37d3ba6b8a15b2a91129d4904012e'
          for f in ['gpt-presence.js','bridge.js','osminog-module-runtime.js','osminog-graphics-studio.js','editor.js']:
              assert pathlib.Path('dist/package',f).is_file()
          PY
          (cd dist/package && zip -qr ../"$ARTIFACT" .)
          unzip -t "dist/$ARTIFACT"
          SHA=$(sha256sum "dist/$ARTIFACT" | awk '{print $1}')
          ZIP_BYTES=$(stat -c%s "dist/$ARTIFACT")
          FILES=$(find dist/package -type f | wc -l | tr -d ' ')
          printf '%s  %s\n' "$SHA" "$ARTIFACT" > dist/SHA256.txt
          {
            echo 'OSMINOG 3.15.0 INTERACTIVE CAPABILITY RUNTIME'
            echo "source_commit=$(git rev-parse HEAD)"
            echo "package=$ARTIFACT"
            echo "sha256=$SHA"
            echo "zip_bytes=$ZIP_BYTES"
            echo "package_files=$FILES"
            echo 'node_checks=passed'
            echo 'manifest_version=3.15.0'
            echo 'fixed_identity=passed'
          } > dist/BUILD_REPORT.txt
          cp RELEASE_NOTES_3.15.0.md dist/
          cat dist/BUILD_REPORT.txt

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: OSMINOG-3.15.0-INTERACTIVE-CAPABILITY-RUNTIME
          path: |
            dist/OSMINOG-Chrome-3.15.0-INTERACTIVE-CAPABILITY-RUNTIME.zip
            dist/SHA256.txt
            dist/BUILD_REPORT.txt
            dist/RELEASE_NOTES_3.15.0.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
