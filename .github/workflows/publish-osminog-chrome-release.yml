name: Publish OSMINOG Chrome release

on:
  push:
    branches: [main]
    paths:
      - 'platforms/02-chrome-extension/releases/**/PUBLISH-READY'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osminog-chrome-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish latest Chrome release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          marker=$(find platforms/02-chrome-extension/releases -mindepth 2 -maxdepth 2 -type f -name PUBLISH-READY | sort -V | tail -n 1)
          test -n "$marker"
          release_dir=$(dirname "$marker")
          meta="$release_dir/release.json"
          test -f "$meta"

          version=$(jq -r '.version' "$meta")
          package=$(jq -r '.package' "$meta")
          expected_size=$(jq -r '.size' "$meta")
          expected_sha=$(jq -r '.sha256' "$meta")
          source_api=$(jq -r '.bootstrap.sourceApi // empty' "$meta")
          notes=$(jq -r '.notes // "OSMINOG Chrome development release."' "$meta")
          zip="$release_dir/$package"
          tag="chrome-v$version"
          title="OSMINOG Chrome $version"

          release_notes=$(printf '%s\n\nPackage: `%s`\nSHA-256: `%s`\nSize: `%s` bytes' "$notes" "$package" "$expected_sha" "$expected_size")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --target main --title "$title" --prerelease --notes "$release_notes"
          else
            gh release create "$tag" --target main --title "$title" --prerelease --notes "$release_notes"
          fi

          if [ ! -f "$zip" ] && [ -n "$source_api" ]; then
            tmp_b64=$(mktemp)
            if curl -fsSL "$source_api" | jq -r '.[].download_url' | sort | while IFS= read -r url; do curl -fsSL "$url"; done > "$tmp_b64" \
              && base64 --decode "$tmp_b64" > "$zip" 2>/dev/null; then
              rm -f "$tmp_b64"
            else
              rm -f "$tmp_b64" "$zip"
              echo "::warning::Release entry created; package bootstrap is not complete yet."
              exit 0
            fi
          fi

          if [ ! -f "$zip" ]; then
            echo "::warning::Release entry created; package file is not present yet."
            exit 0
          fi

          actual_size=$(stat -c%s "$zip")
          actual_sha=$(sha256sum "$zip" | awk '{print $1}')
          test "$actual_size" = "$expected_size"
          test "$actual_sha" = "$expected_sha"

          python - "$zip" "$version" <<'PY'
          import json, sys, zipfile
          path, expected = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(path) as z:
              if 'manifest.json' not in z.namelist():
                  raise SystemExit('root manifest.json missing')
              manifest = json.loads(z.read('manifest.json'))
              if manifest.get('version') != expected:
                  raise SystemExit(f"manifest version {manifest.get('version')} != {expected}")
              if manifest.get('name') != 'OSMINOG':
                  raise SystemExit('manifest product name is not OSMINOG')
              if not manifest.get('key'):
                  raise SystemExit('fixed manifest key missing')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$zip"
          if ! git diff --cached --quiet; then
            git commit -m "Archive OSMINOG Chrome $version package"
            git push
          fi

          gh release upload "$tag" "$zip" --clobber
          echo "Published $title with verified package asset."
          echo "SHA-256: $actual_sha"
