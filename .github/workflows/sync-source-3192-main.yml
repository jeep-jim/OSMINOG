name: Sync OSMINOG 3.19.2 source from verified release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-source-3192-main.yml'

permissions:
  contents: write

env:
  VERSION: '3.19.2'
  PACKAGE_URL: 'https://github.com/jeep-jim/OSMINOG-Releases/releases/download/chrome-v3.19.2/OSMINOG-Chrome-3.19.2-GRAPHICS-STUDIO-UX-CANVAS-FIX.zip'
  EXPECTED_SHA: '779f4f0c35f137553a72fc7ace8e3b6fc34eb1e23150206407eb95d3f6ea6ea2'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/graphics-studio-3.19.2
          fetch-depth: 0

      - name: Download and verify public release
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/osminog-3192.zip "$PACKAGE_URL"
          echo "$EXPECTED_SHA  /tmp/osminog-3192.zip" | sha256sum -c -
          mkdir -p /tmp/pkg
          unzip -q /tmp/osminog-3192.zip -d /tmp/pkg
          test "$(python -c 'import json;print(json.load(open("/tmp/pkg/manifest.json"))["version"])')" = "$VERSION"

      - name: Synchronize changed source files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            OSMINOG_BUILD.json
            OSMINOG_ROADMAP_3.18.2_EXECUTION_CORE.md
            OSMINOG_ROADMAP_3.19.0_CORE_RESET.md
            OSMINOG_ROADMAP_3.19.1_GRAPHICS_STUDIO_V2.md
            OSMINOG_ROADMAP_3.19.2_GRAPHICS_STUDIO_UX.md
            THIRD_PARTY_NOTICES.md
            background.js
            bridge.js
            editor.css
            editor.html
            editor.js
            gpt-presence.js
            manifest.json
            osminog-browser-app.js
            osminog-desktop-v3.css
            osminog-desktop-v3.js
            osminog-graphics-studio.js
            popup.html
            popup.js
          )
          for f in "${files[@]}"; do
            test -f "/tmp/pkg/$f"
            cp "/tmp/pkg/$f" "$f"
          done
          rm -f .github/workflows/sync-source-3192.yml
          for f in background.js bridge.js editor.js gpt-presence.js osminog-browser-app.js osminog-desktop-v3.js osminog-graphics-studio.js popup.js; do
            node --check "$f"
          done
          python -m json.tool manifest.json >/dev/null
          python -m json.tool OSMINOG_BUILD.json >/dev/null

      - name: Commit synchronized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Sync OSMINOG 3.19.2 Graphics Studio UX source [skip ci]'
          git push origin HEAD:rebuild/graphics-studio-3.19.2
