name: Mouse 614 source preparation
on:
  push:
    branches: [codex/mouse614-ai-focus-brand]
    paths: [.github/workflows/mouse614-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cee158951e6febc480b99f12da3854cdb2a3eb18
      - run: git archive --format=tar.gz -o "$RUNNER_TEMP/mouse614-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: mouse614-source
          path: ${{ runner.temp }}/mouse614-source.tar.gz
          retention-days: 3
