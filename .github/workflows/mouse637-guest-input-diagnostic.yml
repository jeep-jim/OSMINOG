name: Mouse637 isolated guest input diagnostic
on:
  push:
    branches: ['diagnostic/mouse637-guest-input-20261122']
permissions:
  contents: read
jobs:
  input-diagnostic:
    runs-on: macos-15
    # Diagnostic only: original baseline and one retained636 native scene.
    # Existing scenario, process and exit deadlines remain unchanged.
    timeout-minutes: 55
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: test "$(uname -m)" = arm64
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high --json > mouse-audit.json
      - name: Prepare pinned Agent Mouse runtime
        run: |
          npm ci --prefix mouse-agent
          npm audit --prefix mouse-agent --omit=dev --audit-level=high --json > mouse-agent-audit.json
          node mouse-agent/prepare.cjs
          node mouse-native-build.cjs --mcp-only
      - run: npm test
      - name: Retained and new Mouse unit contracts
        run: |
          node ../tools/mouse-unit-tests.cjs
          node --test ../tools/mouse-637-update-button.test.cjs
          python3 -m unittest discover -s ../tools -p test_mouse_631_acceptance.py -v
          python3 ../tools/test_mouse637_upgrade.py
          python3 ../tools/test_mouse637_baseline_performance.py
          python3 ../tools/test_mouse637_update_button.py
          python3 ../tools/test_mouse637_update_window.py
          python3 ../tools/test_mouse636_upgrade.py -v
          python3 ../tools/test_mouse636_baseline_performance.py -v
      - run: npm run prepare:runtime
      - run: node mouse-native-build.cjs
      - run: node mouse-icon.cjs
      - name: Verify owner-supplied mouse source and both app themes
        run: node --test mouse-606.test.cjs mouse-private.test.cjs mouse-607.test.cjs mouse-608.test.cjs mouse-609.test.cjs mouse-611.test.cjs mouse-612.test.cjs mouse-613.test.cjs mouse-614.test.cjs mouse-615.test.cjs mouse-616.test.cjs mouse-617.test.cjs mouse-emoji.test.cjs mouse-tab-flow.test.cjs mouse-620.test.cjs mouse-capture-archive.test.cjs mouse-history.test.cjs mouse-desktops.test.cjs mouse-621.test.cjs mouse-agent.test.cjs mouse-agent-brand.test.cjs mouse-desktop-previews.test.cjs mouse-desktop-history.test.cjs mouse-progress.test.cjs mouse-progress-bridge.test.cjs mouse-progress-pane.test.cjs mouse-download-activity.test.cjs mouse-activity-feedback.test.cjs mouse-feedback-fixture.test.cjs mouse-page-activity.test.cjs mouse-scrollbars.test.cjs mouse-agent/mcp-files.test.cjs mouse-agent/mcp-manager.test.cjs mouse-agent/mcp-host.test.cjs mouse-local-ui.test.cjs mouse-layout-actions.test.cjs mouse-library-view.test.cjs mouse-documents.test.cjs mouse-document-tabs.test.cjs mouse-document-zip.test.cjs mouse-document-word.test.cjs mouse-search.test.cjs mouse-document-formulas.test.cjs mouse-document-sheet.test.cjs mouse-document-pdf.test.cjs mouse-document-pdf-text.test.cjs mouse-smoke-hit-target.test.cjs mouse-surfaces.test.cjs mouse-smoke-exit.test.cjs mouse-smoke-frames.test.cjs mouse-smoke-reversal.test.cjs mouse-smoke-trace.test.cjs mouse-floating-overlay.test.cjs mouse-desktop-slide.test.cjs mouse-gesture.test.cjs
      - name: Restore Electron and builder download cache
        id: mouse-builder-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/mouse-electron-cache
            ${{ runner.temp }}/mouse-builder-cache
          key: mouse-macos-arm64-downloads-v1-${{ hashFiles('desktop/package-lock.json') }}
      - name: Build native Mouse DMG and ZIP
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/mouse-electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/mouse-builder-cache
        run: npx electron-builder --config mouse-build.cjs --mac dmg zip --arm64 --publish never
      - name: Save Electron and builder download cache
        if: steps.mouse-builder-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/mouse-electron-cache
            ${{ runner.temp }}/mouse-builder-cache
          key: ${{ steps.mouse-builder-cache.outputs.cache-primary-key }}
      - name: Observe one unchanged retained native scene after its original baseline
        env:
          MOUSE_GUEST_INPUT_DIAGNOSTICS: '1'
        shell: bash
        run: |
          set -euo pipefail
          xcrun swift ../tools/mouse-637-macos-display.swift --output mouse-637-display.json
          xcrun swift ../tools/mouse-637-macos-display.swift --verify mouse-637-display.json
          DIAG_APP="dist-mouse/mac-arm64/Mouse Browser.app"
          test "$(lipo -archs "$DIAG_APP/Contents/MacOS/Mouse Browser")" = arm64
          codesign --verify --deep --strict "$DIAG_APP"
          DIAG_INSTALL="$RUNNER_TEMP/Проверка Mouse/Mouse Browser.app"
          mkdir -p "$(dirname "$DIAG_INSTALL")"
          ditto "$DIAG_APP" "$DIAG_INSTALL"
          python3 - "$DIAG_INSTALL/Contents/MacOS/Mouse Browser" <<'PYDIAG'
          import hashlib,json,pathlib,subprocess,sys
          original=pathlib.Path('../tools/mouse-verify.py')
          code=original.read_text(encoding='utf-8')
          boundary='\nowner_env='
          assert code.count(boundary)==1
          prefix=code.split(boundary,1)[0]+'\n'
          assert prefix.count("'--mouse-636-retained-smoke'")==1
          assert "'--mouse-637-features-smoke'" not in prefix
          diagnostic=original.with_name('mouse637-isolated-guest-input-run.py')
          diagnostic.write_text(prefix,encoding='utf-8')
          pathlib.Path('mouse-637-guest-input-diagnostic-provenance.json').write_text(json.dumps({
              'purpose':'One original retained native scene with passive input recording; not release acceptance',
              'source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'baseSource':'5a13d620e66e8b25792b3ba26de907c6b66fc422',
              'verifierSHA256':hashlib.sha256(original.read_bytes()).hexdigest(),
              'prefixSHA256':hashlib.sha256(prefix.encode()).hexdigest(),
              'baselineRetained':True,'originalProcessTimeoutSeconds':270,
              'nativeInputModified':False,'workloadModified':False,
              'publicationAcceptance':False},indent=2)+'\n',encoding='utf-8')
          result=subprocess.run([sys.executable,str(diagnostic),sys.argv[1]],check=False)
          raise SystemExit(result.returncode)
          PYDIAG
      - name: Preserve original diagnostic records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mouse637-guest-input-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            desktop/mouse-*.log
            desktop/mouse-*.json
            desktop/mouse-*.png
            desktop/mouse-637-baseline-performance/**
          retention-days: 14
          if-no-files-found: error
