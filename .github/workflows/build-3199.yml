name: OSMINOG 3.19.9 language canvas provider fixes

on:
  push:
    branches: [main]
    paths:
      - 'staging/3.19.9/ACTIVATE'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 3.19.9 source changes
        run: python scripts/build_3199.py

      - name: Verify source
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'OSMINOG 3.19.9 · LOCALIZED DOCKED HERO' editor.css
          grep -q 'ru:\["Соберите проект","вместе с командой ИИ"\]' editor.js
          grep -q 'dataset.providerOpen' editor.js
          grep -q 'grok:"https://grok.com/"' editor.js
          grep -q 'OSMINOGBrowserHubAPI.open' editor.js
          ! grep -q 'btn.dataset.provider,url=' editor.js
          grep -q 'OSMINOG 3.19.9 · LIGHT HOVER + LIVE CANVAS COLORS' osminog-product-core-recovery.css
          grep -q 'background-color:var(--board-bg)!important' osminog-product-core-recovery.css
          grep -q 'var(--grid-color)' osminog-product-core-recovery.css
          node --check editor.js
          python -m json.tool manifest.json >/dev/null
          python -m json.tool OSMINOG_BUILD.json >/dev/null
          test "$(python -c 'import json;print(json.load(open("manifest.json"))["version"])')" = '3.19.9'
          test "$(python -c 'import json;print(json.load(open("manifest.json"))["version_name"])')" = '3.19.9'
          python - <<'PY'
          import hashlib,json
          m=json.load(open('manifest.json',encoding='utf-8'))
          key=m.get('key') or ''
          assert key
          assert hashlib.sha256(key.encode()).hexdigest() == '1ddb8d87f3a6f6cb38a229bd81ba8076d1d37d3ba6b8a15b2a91129d4904012e'
          print('FIXED_IDENTITY_OK')
          PY
          echo SOURCE_3199_OK

      - name: Commit 3.19.9 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf staging/3.19.9
          rm -f .github/workflows/build-3199.yml scripts/build_3199.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'OSMINOG 3.19.9 language canvas provider fixes [skip ci]'
          git push origin HEAD:main
