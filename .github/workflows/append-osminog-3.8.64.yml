}
EOF
          cat > versions/3.8.64/README.md <<'EOF'
# OSMINOG Chrome 3.8.64

Base: 3.8.63.

This is the manual development package after the legacy Native Messaging updater failed repeatedly. It restores the Google AI Mode tab bridge, sends each request once, removes the search-engine selector, adds a theme-aware resizable Google AI module with eight connection ports, preserves DeepSeek, and preserves Ctrl+V clipboard/cached-screenshot attachments.

Artifact SHA-256: `9affbc367e3fae15a701ef3de56ac663dd75eed91270909574d3cabfe11eea4c`.

Runtime verification is pending on the owner's Windows/Chrome/Google account.
EOF
      - name: Commit record and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/append-osminog-3.8.64.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OSMINOG_PROJECT_LOG.md versions/3.8.64
          git commit -m 'Record OSMINOG Chrome 3.8.64'
          git push origin HEAD:main
