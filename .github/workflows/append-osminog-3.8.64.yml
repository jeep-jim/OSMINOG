name: Record OSMINOG 3.8.64

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-osminog-3.8.64.yml'

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append canonical log and version metadata
        env:
          APPEND_B64: 
          BUILD_B64: 
          README_B64: 
        run: |
          set -euo pipefail
          python -c "import os,base64,pathlib; p=pathlib.Path('OSMINOG_PROJECT_LOG.md'); a=base64.b64decode(os.environ['APPEND_B64']); d=p.read_bytes(); p.write_bytes(d if b'3.8.64 Google AI Mode recovery and module links' in d else d+b'\n'+a); pathlib.Path('versions/3.8.64').mkdir(parents=True,exist_ok=True); pathlib.Path('versions/3.8.64/build.json').write_bytes(base64.b64decode(os.environ['BUILD_B64'])); pathlib.Path('versions/3.8.64/README.md').write_bytes(base64.b64decode(os.environ['README_B64']))"
      - name: Commit record and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/append-osminog-3.8.64.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OSMINOG_PROJECT_LOG.md versions/3.8.64
          git commit -m 'Record OSMINOG Chrome 3.8.64'
          git push origin HEAD:main
