name: Build OSMINOG 3.18.1 Poseidon source executor recovery

on:
  push:
    branches: [repair/poseidon-source-executor-3.18.1]
    paths:
      - '.github/workflows/build-3181-poseidon-source-executor.yml'

permissions:
  contents: write

env:
  VERSION: '3.18.1'
  PACKAGE: 'OSMINOG-Chrome-3.18.1-POSEIDON-SOURCE-EXECUTOR-RECOVERY.zip'
  PATCH_SHA: '790c3c21f0daa18daa26d90075291f62968d3625175796539fa6ea68ad88cb3e'
  B64_SHA: 'f5f5f6506cc5ca6a03eebdfcc38c7a8a292ae48bc25a8c06d32a3116f2dfc551'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat tools/3181/part.00 tools/3181/part.01 > /tmp/patch.xz.b64
          echo "$B64_SHA  /tmp/patch.xz.b64" | sha256sum -c -
          base64 -d /tmp/patch.xz.b64 | xz -d > /tmp/3181.patch
          echo "$PATCH_SHA  /tmp/3181.patch" | sha256sum -c -
          patch -p1 < /tmp/3181.patch

      - name: Validate source executor contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check gpt-presence.js
          python -m json.tool manifest.json >/dev/null
          python -m json.tool OSMINOG_BUILD.json >/dev/null
          test "$(python -c 'import json;print(json.load(open("manifest.json"))["version"])')" = "$VERSION"
          grep -F 'const SOURCE_MUTATION_TOOLS=' gpt-presence.js >/dev/null
          grep -F '[OWNER SOURCE CONTRACT:' gpt-presence.js >/dev/null
          grep -F 'async function retryTaskSource' gpt-presence.js >/dev/null
          grep -F 'document.addEventListener("osminog:owner-unlocked"' gpt-presence.js >/dev/null
          grep -F 'провайдер не выполнил обязательную source-операцию' gpt-presence.js >/dev/null

      - name: Commit synchronized source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/3181 .github/workflows/build-3181-poseidon-source-executor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair Poseidon source executor in 3.18.1 [skip ci]'
          git push origin HEAD:repair/poseidon-source-executor-3.18.1

      - name: Build from verified 3.18.0 package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pkg
          curl -fL --retry 3 -o /tmp/base.zip 'https://github.com/jeep-jim/OSMINOG-Releases/releases/download/chrome-v3.18.0/OSMINOG-Chrome-3.18.0-PRODUCT-CORE-RECOVERY.zip'
          unzip -q /tmp/base.zip -d /tmp/pkg
          cp gpt-presence.js manifest.json OSMINOG_BUILD.json /tmp/pkg/
          old_key="$(python - <<'PY'
import json,zipfile
z=zipfile.ZipFile('/tmp/base.zip')
print(json.loads(z.read('manifest.json'))['key'])
PY
)"
          new_key="$(python -c 'import json;print(json.load(open("manifest.json"))["key"])')"
          test "$old_key" = "$new_key"
          (cd /tmp/pkg && zip -qr "$GITHUB_WORKSPACE/$PACKAGE" .)
          unzip -t "$PACKAGE" >/dev/null
          sha256sum "$PACKAGE"
          stat -c '%s bytes' "$PACKAGE"

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: OSMINOG-3.18.1-POSEIDON-SOURCE-EXECUTOR-RECOVERY
          path: OSMINOG-Chrome-3.18.1-POSEIDON-SOURCE-EXECUTOR-RECOVERY.zip
          if-no-files-found: error
          retention-days: 14
