name: Finalize OSMINOG 3.9.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-osminog-3.9.0.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append project log and write 3.9.0 metadata
        env:
          APPEND_B64: 
          BUILD_B64: 
          README_B64: 
        run: |
          set -euo pipefail
          python -c "import os,base64,pathlib; p=pathlib.Path('OSMINOG_PROJECT_LOG.md'); d=p.read_bytes(); a=base64.b64decode(os.environ['APPEND_B64']); p.write_bytes(d if b'OSMINOG 3.9.0 TEAM OS' in d else d+b'\n'+a); q=pathlib.Path('versions/3.9.0'); q.mkdir(parents=True,exist_ok=True); (q/'build.json').write_bytes(base64.b64decode(os.environ['BUILD_B64'])); (q/'README.md').write_bytes(base64.b64decode(os.environ['README_B64']))"
      - name: Commit record and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/finalize-osminog-3.9.0.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OSMINOG_PROJECT_LOG.md versions/3.9.0
          git commit -m 'Record OSMINOG Chrome 3.9.0 TEAM OS runtime baseline'
          git push origin HEAD:main
