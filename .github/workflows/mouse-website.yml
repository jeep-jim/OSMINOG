name: Mouse website — publish site and verified installers
on:
  push:
    branches: [main]
    paths: ['website/**', 'infra/website/**', '.github/workflows/mouse-website.yml']
  pull_request:
    paths: ['website/**', 'infra/website/**', '.github/workflows/mouse-website.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mouse-website-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify independent releases, immutable downloads and open-page refresh
        shell: bash
        run: |
          set -euo pipefail
          bash -n infra/website/deploy.sh
          bash -n infra/website/bootstrap.sh
          bash infra/website/deploy.sh --validate-downloads infra/website/downloads.json
          python3 -m unittest discover -s infra/website -p 'test_*.py' -v
          node --test infra/website/test-site-downloads.cjs infra/website/test-download-metrics.cjs infra/website/test-showcase-tabs.cjs
          python3 infra/website/build-site.py --output "$RUNNER_TEMP/mouse-website-validation"
          python3 infra/website/verify-seo.py "$RUNNER_TEMP/mouse-website-validation"
          python3 infra/website/make-sync-bundle.py --source "$GITHUB_SHA" --output "$RUNNER_TEMP/mouse-sync-validation.tar.gz"
  website:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: osminog-reg
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package the reviewed renderer and continuous release synchronizer
        run: python3 infra/website/make-sync-bundle.py --source "$GITHUB_SHA" --output "$RUNNER_TEMP/mouse-website-sync.tar.gz"
      - name: Publish with own user and observe an automatic release check
        id: publish
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OSMINOG_REG_SSH_KEY }}
          SSH_USER: ${{ vars.OSMINOG_REG_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "${SSH_USER:-osminog}" = osminog
          test -n "$SSH_PRIVATE_KEY"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          # A queued/rerun older website revision must not replace newer code.
          # Unrelated browser/documentation commits may advance main safely.
          git fetch --no-tags --depth=1 origin main
          if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- website infra/website .github/workflows/mouse-website.yml; then
            printf '%s\n' 'MOUSE_SOURCE_SUPERSEDED: publish the current website revision instead.' >&2
            exit 1
          fi
          key=$(mktemp); hosts=$(mktemp)
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          unset SSH_PRIVATE_KEY
          ssh-keygen -y -f "$key" >/dev/null
          printf '%s\n' '151.248.113.177 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAwiP6mOUcqHc5+Xvih7YY0Ikc7TyNsIoLoFTVx1JcSV' > "$hosts"
          ssh_args=(-i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -o ServerAliveInterval=15 -o ServerAliveCountMax=2)
          installer_sha=$(sha256sum infra/website/install-sync.py | cut -d ' ' -f 1)
          bundle_sha=$(sha256sum "$RUNNER_TEMP/mouse-website-sync.tar.gz" | cut -d ' ' -f 1)
          remote="/opt/osminog/website/install-sync-$GITHUB_SHA.py"
          ssh "${ssh_args[@]}" osminog@151.248.113.177 "set -e; umask 077; test \"\$(id -un)\" = osminog; test \"\$(id -u)\" -ne 0; test -d /opt/osminog/website; test ! -L /opt/osminog; test ! -L /opt/osminog/website; test ! -L '$remote'; temporary=\$(mktemp '/opt/osminog/website/.sync-installer-XXXXXXXX'); trap 'rm -f \"\$temporary\"' EXIT; cat > \"\$temporary\"; printf '%s  %s\\n' '$installer_sha' \"\$temporary\" | sha256sum --check --status; chmod 600 \"\$temporary\"; mv -T \"\$temporary\" '$remote'" < infra/website/install-sync.py
          timeout 1500 ssh "${ssh_args[@]}" osminog@151.248.113.177 "PYTHONDONTWRITEBYTECODE=1 python3 '$remote' --source '$GITHUB_SHA' --sha256 '$bundle_sha'" < "$RUNNER_TEMP/mouse-website-sync.tar.gz" | tee "$RUNNER_TEMP/mouse-website-sync.txt"
          grep -q '^MOUSE_RELEASE_TIMER_VERIFIED ' "$RUNNER_TEMP/mouse-website-sync.txt"
          grep -q '^MOUSE_WEBSITE_AUTOMATION_LIVE https://mouse.black$' "$RUNNER_TEMP/mouse-website-sync.txt"
          {
            printf '## Mouse website continuous releases\n\nRenderer source: `%s`\n\n' "$GITHUB_SHA"
            printf 'Own-user synchronization checks the official published macOS, Windows and Linux feeds independently, every 60 seconds after the previous check completes. New files must match published release metadata and their complete SHA256 before an atomic site switch.\n\n'
            printf 'Observed a real subsequent timer execution. No root, DNS, other-project credentials or browser-release workflow changes are involved.\n\n'
            printf '### Publication and automatic-check evidence\n\n```text\n'
            cat "$RUNNER_TEMP/mouse-website-sync.txt"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Independently verify the exact public website and all installers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, json, os, sys, urllib.request
          from pathlib import Path
          sys.path.insert(0, 'infra/website')
          from release_catalog import public_to_manifest
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          with opener.open('https://mouse.black/downloads.json', timeout=30) as response:
              assert response.status == 200
              assert 'no-cache' in response.headers.get('Cache-Control', '')
              payload = response.read(65537)
              assert len(payload) <= 65536
          manifest = public_to_manifest(json.loads(payload))
          path = Path(os.environ['RUNNER_TEMP']) / 'mouse-current-downloads.json'
          path.write_text(json.dumps(manifest))
          spec = importlib.util.spec_from_file_location('mouse_sync_identity', 'infra/website/sync-releases.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          identity = module.deployment_id(os.environ['GITHUB_SHA'], manifest)
          (Path(os.environ['RUNNER_TEMP']) / 'mouse-deployment-id').write_text(identity)
          print('MOUSE_PUBLIC_CATALOG_RESOLVED deployment=' + identity)
          PY
          identity=$(cat "$RUNNER_TEMP/mouse-deployment-id")
          [[ "$identity" =~ ^[0-9a-f]{40}$ ]]
          python3 infra/website/build-site.py --output "$RUNNER_TEMP/mouse-website-expected" --downloads "$RUNNER_TEMP/mouse-current-downloads.json"
          python3 infra/website/verify-seo.py "$RUNNER_TEMP/mouse-website-expected" --downloads "$RUNNER_TEMP/mouse-current-downloads.json"
          python3 infra/website/verify-pages-live.py --site "$RUNNER_TEMP/mouse-website-expected" --release "$identity" --downloads "$RUNNER_TEMP/mouse-current-downloads.json" | tee "$RUNNER_TEMP/mouse-website-live.txt"
          printf '\n**Verified live:** exact renderer and current per-platform catalog, same-domain HTTPS, 72-language SEO, and all three complete installer hashes/HEAD/Range responses. Open pages refresh only from mouse.black.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse-website-deployment-evidence
          path: |
            ${{ runner.temp }}/mouse-website-sync.txt
            ${{ runner.temp }}/mouse-website-live.txt
            ${{ runner.temp }}/mouse-current-downloads.json
            ${{ runner.temp }}/mouse-deployment-id
          if-no-files-found: ignore
          retention-days: 14
