name: Retired tool package boundary
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Ensure removed tools cannot load from the new package
        run: node tests/lite-package-438.cjs
      - name: Check retained chat rendering and transcript isolation
        run: |
          node tests/chat-content-3214.cjs
          node tests/chat-sync-plaintext-3217.cjs
          node tests/privacy-no-mirroring.cjs
      - name: Verify canonical owner identity
        run: node --test tests/owner-totp-enrollment.cjs
