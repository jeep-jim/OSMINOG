name: Retired studio compatibility
on:
  pull_request:
    paths:
      - 'osminog-animation-studio.*'
      - 'osminog-graphics-studio.js'
      - 'osminog-workspace-polish.*'
      - 'bridge.js'
      - 'editor.html'
      - 'tests/retired-features-416.cjs'
      - '.github/workflows/animation-studio-3206.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check osminog-graphics-studio.js
      - run: node --check bridge.js
      - run: node tests/retired-features-416.cjs
