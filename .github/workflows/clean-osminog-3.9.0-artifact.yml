name: Clean truncated OSMINOG 3.9.0 artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-osminog-3.9.0-artifact.yml'

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove truncated binary and correct canonical status
        shell: bash
        run: |
          set -euo pipefail
          rm -f artifacts/chrome/3.9.0/OSMINOG-Chrome-3.9.0-TEAM-OS-ROOT.zip
          rm -f bootstrap/osminog-3.9.0.zip.b64.part00
          python - <<'PY'
          from pathlib import Path
          import json
          path = Path('versions/3.9.0/build.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['artifact'] = 'OSMINOG-Chrome-3.9.0-TEAM-OS-ROOT.zip'
          data['artifactGitHubStatus'] = 'pending: connector binary upload was truncated and removed; verified package remains the owner-installed 3.9.0 build'
          data['artifactExpectedSize'] = 255229
          data['artifactExpectedSha256'] = 'd0a8fa70ce1929688ec738a0dcfba2c1436a3c4ca403b4cd2228a6ae3f93db97'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          log = Path('OSMINOG_PROJECT_LOG.md')
          text = log.read_text(encoding='utf-8')
          marker = '### Artifact storage correction for 3.9.0'
          if marker not in text:
              text += '''\n\n### Artifact storage correction for 3.9.0\n- The owner-confirmed installation and 3.9.0 runtime baseline remain valid.\n- A GitHub connector attempt produced a truncated 15,008-byte binary, so that invalid file was removed and is **not** treated as the release package.\n- The verified package remains `OSMINOG-Chrome-3.9.0-TEAM-OS-ROOT.zip`, expected size `255229` bytes and SHA-256 `d0a8fa70ce1929688ec738a0dcfba2c1436a3c4ca403b4cd2228a6ae3f93db97`.\n- Project state, build metadata and continuation memory are stored in GitHub; a proper full binary upload remains pending and must not be claimed complete until its remote size and checksum match.\n'''
              log.write_text(text, encoding='utf-8')
          PY
      - name: Commit correction and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/clean-osminog-3.9.0-artifact.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Correct OSMINOG 3.9.0 artifact storage status'
          git push origin HEAD:main
