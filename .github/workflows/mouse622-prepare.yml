name: Prepare pinned Mouse622 agent dependencies
on:
  push:
    branches: [feat/mouse622-five-modes-agent]
    paths: ['.github/workflows/mouse622-prepare.yml','desktop/mouse-agent/package.json']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Resolve pinned versions without executing dependency lifecycle scripts
        working-directory: desktop/mouse-agent
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high --json > audit.json
      - name: Export exact source and resolved dependency lock for local review
        if: always()
        run: |
          mkdir -p export
          git archive HEAD desktop/mouse/modes.js desktop/mouse-agent | tar -x -C export
          cp desktop/mouse-agent/package-lock.json desktop/mouse-agent/audit.json export/desktop/mouse-agent/
          cat desktop/mouse-agent/audit.json
          cp -R desktop/mouse-agent/node_modules export/desktop/mouse-agent/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse622-pinned-agent-foundation
          path: export/
          retention-days: 3
