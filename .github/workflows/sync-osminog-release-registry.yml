name: Sync OSMINOG release registry

on:
  push:
    branches: [main]
    paths:
      - 'release-registry-update-queue/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osminog-release-registry
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply queued release metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-registry-update-archive
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('releases/osminog-registry.json')
          data = json.loads(path.read_text())
          queue = sorted(Path('release-registry-update-queue').glob('*.json'))
          for item in queue:
              q = json.loads(item.read_text())
              data['updatedAt'] = q.get('updatedAt', data.get('updatedAt'))
              if q.get('currentDevelopment'):
                  data['currentDevelopment'] = q['currentDevelopment']
              if q.get('nextCandidate'):
                  data['nextCandidate'] = q['nextCandidate']
              chrome = data.setdefault('platforms', {}).setdefault('chrome-extension', {})
              if q.get('currentVersion'):
                  chrome['currentVersion'] = q['currentVersion']
              if q.get('candidateVersion'):
                  chrome['candidateVersion'] = q['candidateVersion']
              release = q.get('release')
              if release:
                  releases = data.setdefault('releases', [])
                  releases = [r for r in releases if r.get('version') != release.get('version') or r.get('platform') != release.get('platform')]
                  releases.insert(0, release)
                  data['releases'] = releases
              item.rename(Path('release-registry-update-archive') / item.name)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/osminog-registry.json release-registry-update-queue release-registry-update-archive
          if ! git diff --cached --quiet; then
            git commit -m "Update OSMINOG release registry"
            git push
          fi
