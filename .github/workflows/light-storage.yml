name: Light storage 5.0.0 extension and desktop
on:
  pull_request:
    paths: ['light/**', '.github/workflows/light-storage.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --package-lock=false fake-indexeddb@6.2.4 playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node --test light/tests/store.cjs
      - run: python3 -c "import zipfile; z=zipfile.ZipFile('artifacts/light-test.zip'); assert z.testzip() is None"
      - run: python3 light/build.py
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: xvfb-run -a node light/tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OSMINOG-Light-5.0.0-extension
          path: |
            artifacts/OSMINOG-Chrome-5.0.0.zip
            artifacts/OSMINOG-Update-Recovery.html
            artifacts/light-browser-results.json
            artifacts/light-workspace.png
  windows-extension:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm install --no-save --package-lock=false fake-indexeddb@6.2.4 playwright@1.62.1
      - run: npx playwright install chromium
      - run: python light/build.py
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: node light/tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OSMINOG-Light-5.0.0-Windows-Chrome-report
          path: |
            artifacts/light-browser-results.json
            artifacts/light-workspace.png
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: light/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm install --package-lock=false
      - run: npm run smoke
      - if: runner.os == 'Windows'
        run: npm run build:win
      - if: runner.os == 'macOS'
        run: npm run build:mac
      - name: Launch the installed Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/*.exe | Select-Object -First 1).FullName
          $destination = Join-Path $env:RUNNER_TEMP 'osminog-light-installed'
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $binary = Join-Path $destination 'OSMINOG Light.exe'
          $process = Start-Process -FilePath $binary -ArgumentList '--smoke' -Wait -PassThru -RedirectStandardOutput native-installed.log -RedirectStandardError native-installed-errors.log
          Get-Content native-installed.log
          Get-Content native-installed-errors.log
          if ($process.ExitCode -ne 0) { throw "Installed app failed: $($process.ExitCode)" }
          if (-not (Select-String -Path native-installed.log -Pattern 'LIGHT_NATIVE_PASS' -Quiet)) { throw 'Missing native success marker' }
      - name: Launch universal macOS application
        if: runner.os == 'macOS'
        run: '"dist/mac-universal/OSMINOG Light.app/Contents/MacOS/OSMINOG Light" --smoke'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OSMINOG-Light-5.0.0-${{ runner.os }}
          path: |
            light/desktop/dist/*.exe
            light/desktop/dist/*.dmg
            light/desktop/dist/*.zip
