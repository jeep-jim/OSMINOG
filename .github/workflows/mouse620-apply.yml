name: Apply Mouse620 owner source
on:
  push:
    branches: ['fix/mouse620-local-library']
    paths: ['.github/workflows/mouse620-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'jeep-jim/OSMINOG' && github.ref == 'refs/heads/fix/mouse620-local-library'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate all source hashes, apply and run132 tests
        run: |
          set -euo pipefail
          node tools/apply-mouse620.cjs
          node desktop/mouse-icon.cjs
          git diff --check
          find desktop -maxdepth 1 -name 'mouse-*.cjs' -exec node --check {} \;
          (cd desktop && node --test mouse-*.test.cjs) > mouse620-tests.log
          tail -12 mouse620-tests.log
      - name: Remove transport and commit guarded source
        run: |
          set -euo pipefail
          BRANCH=fix/mouse620-local-library
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git rm tools/mouse620-payload-br1.txt tools/mouse620-payload-br2.txt tools/mouse620-payload-br3.txt tools/apply-mouse620.cjs .github/workflows/mouse620-apply.yml
          git add -- desktop tools/mouse-verify.py tools/mouse-update-verify.py MOUSE_BROWSER_ROADMAP.md .github/workflows/mouse-macos.yml .github/workflows/mouse620-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Mouse620: owner head and Dock, update progress, opt-in local archive,12px corners and meaningful history'
          git push origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD > mouse620-applied-sha.txt
          git archive --format=tar HEAD desktop tools .github MOUSE_BROWSER_ROADMAP.md > mouse620-applied.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse620-source-applied
          path: |
            mouse620-tests.log
            mouse620-applied-sha.txt
            mouse620-applied.tar
          retention-days: 2
