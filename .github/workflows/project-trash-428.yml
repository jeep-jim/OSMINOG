name: Chrome preserved trash and migration recovery
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Retain trash, valid empty workspaces and interrupted migration
        run: node tests/core-store-438.cjs
      - name: Retain exact tracked source for release audit
        run: git archive --format=zip HEAD --output=source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OSMINOG-source-${{ github.sha }}
          path: source.zip
          retention-days: 3
