name: Chrome release regression diagnostics
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install the pinned browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Prepare local OCR and standalone recovery
        run: |
          python3 tools/prepare_ocr.py
          node tools/build-updater-recovery.cjs
      - name: Collect every retained browser regression without hiding failures
        run: xvfb-run -a python3 tests/release-diagnostics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chrome-release-diagnostics
          path: |
            artifacts/diagnostics/
            artifacts/*439*
            artifacts/update*437*
          retention-days: 7
