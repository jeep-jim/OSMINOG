name: Quadro 604 source snapshot
on:
  push:
    branches: [codex/quadro-604-overlays-start]
    paths: [.github/workflows/quadro-604-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 961ecd207b2d27d4cd8b32f392b034cb3431c387
      - run: git archive --format=zip HEAD desktop tools/quadro-verify.py .github/workflows/quadro-macos.yml AGENTS.md OSMINOG_ROADMAP.md OSMINOG_PROJECT_LOG.md OSMINOG_BROWSER_ROADMAP.md docs/desktop > quadro-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: quadro-604-source
          path: quadro-source.zip
          retention-days: 1
