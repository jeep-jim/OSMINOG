name: Mouse Browser macOS arm64
on:
  pull_request:
    paths: ['desktop/browser.cjs','desktop/mouse-*','desktop/mouse/**','desktop/mouse-browser.test.cjs','tools/mouse-verify.py','tools/mouse-update-verify.py','.github/workflows/mouse-macos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mouse-arm64:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: test "$(uname -m)" = arm64
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high --json > mouse-audit.json
      - run: npm test
      - run: node --test mouse-browser.test.cjs mouse-lifecycle.test.cjs mouse-capture.test.cjs mouse-library.test.cjs mouse-library-view.test.cjs mouse-overlays.test.cjs mouse-start.test.cjs mouse-polish.test.cjs mouse-global-capture.test.cjs mouse-606.test.cjs mouse-private.test.cjs mouse-607.test.cjs mouse-608.test.cjs mouse-609.test.cjs mouse-611.test.cjs mouse-612.test.cjs mouse-613.test.cjs mouse-614.test.cjs mouse-615.test.cjs mouse-616.test.cjs mouse-617.test.cjs mouse-emoji.test.cjs mouse-tab-flow.test.cjs mouse-620.test.cjs mouse-capture-archive.test.cjs mouse-history.test.cjs
      - run: npm run prepare:runtime
      - run: node mouse-native-build.cjs
      - run: node mouse-icon.cjs
      - name: Verify owner-supplied mouse source and both app themes
        run: node --test mouse-606.test.cjs mouse-private.test.cjs mouse-607.test.cjs mouse-608.test.cjs mouse-609.test.cjs mouse-611.test.cjs mouse-612.test.cjs mouse-613.test.cjs mouse-614.test.cjs mouse-615.test.cjs mouse-616.test.cjs mouse-617.test.cjs mouse-emoji.test.cjs mouse-tab-flow.test.cjs mouse-620.test.cjs mouse-capture-archive.test.cjs mouse-history.test.cjs mouse-library-view.test.cjs
      - name: Build native Mouse DMG and ZIP
        run: npx electron-builder --config mouse-build.cjs --mac dmg zip --arm64 --publish never
      - name: Verify installed app, screenshots, controls and saved profile
        shell: bash
        run: |
          set -euo pipefail
          APP="dist-mouse/mac-arm64/Mouse Browser.app"
          test "$(lipo -archs "$APP/Contents/MacOS/Mouse Browser")" = arm64
          codesign --verify --deep --strict "$APP"
          INSTALL="$RUNNER_TEMP/Проверка Mouse/Mouse Browser.app"
          mkdir -p "$(dirname "$INSTALL")"
          ditto "$APP" "$INSTALL"
          python3 ../tools/mouse-verify.py "$INSTALL/Contents/MacOS/Mouse Browser"
          grep -q MOUSE_610_PURPLE_GLASSES_AND_ALL_FOOTER_PIXELS_BOTH_THEMES_PASS mouse-smoke-write.log
          grep -q MOUSE_611_PRIVATE_THEME_ASSETS_AND_LIVE_SWITCH_PASS mouse-mouse-private-smoke.log
          grep -q MOUSE_612_AI_LOGOS_NAV_ACTIVE_AND_ADJACENT_PLUS_PASS mouse-smoke-write.log
          grep -q MOUSE_612_DESTROYED_GUESTS_DISPOSE_AND_SHELL_RECOVERY_PASS mouse-smoke-write.log
          grep -q MOUSE_613_TABS_SWAP_ADDRESS_AI_CHROME_PASS mouse-smoke-write.log
          grep -q MOUSE_614_AI_FULLSCREEN_RESTORE_NORMAL_PASS mouse-smoke-write.log
          grep -q MOUSE_614_REAL_UPDATE_BADGE_BOTH_THEMES_AND_BURROW_CLICK_PASS mouse-smoke-write.log
          grep -q MOUSE_614_AI_FULLSCREEN_RESTORE_PRIVATE_PASS mouse-mouse-private-smoke.log
          grep -q MOUSE_616_ARCH_PLUS_AND_SEPARATE_FOOTER_BOTH_THEMES_PASS mouse-smoke-write.log
          grep -q MOUSE_616_CONTROLS_LOADING_FULLSCREEN_CORNERS_NO_WALLET_PASS mouse-smoke-write.log
          grep -q MOUSE_617_NATIVE_ADDRESS_CLICKS_HEAD_10PX_FOOTER_PASS mouse-smoke-write.log
          grep -q MOUSE_618_BURROW_DOWN1_SHORTER3_BOTH_THEMES_PASS mouse-smoke-write.log
          grep -q MOUSE_620_REAL_619_TO_620_REPLACE_RELAUNCH_PROFILE_PASS mouse-update-roundtrip.log
          grep -q MOUSE_619_EMOJI_FOOTER_PAGE_AI_SHELL_FOCUS_PASS mouse-smoke-write.log
          grep -q MOUSE_619_NATIVE_CHARACTER_VIEWER_VISIBLE_PASS mouse-smoke-write.log
          grep -q MOUSE_619_EMOJI_PRIVATE_FOCUS_AND_INSERTION_PASS mouse-mouse-private-smoke.log
          grep -q MOUSE_619_ACTIVE_TAB_FLOW_MATCHED_RIM_BOTH_THEMES_PASS mouse-smoke-write.log
          grep -q MOUSE_619_LIBRARY_ICONS_VIEWS_TOPBAR_SELECTION_SAFE_CLEAR_PASS mouse-smoke-write.log
          grep -q MOUSE_620_REAL_HISTORY_NO_ACTION_FLOOD_PASS mouse-smoke-write.log
          grep -q MOUSE_620_UPDATE_HEAD_PREVIEW_ARCHIVE_CONTROLS_PASS mouse-smoke-write.log
          grep -q MOUSE_620_INSTALLED_ICNS_DOCK_UI_HEAD_PASS mouse-smoke-write.log
      - name: Bind release bytes to verified source
        run: |
          (cd dist-mouse && shasum -a 256 *.dmg *.zip > SHA256SUMS.txt)
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          fs.writeFileSync('dist-mouse/mouse-build.json',JSON.stringify({version:'6.0.20',source:cp.execSync('git rev-parse HEAD').toString().trim(),runId:process.env.GITHUB_RUN_ID,arch:process.arch,platform:process.platform,signing:'ad-hoc',notarized:false,wallet:{removed:true,legacyDataPreserved:true},globalCapture:{shortcut:'Control+A',requiresScreenPermission:true,worksOnlyWhileRunning:true,systemPicker:true},productName:'Mouse Browser',tests:['history-meaningful-visits-not-actions','update-minimized-live-progress','head-everywhere-native-icons','download-image-previews','local-opt-in-clipboard-and-screenshot-copies','capture-off-private-no-read','aligned-checkboxes-ai-square-controls','real-619-to-620-profile-preserving-install','library-favicons-file-icons-list-grid-safe-selection','active-tab-flow-and-rim-match-divider','native-emoji-picker-macos-visible','emoji-owned-page-ai-shell-focus','emoji-private-workspace-routing','emoji-windows-api-contract','burrow-down1-height-minus3-width-preserved','owner-exact-128-pixel-small-head','address-focus-native-buttons-first-click','twelve-pixel-pane-corners-clean-compositor','fractional-viewport-endpoints-no-rim','footer-preserved-ai-status-only-hidden','grounded-gradient-burrow-hover-only-plus','arched-burrow-plus-no-glow','unified-controls-loading-fullscreen-corners','wallet-removed-no-provider','separated-footer-library-original-controls','real-update-badge-normal-mode-metadata-only','mouse-burrow-new-tab-button','ai-fullscreen-restore-normal-private-no-reload','tabs-fit-swap-expand-address-ai-height-selection','ai-bundled-official-picker','ai-history-buttons','cyan-ai-active-both-themes','adjacent-new-tab','head-glasses-theme-identical','destroyed-view-lifetime','bounded-shell-recovery','private-theme-light-dark-live','purple-incognito-glasses','toolbar-glasses-pixels-both-themes','capture-legacy-recovery-picker-single-frame','large-update-mascot','resize-transient-size-hud','native-tab-click-below-apple-menu','square-white-private-mascot','fixed-light-dock','pane-fullscreen-restore','screen-capturekit-module','static-update-channel','verified-update-installer','installed-icns-dock-ui-owner-head','private-memory-isolation','private-cleanup-disk-scan','private-mascot-glasses','start-control-contrast','capture-success-feedback','native-apple-menu-preserved','owner-mouse-icon','compact-ai-provider-icons','right-library-sidebar','glass-spacing','monochrome-icon-contrast','dynamic-menu-reveal','global-shortcut-registration','background-capture-editor','permission-denial','overlay-lifetime-race','all-footer-modals','native-select-replacement','visual-bookmarks','custom-background','custom-ai-url','actual-native-checks','profile-cookie-restart','capture-region-annotations','capture-clipboard-png','normal-close','fullscreen-close','fullscreen-quit']},null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: mouse-arm64-candidate
          path: |
            desktop/dist-mouse/*.dmg
            desktop/dist-mouse/*.zip
            desktop/dist-mouse/SHA256SUMS.txt
            desktop/dist-mouse/mouse-build.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse-arm64-verification
          path: |
            desktop/mouse-*.log
            desktop/mouse-*.png
            desktop/mouse-audit.json
            desktop/mouse-619-*.json
          retention-days: 14
