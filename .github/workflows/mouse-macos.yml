          grep -q MOUSE_628_OPEN_NORA_DESKTOP_SLIDE_NATIVE_PASS mouse-smoke-write.log
          grep -q MOUSE_629_TWO_FINGER_WHEEL_TUTORIAL_NATIVE_PASS mouse-smoke-read.log
          grep -q MOUSE_629_UI_REGRESSIONS_NATIVE_PASS mouse-smoke-write.log
