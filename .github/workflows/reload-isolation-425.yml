name: Diagnose isolated Chrome reload 4.0.25
on:
  push:
    branches: [fix/io-recovery-4.0.25]
    paths: ['tests/reload-isolation-425.cjs', '.github/workflows/reload-isolation-425.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - run: xvfb-run -a node tests/reload-isolation-425.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reload-isolation-425
          path: artifacts/reload-isolation-425.json
          retention-days: 2
