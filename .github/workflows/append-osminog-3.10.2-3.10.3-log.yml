name: Append OSMINOG 3.10.2 and 3.10.3 project log

on:
  push:
    branches: [main]
    paths: ['.github/workflows/append-osminog-3.10.2-3.10.3-log.yml']

permissions:
  contents: write

jobs:
  append:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append canonical continuation record
        run: |
          python - <<'PY'
          from pathlib import Path
          log = Path('OSMINOG_PROJECT_LOG.md')
          fragment = Path('recovery/append-osminog-3.10.2-3.10.3.md')
          current = log.read_bytes()
          if b'OSMINOG 3.10.3 WINDOWS FOLDERS' not in current:
              log.write_bytes(current + fragment.read_bytes())
          PY
      - name: Commit append and remove one-shot files
        run: |
          git rm -f .github/workflows/append-osminog-3.10.2-3.10.3-log.yml recovery/append-osminog-3.10.2-3.10.3.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OSMINOG_PROJECT_LOG.md
          git diff --cached --quiet || git commit -m 'Append OSMINOG 3.10.2 and 3.10.3 project log'
          git push origin HEAD:main
