name: Mouse 6.0.37 macOS preset diagnostic only
on:
  push:
    branches: ['diagnostic/mouse-637-preset-2b73ad7b']
permissions:
  contents: read
jobs:
  diagnostic-only:
    if: github.ref == 'refs/heads/diagnostic/mouse-637-preset-2b73ad7b'
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Bind this isolated diagnostic to the exact failed release source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA 2b73ad7b7924bf8e87fa0932eea672fe2bb89f52"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: test "$(uname -m)" = arm64
      - run: npm ci
      - name: Prepare the existing packaged runtime
        run: |
          npm ci --prefix mouse-agent
          node mouse-agent/prepare.cjs
          npm run prepare:runtime
          node mouse-native-build.cjs
          node mouse-icon.cjs
      - name: Diagnostic isolation and affected scenario contracts
        run: |
          node --test mouse-637-preset-diagnostic.test.cjs mouse-637-presets-smoke.test.cjs mouse-desktops.test.cjs mouse-preference-save.test.cjs
          python3 ../tools/test_mouse637_preset_diagnostic.py -v
      - name: Build an isolated app directory without release packages
        run: npx electron-builder --config mouse-build.cjs --mac dir --arm64 --publish never
      - name: Run exactly one unchanged feature WRITE with bounded diagnostic recording
        run: |
          set -euo pipefail
          xcrun swift ../tools/mouse-637-macos-display.swift --output mouse-637-preset-diagnostic-display.json
          xcrun swift ../tools/mouse-637-macos-display.swift --verify mouse-637-preset-diagnostic-display.json
          APP="dist-mouse/mac-arm64/Mouse Browser.app"
          test "$(lipo -archs "$APP/Contents/MacOS/Mouse Browser")" = arm64
          codesign --verify --deep --strict "$APP"
          INSTALL="$RUNNER_TEMP/Mouse preset diagnostic/Mouse Browser.app"
          mkdir -p "$(dirname "$INSTALL")"
          ditto "$APP" "$INSTALL"
          python3 ../tools/mouse-637-preset-diagnostic.py "$INSTALL/Contents/MacOS/Mouse Browser" --output "$GITHUB_WORKSPACE/desktop/mouse-637-preset-diagnostic"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mouse-637-macos-preset-diagnostic-only
          path: |
            desktop/mouse-637-preset-diagnostic-display.json
            desktop/mouse-637-preset-diagnostic/**
          if-no-files-found: error
          retention-days: 14
