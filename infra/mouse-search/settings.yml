# SearXNG upstream is pinned by upstream-revision. Only these public engines are loaded.
use_default_settings:
  engines:
    keep_only:
      - brave
      - duckduckgo
      - bing
      - brave.videos
      - duckduckgo videos
      - bing videos
      - yahoo
general:
  debug: false
  instance_name: Mouse Search
  enable_metrics: false
search:
  safe_search: 1
  autocomplete: ''
  formats: [json]
  max_page: 30
server:
  secret_key: overridden-by-SEARXNG_SECRET
  limiter: false
  public_instance: false
  image_proxy: false
  method: POST
  base_url: https://osminog.red:3082/
outgoing:
  request_timeout: 4.0
  max_request_timeout: 6.0
  pool_connections: 12
valkey:
  url: false
engines:
  - name: brave
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: bing
    disabled: false
  - name: brave.videos
    disabled: false
  - name: duckduckgo videos
    disabled: false
  - name: bing videos
    disabled: false
  - name: yahoo
    disabled: false
