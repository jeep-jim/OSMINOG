# Install only after the domain certificate exists and nginx -t passes.
server {
    listen 80;
    server_name osminog.red www.osminog.red;
    location /.well-known/acme-challenge/ { root /opt/osminog/acme; }
    location / { return 301 https://osminog.red$request_uri; }
}
server {
    listen 443 ssl;
    server_name osminog.red www.osminog.red;
    ssl_certificate /etc/letsencrypt/live/osminog.red/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/osminog.red/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host = www.osminog.red) { return 301 https://osminog.red$request_uri; }
    client_max_body_size 3m;
    client_body_timeout 15s;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:3081;
        proxy_set_header Host osminog.red;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }
}
