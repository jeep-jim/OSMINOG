# Separate pre-DNS virtual host. Never edit the existing avtocena.com hosts.
server {
    listen 80;
    server_name osminog.red www.osminog.red;
    access_log off;
    client_max_body_size 3m;
    location /.well-known/acme-challenge/ { root /opt/osminog/acme; }
    location / { return 503 'OSMINOG is preparing HTTPS. No private messages accepted over HTTP.'; add_header Content-Type text/plain; }
}
