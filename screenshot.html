<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OSMINOG Screenshot</title>
  <link rel="stylesheet" href="screenshot.css">
</head>
<body>
  <header>
    <div class="brand"><img src="icons/icon48.png" width="38" height="38" alt=""><div><strong>OSMINOG Screenshot</strong><span id="subtitle">Select the area you want to keep</span></div></div>
    <div class="header-actions"><button id="reset" class="ghost">Reset selection</button><button id="close" class="close-button" title="Close">×</button></div>
  </header>
  <main>
    <section class="canvas-card">
      <div id="empty" hidden>No screenshot is waiting. Start a new capture from the OSMINOG toolbar or extension popup.</div>
      <canvas id="cropCanvas" aria-label="Screenshot crop area"></canvas>
    </section>
    <aside>
      <div class="step"><span>1</span><div><b id="stepTitle">Select an area</b><p id="stepHint">Drag over the screenshot. Drag again to replace the selection.</p></div></div>
      <div id="selectionInfo" class="selection-info">—</div>
      <section class="annotation-tools">
        <strong id="toolsTitle">Annotation tools</strong>
        <div class="tool-grid">
          <button data-tool="crop" class="active" title="Crop">⌗</button><button data-tool="pen" title="Pen">✎</button><button data-tool="line" title="Line">╱</button><button data-tool="arrow" title="Arrow">➜</button><button data-tool="rect" title="Rectangle">□</button><button data-tool="ellipse" title="Ellipse">○</button><button data-tool="text" title="Text">T</button><button id="undoAnnotation" title="Undo">↶</button>
        </div>
        <div class="tool-options"><input id="drawColor" type="color" value="#ffdf31" title="Color"><select id="drawWidth" title="Stroke width"><option value="3">3 px</option><option value="6" selected>6 px</option><option value="10">10 px</option><option value="16">16 px</option></select></div>
      </section>
      <button id="copy" class="primary">Copy to clipboard</button>
      <button id="download">Save PNG</button>
      <button id="openEditor">Open in OSMINOG</button>
      <p id="status" role="status">The image stays on this device.</p>
    </aside>
  </main>
  <script src="screenshot.js"></script>
</body>
</html>
