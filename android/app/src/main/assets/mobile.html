<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=3"><title>Осьминог · столы</title>
<style>
:root{color-scheme:dark;font:15px system-ui;color:#ecf2ff;background:#101a2b;--line:#30415b;--muted:#9fb0ca;--accent:#66e2cf}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{color:inherit;background:#1e3049;border:1px solid var(--line);border-radius:13px;min-height:44px;padding:8px 14px}button:active{background:#304861}button:focus-visible{outline:2px solid var(--accent)}header{padding:20px 18px 12px;background:#101a2b;position:sticky;top:0;z-index:5}h1{font-size:25px;letter-spacing:-.6px;margin:0}header p{color:var(--muted);font-size:12px;line-height:1.5;margin:7px 0 14px}.heading{display:flex;justify-content:space-between;align-items:center}.mark{color:var(--accent);font-size:30px}#desks{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}#desks button{white-space:nowrap;flex-shrink:0}#desks [aria-pressed=true]{color:#0b2724;background:var(--accent);border-color:var(--accent)}#scroll{overflow:auto;height:calc(100dvh - 156px);overscroll-behavior:contain;background:radial-gradient(#263a53 1px,transparent 1px);background-size:22px 22px}#canvas{position:relative;width:max(100%,800px);height:1400px}.card{position:absolute;width:160px;background:#1c2b40;border:1px solid #3b506d;border-radius:17px;box-shadow:0 10px 28px #0003;padding:12px;user-select:none}.card .handle{touch-action:none;display:flex;align-items:center;justify-content:space-between;height:36px;color:#7ce5d2;font-size:24px;cursor:grab}.card .grip{color:#8499b6;font-size:18px}.card strong{display:block;overflow-wrap:anywhere;font-size:14px;line-height:1.4;margin:10px 0 7px}.card small{display:block;color:var(--muted);font-size:11px}.card .open{background:transparent;width:100%;padding:0;text-align:left;border:0;min-height:60px}.card.selected{outline:2px solid var(--accent);z-index:4}#empty{position:absolute;left:20px;top:30px;width:min(320px,calc(100vw - 40px));color:var(--muted);line-height:1.6}#empty h2{font-size:21px;color:#e7f0ff}#empty button{background:#66e2cf;color:#0b2724;margin-top:12px}dialog{background:#17253a;color:#edf3ff;border:1px solid #425674;border-radius:23px;width:calc(100% - 28px);max-width:440px;padding:20px}dialog::backdrop{background:#0009}dialog h2{margin:0 0 14px;font-size:19px;overflow-wrap:anywhere}dialog button{display:block;width:100%;margin:8px 0;text-align:left}dialog .close{color:var(--muted);text-align:center;background:transparent}#toast{position:fixed;bottom:16px;left:16px;right:16px;padding:12px;background:#203b52;border-radius:14px;z-index:10}input{background:#0d1929;color:#fff;border:1px solid #526987;border-radius:10px;padding:12px;width:100%}@media(min-width:700px){header{padding-left:28px}#canvas{width:max(100%,1200px)}.card{width:200px}}
</style>
<header><div class="heading"><h1>Мои столы</h1><span class="mark" aria-hidden="true">✳</span></div><p>Файлы остаются на устройстве. Перетаскивайте за ручку карточки.</p><nav id="desks" aria-label="Рабочие столы"></nav></header><main id="scroll"><div id="canvas"><section id="empty"><h2>Место для ваших идей</h2><p>Добавьте файлы, соберите их на столах и передайте выбранный файл в чат ИИ.</p><button onclick="send('import')">＋ Добавить файл</button></section></div></main><dialog id="menu"></dialog><div id="toast" role="status" hidden></div>
<script>
'use strict';let layout={active:'main',desks:[{id:'main',name:'Рабочий стол'}],items:{}},files=[];
const $=s=>document.querySelector(s),send=(op,args={})=>{if(window.Osminog)Osminog.postMessage(JSON.stringify({op,...args}));else notice('Связь с приложением недоступна')},save=()=>send('save',{layout});
function notice(text){$('#toast').textContent=text;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,4500)}
function receiveNative(state,list){if(Array.isArray(state.desks)&&state.desks.length&&state.items&&typeof state.items==='object'){layout=state;if(!layout.desks.some(d=>d.id===layout.active))layout.active=layout.desks[0].id;}files=list;render()}
function addImported(file){if(!files.some(f=>f.id===file.id))files.push(file);if(!layout.items[file.id]){const count=Object.values(layout.items).filter(i=>i.desk===layout.active).length;layout.items[file.id]={desk:layout.active,x:20+(count%2)*178,y:25+Math.floor(count/2)*190};save();}render()}
function render(){const nav=$('#desks');nav.replaceChildren();for(const d of layout.desks){const b=document.createElement('button');b.textContent=d.name;b.dataset.desk=d.id;b.setAttribute('aria-pressed',String(layout.active===d.id));b.onclick=()=>{layout.active=d.id;save();render()};nav.append(b)}const add=document.createElement('button');add.textContent='＋ Стол';add.onclick=newDesk;nav.append(add);const canvas=$('#canvas');canvas.querySelectorAll('.card').forEach(c=>c.remove());let count=0;for(const file of files){const pos=layout.items[file.id];if(!pos||pos.desk!==layout.active)continue;count++;const card=document.createElement('article');card.className='card';card.style.left=pos.x+'px';card.style.top=pos.y+'px';const handle=document.createElement('div');handle.className='handle';handle.setAttribute('aria-label','Переместить файл');handle.innerHTML='<span>▤</span><span class="grip">⠿</span>';const open=document.createElement('button');open.className='open';const name=document.createElement('strong');name.textContent=file.name;const size=document.createElement('small');size.textContent=(file.size/1024/1024).toFixed(1)+' МБ · на устройстве';open.append(name,size);open.onclick=()=>fileMenu(file);card.append(handle,open);canvas.append(card);let drag=null;handle.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,startX:pos.x,startY:pos.y};handle.setPointerCapture(e.pointerId);card.classList.add('selected');e.preventDefault()};handle.onpointermove=e=>{if(!drag)return;pos.x=Math.max(0,Math.min(1100,drag.startX+e.clientX-drag.x));pos.y=Math.max(0,Math.min(1200,drag.startY+e.clientY-drag.y));card.style.left=pos.x+'px';card.style.top=pos.y+'px'};handle.onpointerup=e=>{if(!drag)return;drag=null;const target=document.elementsFromPoint(e.clientX,e.clientY).find(el=>el.dataset.desk);if(target)pos.desk=target.dataset.desk;save();render()};handle.onpointercancel=()=>{drag=null;save();render()};}$('#empty').hidden=count>0;}
function modal(title,entries){const m=$('#menu');m.replaceChildren();const h=document.createElement('h2');h.textContent=title;m.append(h);for(const [label,fn]of entries){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{m.close();fn()};m.append(b)}const close=document.createElement('button');close.className='close';close.textContent='Закрыть';close.onclick=()=>m.close();m.append(close);m.showModal()}
function newDesk(){const m=$('#menu');m.replaceChildren();const h=document.createElement('h2');h.textContent='Новый стол';const input=document.createElement('input');input.placeholder='Название';input.maxLength=40;const b=document.createElement('button');b.textContent='Создать';b.onclick=()=>{const name=input.value.trim();if(!name)return;const id=crypto.randomUUID();layout.desks.push({id,name});layout.active=id;save();m.close();render()};const cancel=document.createElement('button');cancel.textContent='Отмена';cancel.onclick=()=>m.close();m.append(h,input,b,cancel);m.showModal();input.focus()}
function showDesks(){modal('Рабочие столы',[...layout.desks.map(d=>[d.name,()=>{layout.active=d.id;save();render()}]),['＋ Новый стол',newDesk]])}
function fileMenu(file){modal(file.name,[['Открыть файл',()=>send('open',{id:file.id})],['Передать в чат ИИ',()=>send('attach',{id:file.id})],['Перенести на другой стол',()=>modal('Выберите стол',layout.desks.map(d=>[d.name,()=>{layout.items[file.id].desk=d.id;save();render()}]))],['Поделиться файлом',()=>send('share',{id:file.id})]])}
render();send('ready');
</script></html>
