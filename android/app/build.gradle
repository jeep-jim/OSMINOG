plugins { id 'com.android.application' }
android {
 namespace 'com.osminog.mobile'
 compileSdk 35
 defaultConfig { applicationId 'com.osminog.mobile.preview'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0-preview'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { debug { applicationIdSuffix '' } }
}
dependencies {
 implementation 'androidx.webkit:webkit:1.12.1'
 implementation 'androidx.core:core:1.15.0'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test:core:1.6.1'
}
