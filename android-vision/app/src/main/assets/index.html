<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark"><title>OSMINOG</title><link rel="stylesheet" href="app.css"></head>
<body data-state="sleeping"><div id="scene">
  <div id="ocean" aria-hidden="true"><div id="plankton"></div><div id="bubbles"></div></div>
  <header><button id="menu" aria-label="Меню OSMINOG" aria-expanded="false" aria-controls="settings"><img src="design/star-idle.svg" alt="" width="75.227715" height="75.227715"><img class="active-star" src="design/star-active.svg" alt="" width="75.227715" height="75.227715"></button><img class="wordmark" src="design/wordmark.svg" alt="OSMINOG" width="106" height="14"></header>
  <main id="main" tabindex="-1"><section id="cameraArea" hidden><div id="cameraSlot"></div><span id="cameraHint">Камера включена · кадр отправляется с вопросом</span></section><section id="messages" aria-label="Переписка" aria-live="polite" aria-relevant="additions text"></section></main>
  <aside id="notice" role="status" aria-live="polite" hidden><img class="notice-creature" src="design/Group 29.svg" alt=""><div class="notice-bubble"><span id="noticeText"></span><button id="noticeAction" hidden>Открыть чат</button></div><button id="dismiss" aria-label="Закрыть уведомление">×</button></aside>
  <footer id="dock"><form id="composer" autocomplete="off"><textarea id="text" rows="1" maxlength="12000" placeholder="Как в воду глядел…" aria-label="Сообщение"></textarea><button id="eye" type="button" aria-label="Начать разговор" title="Разговор. С текстом — отправить. Во время ответа — остановить."><span class="eye-body"><span class="eye-iris"><span class="eye-pupil"></span></span></span></button></form><span id="status" class="sr-only" aria-live="polite">Глаз отдыхает</span></footer>
  <div id="sheetShade" hidden></div><section id="updateSheet" role="dialog" aria-modal="true" aria-labelledby="updateTitle" hidden><div class="sheet-creature"><img src="design/Group 29.svg" alt=""></div><div class="sheet-card"><button id="closeUpdate" class="sheet-close" aria-label="Закрыть">×</button><div class="sheet-kicker">OSMINOG · ОБНОВЛЕНИЕ</div><h2 id="updateTitle">Новая версия</h2><p id="updateNotes"></p><div class="update-meta"><span id="updateSize"></span><span>Подпись и контрольная сумма будут проверены</span></div><div id="updateProgress" class="update-progress" hidden><i></i></div><div class="sheet-actions"><button id="updateLater" class="sheet-secondary">Позже</button><button id="updateNow" class="sheet-primary">Обновить</button></div></div></section>
  <div id="providerSheet" hidden><div class="provider-sheet-card"><button id="closeProviderSheet" class="sheet-close" aria-label="Закрыть">×</button><div class="sheet-kicker">OSMINOG · ПОДКЛЮЧЕНИЕ</div><h2>Выбери своего ИИ</h2><div id="providerOptions"></div></div></div>
  <div id="shade" hidden></div><section id="settings" role="dialog" aria-modal="true" aria-labelledby="menuTitle" hidden><div class="menu-title"><h1 id="menuTitle">OSMINOG</h1><button id="closeMenu" aria-label="Закрыть меню">×</button></div><p id="connectionStatus">Подключи свой ИИ</p><nav aria-label="Управление"><button data-action="connect">Подключить ИИ <span id="providerName">ChatGPT</span></button><button data-action="openProvider">Открыть чат сервиса <span>↗</span></button><button data-action="voiceToggle">Разговор <span id="voiceValue">Выключен</span></button><button data-action="cameraToggle">Показать мир <span id="cameraValue">Выключено</span></button><button data-action="flip" id="flipMenu" hidden>Сменить камеру <span>↺</span></button><button data-action="stop">Завершить сеанс <span>◼</span></button><button data-action="motion">Планктон и пузыри <span id="motionValue">Включены</span></button><button data-action="update">Обновить онлайн <span id="version">0.2.2</span></button><button data-action="clear">Очистить историю на устройстве <span>⌫</span></button><button data-action="help">Как управлять глазом <span>?</span></button><button data-action="privacy">Голос, камера и приватность <span>ⓘ</span></button></nav></section>
</div><script src="app.js"></script></body></html>
